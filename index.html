<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BHS Maintenance : Planned Preventative Maintenance (PPM)</title>
<style>
  #ppm-root,#ppm-root *{box-sizing:border-box}
  #ppm-root{--ink:#1f2937;--ink-light:#374151;--paper:#ffffff;--line:#e5e7eb;--line-dark:#9ca3af;--accent:#2563eb;--accent-2:#1d4ed8;--bg:#f3f4f6;--input-bg:#f9fafb;--text-sec:#6b7280;--ok:#059669;--warn:#d97706;--crit:#dc2626;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:0;min-height:100vh;font-size:.875rem;line-height:1.4;position:relative}
  html,body{margin:0;background:#f3f4f6;overscroll-behavior-y:contain}
  .mono-font,#ppm-root input[type=date],#ppm-root input[type=time],#ppm-root .kpi-value,#ppm-root .doc-footer-code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  #ppm-root .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
  #ppm-root .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  #ppm-root .brand{display:flex;flex-direction:column;gap:2px}
  #ppm-root .brand .k{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sec);font-weight:700}
  #ppm-root .brand .t{font-size:1.125rem;font-weight:800;color:var(--ink)}
  #ppm-root .tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:10px}
  #ppm-root .tab-btn{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .15s}
  #ppm-root .tab-btn.active{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  #ppm-root .tab-btn:hover:not(.active){color:var(--ink)}

  /* Network & Auto-Refresh Indicator */
  #ppm-root .net-status-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #ppm-root .net-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid transparent}
  #ppm-root .net-dot{width:8px;height:8px;border-radius:999px;display:inline-block}
  #ppm-root .net-online{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
  #ppm-root .net-online .net-dot{background:#10b981}
  #ppm-root .net-offline{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  #ppm-root .net-offline .net-dot{background:#ef4444}
  #ppm-root .net-syncing{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  #ppm-root .net-syncing .net-dot{background:#2563eb;animation:ppmPulse 1s infinite}
  #ppm-root .sync-now-btn{border:1px solid #f59e0b;background:#fffbeb;color:#b45309;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
  #ppm-root .sync-now-btn:hover{background:#fef3c7}
  #ppm-root .refresh-indicator{display:none;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);border:1px solid #93c5fd;color:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.18);pointer-events:none;user-select:none}
  #ppm-root .refresh-indicator.visible{display:inline-flex;animation:ppmFadeIn .2s ease}
  #ppm-root .refresh-spin{display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;line-height:1;animation:ppmSpin .85s linear infinite}
  @keyframes ppmSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes ppmFadeIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  @keyframes ppmPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}

  /* KPI & Charts */
  #ppm-root .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:980px){#ppm-root .kpi-grid{grid-template-columns:repeat(2,1fr)}}
  #ppm-root .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:visible}
  #ppm-root .kpi-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
  #ppm-root .kpi-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sec);font-weight:700}
  #ppm-root .kpi-value{font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1;margin-top:2px}
  #ppm-root .kpi-sub{font-size:.75rem;color:var(--text-sec)}
  #ppm-root .kpi-pill{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:999px;width:fit-content;margin-top:2px}
  #ppm-root .pill-ok{background:#d1fae5;color:var(--ok)}
  #ppm-root .pill-warn{background:#fef3c7;color:var(--warn)}
  #ppm-root .pill-crit{background:#fee2e2;color:var(--crit)}

  #ppm-root .charts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:980px){#ppm-root .charts-grid{grid-template-columns:minmax(0,1fr)}}
  #ppm-root .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;overflow:hidden}
  #ppm-root .panel h3{margin:0 0 10px;font-size:.875rem;font-weight:800;color:var(--ink)}
  #ppm-root .panel .hint{font-size:.75rem;color:var(--line-dark);margin-bottom:8px}
  #ppm-root .export-chart-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;border:1px solid var(--line);font-size:.65rem;font-weight:700;color:var(--text-sec);cursor:pointer;background:var(--bg);transition:all .15s}
  #ppm-root .export-chart-btn:hover{background:var(--line);color:var(--ink)}

  /* Dropdowns (Multi-select & Searchable) */
  #ppm-root .dd-wrapper{position:relative;width:100%}
  #ppm-root .dd-btn{width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);font-size:.75rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;min-height:32px}
  #ppm-root .dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #ppm-root .dd-btn::after{content:"▼";font-size:.55rem;margin-left:6px;color:var(--line-dark);flex-shrink:0}
  #ppm-root .dd-menu{display:none;position:absolute;top:100%;left:0;width:100%;max-height:220px;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:7px;z-index:200;padding:8px;box-shadow:0 6px 16px rgba(0,0,0,.14);margin-top:4px}
  #ppm-root .dd-menu.open{display:flex;flex-direction:column;gap:6px}
  #ppm-root .dd-search{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:.75rem;background:var(--input-bg);margin-bottom:2px}
  #ppm-root .dd-selected-tags{font-size:.68rem;color:var(--text-sec);margin-top:3px;line-height:1.35}

  /* Table & Grouped Multi-Row PPM Records */
  #ppm-root .table-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  #ppm-root .table-scroll{width:100%;overflow-x:auto}
  #ppm-root table.list{width:100%;border-collapse:collapse;min-width:860px}
  #ppm-root table.list th{text-align:left;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sec);background-color:var(--input-bg);padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
  #ppm-root table.list td{font-size:.72rem;color:var(--ink-light);padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  #ppm-root table.list tr.grp-first td{border-top:1px solid #cbd5e1}
  #ppm-root table.list tr.grp-sub td{border-top:1px dashed #e5e7eb;background:#fcfdff}
  #ppm-root table.list td.grp-anchor{border-left:3px solid var(--accent);background:#ffffff;vertical-align:top;padding-top:9px}
  #ppm-root table.list td.grp-merged{background:#ffffff;vertical-align:top;padding-top:9px}
  #ppm-root table.list tr:hover td:not(.grp-anchor):not(.grp-merged){background:#f8fafc}
  #ppm-root .unit-count-sub{font-size:.62rem;color:var(--text-sec);font-weight:600;margin-top:2px}
  #ppm-root .no-plain-txt{font-weight:800;color:var(--ink)}

  /* Pagination Footer */
  #ppm-root .table-pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:12px;margin-top:8px;border-top:1px solid var(--line);font-size:.75rem;color:var(--text-sec)}
  #ppm-root .table-pager-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  /* Status Chips & Pending Items Hover Tooltip */
  #ppm-root .status-chip{font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  #ppm-root .chip-open{background:#e5e7eb;color:var(--text-sec)}
  #ppm-root .chip-progress{background:#fef3c7;color:var(--warn)}
  #ppm-root .chip-done{background:#d1fae5;color:var(--ok)}
  #ppm-root .chip-sync{background:#dbeafe;color:#1d4ed8;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:999px;display:inline-block;margin-left:4px}
  #ppm-root .status-tip-wrap{position:relative;display:inline-flex;align-items:center;cursor:help;outline:none}
  #ppm-root .status-tip-box{display:none;position:absolute;bottom:calc(100% + 8px);right:0;width:265px;background:#111827;color:#f8fafc;border-radius:8px;padding:10px 12px;font-size:.72rem;line-height:1.45;box-shadow:0 10px 25px rgba(0,0,0,.28);z-index:500;text-align:left;white-space:normal;pointer-events:none}
  #ppm-root .status-tip-wrap.tip-down .status-tip-box{bottom:auto;top:calc(100% + 8px);right:auto;left:0}
  #ppm-root .status-tip-wrap:hover .status-tip-box,#ppm-root .status-tip-wrap:focus .status-tip-box,#ppm-root .status-tip-wrap:focus-within .status-tip-box{display:block}
  #ppm-root .status-tip-title{font-weight:800;color:#fbbf24;text-transform:uppercase;letter-spacing:.04em;font-size:.66rem;margin-bottom:5px;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:4px}
  #ppm-root .status-tip-list{margin:0;padding-left:15px}
  #ppm-root .status-tip-list li{margin-bottom:3px}

  #ppm-root .link-btn{border:none;background:none;color:var(--accent);font-weight:700;font-size:.75rem;cursor:pointer;padding:2px 4px}
  #ppm-root .empty-state{text-align:center;padding:34px 10px;color:var(--text-sec);font-size:.875rem}
  #ppm-root .btn-export-excel{background-color:var(--ok);color:#ffffff;font-size:.8rem;font-weight:700;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
  #ppm-root .btn-export-excel:hover{background-color:#047857}
  #ppm-root .btn-export-excel svg{width:15px;height:15px}

  /* Forms & Memo Details */
  #ppm-root .form-shell{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px 24px}
  #ppm-root .form-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  #ppm-root .form-toolbar .rec-select{display:flex;align-items:center;gap:8px;font-size:.875rem;flex-wrap:wrap}
  #ppm-root select.recpick{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;background:var(--input-bg);color:var(--ink);font-family:ui-monospace,monospace}
  #ppm-root .toolbar-status-box{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;font-size:.74rem}
  #ppm-root .btn{border:none;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s}
  #ppm-root .btn-sm{padding:5px 10px;font-size:.74rem;border-radius:7px}
  #ppm-root .btn-primary{background:var(--accent);color:#fff}
  #ppm-root .btn-primary:hover{background:var(--accent-2)}
  #ppm-root .btn-ghost{background:var(--line);color:var(--ink-light)}
  #ppm-root .btn-ghost:hover{background:#d1d5db}
  #ppm-root .btn-danger{background:#fee2e2;color:var(--crit)}
  #ppm-root .btn-danger:hover{background:#fca5a5}
  #ppm-root .btn-solid-danger{background:var(--crit);color:#fff}
  #ppm-root .btn-solid-danger:hover{background:#b91c1c}
  #ppm-root .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  #ppm-root .sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;transition:all .2s}
  #ppm-root .sec>.sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
  #ppm-root .grid{display:grid;gap:10px}
  #ppm-root .g2{grid-template-columns:1fr 1fr}
  #ppm-root .g3{grid-template-columns:1fr 1fr 1fr}
  #ppm-root .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  #ppm-root .g5{grid-template-columns:repeat(5,1fr)}
  @media (max-width:720px){#ppm-root .g2,#ppm-root .g3,#ppm-root .g4,#ppm-root .g5{grid-template-columns:1fr}}
  #ppm-root label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--ink-light);font-weight:600}
  #ppm-root input[type=text],#ppm-root input[type=date],#ppm-root input[type=time],#ppm-root input[type=number],#ppm-root textarea,#ppm-root select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;font-family:inherit;color:var(--ink);background:var(--input-bg);transition:all .2s}
  #ppm-root input.locked-field{background:#e5e7eb!important;color:#4b5563;cursor:not-allowed;pointer-events:none}
  #ppm-root textarea{resize:vertical;min-height:54px}
  #ppm-root .check-row,#ppm-root .radio-row{display:flex;flex-wrap:wrap;gap:12px}
  #ppm-root .chk,#ppm-root .rad{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--ink-light);cursor:pointer}
  #ppm-root .chk input,#ppm-root .rad input{width:15px;height:15px;accent-color:var(--accent)}
  #ppm-root .err-highlight,#ppm-root .err-sec{border:1px solid var(--crit)!important;background-color:#fef2f2!important;box-shadow:0 0 0 1px var(--crit)}

  /* Multi-Unit Selector Bar */
  #ppm-root .unit-bar-wrap{margin-top:12px;padding:10px 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px}
  #ppm-root .unit-bar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  #ppm-root .unit-bar-title{font-size:.74rem;font-weight:800;color:#1e293b}
  #ppm-root .unit-bar-actions{display:flex;gap:6px;flex-wrap:wrap}
  #ppm-root .unit-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  #ppm-root .unit-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid #cbd5e1;background:#ffffff;color:var(--ink);font-size:.74rem;font-weight:700;cursor:pointer;transition:all .15s}
  #ppm-root .unit-pill.active{background:var(--accent);border-color:var(--accent);color:#ffffff;box-shadow:0 2px 6px rgba(37,99,235,.25)}
  #ppm-root .unit-pill.done:not(.active){background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
  #ppm-root .unit-pill .u-rm{border:none;background:transparent;color:inherit;font-weight:900;font-size:.8rem;cursor:pointer;padding:0 2px;opacity:.75;line-height:1}
  #ppm-root .unit-pill .u-rm:hover{opacity:1}
  #ppm-root .active-unit-banner{font-size:.72rem;font-weight:700;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;padding:6px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}

  /* Reference Image Cards */
  #ppm-root .ref-sec-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  #ppm-root .ref-sec-header .sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0}
  #ppm-root .ref-cleaning-toggle-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px dashed #38bdf8;background:#f0f9ff;color:#0369a1;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s}
  #ppm-root .ref-cleaning-toggle-btn:hover{background:#e0f2fe;border-color:#0284c7}
  #ppm-root .ref-cleaning-toggle-btn.active{border-style:solid;border-color:#0284c7;background:#e0f2fe;color:#075985}
  #ppm-root .ref-img-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  @media (max-width:720px){#ppm-root .ref-img-grid{grid-template-columns:1fr}}
  #ppm-root .ref-img-card{border:1px solid var(--line);border-radius:10px;background:var(--input-bg);overflow:hidden;display:flex;flex-direction:column;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  #ppm-root .ref-img-card:hover{border-color:#cbd5e1;box-shadow:0 4px 12px rgba(15,23,42,.06)}
  #ppm-root .ref-img-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
  #ppm-root .ref-img-badge{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center}
  #ppm-root .badge-before{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
  #ppm-root .badge-cleaning{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
  #ppm-root .badge-after{background:#d1fae5;color:#047857;border:1px solid #a7f3d0}
  #ppm-root .ref-img-meta{font-size:.68rem;color:var(--text-sec);font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  #ppm-root .ref-img-stage{position:relative;height:210px;background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  #ppm-root .ref-img-preview{width:100%;height:100%;object-fit:contain;display:block;background:#0f172a}
  #ppm-root .ref-img-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;text-align:center;color:var(--text-sec);transition:transform .15s}
  #ppm-root .ref-img-stage:hover .ref-img-empty{transform:translateY(-2px)}
  #ppm-root .ref-cam-circle{width:46px;height:46px;border-radius:999px;background:#dbeafe;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:2px;box-shadow:0 2px 6px rgba(37,99,235,.15)}
  #ppm-root .ref-img-empty-title{font-size:.8rem;font-weight:700;color:var(--ink)}
  #ppm-root .ref-img-empty-sub{font-size:.7rem;color:var(--text-sec)}
  #ppm-root .ref-img-footer{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--paper);border-top:1px solid var(--line)}
  #ppm-root .ref-img-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink-light);font-size:.73rem;font-weight:700;cursor:pointer;transition:all .15s}
  #ppm-root .ref-img-btn:hover{background:var(--line);color:var(--ink)}
  #ppm-root .ref-img-btn.cam{background:var(--accent);border-color:var(--accent);color:#fff}
  #ppm-root .ref-img-btn.cam:hover{background:var(--accent-2);border-color:var(--accent-2)}
  #ppm-root .ref-img-btn.del{color:var(--crit);background:#fef2f2;border-color:#fecaca}
  #ppm-root .ref-img-btn.del:hover{background:#fee2e2}

  /* Modals & Lightbox */
  #ppm-root #ppm-modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.7);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)}
  #ppm-root #ppm-modal-overlay.active{opacity:1;pointer-events:auto}
  #ppm-root #ppm-modal-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:92%;max-width:440px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
  #ppm-root #ppm-modal-title{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:8px}
  #ppm-root #ppm-modal-msg{font-size:.85rem;color:var(--ink-light);margin-bottom:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

  const OfflineDB = (function () {
    const DB_NAME = 'BHS_PPM_OfflineDB';
    const DB_VERSION = 1;
    let dbPromise = null;
    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        try {
          if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'createdAt' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);
        } catch (err) { reject(err); }
      });
      return dbPromise;
    }
    async function getAllRecords() {
      try {
        const db = await open();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('records', 'readonly');
          const req = tx.objectStore('records').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      } catch (e) { return null; }
    }
    async function saveAllRecords(records) {
      try {
        const db = await open();
        await new Promise((resolve, reject) => {
          const tx = db.transaction('records', 'readwrite');
          const store = tx.objectStore('records');
          store.clear();
          (records || []).forEach(rec => { if (rec && rec.createdAt != null) store.put(rec); });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
        return true;
      } catch (e) { return false; }
    }
    async function getMeta(key) {
      try {
        const db = await open();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('meta', 'readonly');
          const req = tx.objectStore('meta').get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : null);
          req.onerror = () => reject(req.error);
        });
      } catch (e) { return null; }
    }
    async function setMeta(key, value) {
      try {
        const db = await open();
        await new Promise((resolve, reject) => {
          const tx = db.transaction('meta', 'readwrite');
          tx.objectStore('meta').put({ key, value });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
        return true;
      } catch (e) { return false; }
    }
    return { getAllRecords, saveAllRecords, getMeta, setMeta };
  })();

  const checkReq = v => v != null && String(v).trim() !== '';
  const esc = v => (v === undefined || v === null) ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const parseMultiList = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);

  function blankUnit(equipNo = '', conveyorItem = '') {
    return {
      equipNo,
      conveyorItem,
      cat2: {},
      beforeImage: '', beforeImageDate: '', beforeImageTime: '',
      cleaningImage: '', cleaningImageDate: '', cleaningImageTime: '', showCleaningBox: false,
      afterImage: '', afterImageDate: '', afterImageTime: '',
      inspectionMethod: '',
      taskPerformed: '',
      reasonDetail: '',
      resultCat: '',
      paramSpeed: '', paramTemp: '', paramCurrent: '', paramVoltage: '',
      resultDetail: ''
    };
  }

  function blankRecord() {
    return {
      createdAt: Date.now(),
      isDraft: true,
      syncPending: false,
      status: '',
      notificationNo: '',
      workOrderNo: '',
      maintenanceType: '',
      reportNo: '',
      happeningDate: '',
      timeOfHappening: '',
      issuedBy: '',
      issuedGroup: '',
      title: '',
      lineEquipment: '',
      equipNo: '',
      conveyorItem: '',
      units: [blankUnit()],
      cat2: {},
      beforeImage: '', beforeImageDate: '', beforeImageTime: '',
      cleaningImage: '', cleaningImageDate: '', cleaningImageTime: '',
      afterImage: '', afterImageDate: '', afterImageTime: '',
      inspectionMethod: '',
      taskPerformed: '',
      reasonDetail: '',
      resultCat: '',
      paramSpeed: '', paramTemp: '', paramCurrent: '', paramVoltage: '',
      resultDetail: '',
      doneByName: '',
      checkByName: '',
      confirmedByName: ''
    };
  }

  function normalizeRecord(r) {
    if (!r || typeof r !== 'object') return blankRecord();
    if (!Array.isArray(r.units) || r.units.length === 0) {
      r.units = [{
        equipNo: r.equipNo || '',
        conveyorItem: r.conveyorItem || '',
        cat2: (r.cat2 && typeof r.cat2 === 'object') ? { ...r.cat2 } : {},
        beforeImage: r.beforeImage || '',
        beforeImageDate: r.beforeImageDate || '',
        beforeImageTime: r.beforeImageTime || '',
        cleaningImage: r.cleaningImage || '',
        cleaningImageDate: r.cleaningImageDate || '',
        cleaningImageTime: r.cleaningImageTime || '',
        showCleaningBox: Boolean(r.showCleaningBox || r.cleaningImage),
        afterImage: r.afterImage || '',
        afterImageDate: r.afterImageDate || '',
        afterImageTime: r.afterImageTime || '',
        inspectionMethod: r.inspectionMethod || '',
        taskPerformed: r.taskPerformed || '',
        reasonDetail: r.reasonDetail || '',
        resultCat: r.resultCat || '',
        paramSpeed: r.paramSpeed || '',
        paramTemp: r.paramTemp || '',
        paramCurrent: r.paramCurrent || '',
        paramVoltage: r.paramVoltage || '',
        resultDetail: r.resultDetail || ''
      }];
    } else {
      // Mutate missing default fields in-place so active unit references stay intact
      const defaults = blankUnit();
      for (let i = 0; i < r.units.length; i++) {
        const u = r.units[i];
        if (!u || typeof u !== 'object') {
          r.units[i] = blankUnit();
          continue;
        }
        for (const k in defaults) {
          if (u[k] === undefined) u[k] = defaults[k];
        }
        if (!u.cat2 || typeof u.cat2 !== 'object') u.cat2 = {};
        if (u.cleaningImage) u.showCleaningBox = true;
      }
    }
    return r;
  }

  function syncDateTimeFromFirstBefore(r) {
    const units = normalizeRecord(r).units;
    const firstWithBefore = units.find(u => u.beforeImage && (u.beforeImageDate || u.beforeImageTime));
    if (!firstWithBefore) {
      if (!units.some(u => u.beforeImage)) {
        r.happeningDate = '';
        r.timeOfHappening = '';
      }
      return;
    }
    if (firstWithBefore.beforeImageDate && firstWithBefore.beforeImageDate.includes('/')) {
      const p = firstWithBefore.beforeImageDate.split('/');
      if (p.length === 3) r.happeningDate = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
    }
    if (firstWithBefore.beforeImageTime && firstWithBefore.beforeImageTime.includes(':')) {
      const tp = firstWithBefore.beforeImageTime.split(':');
      if (tp.length >= 2) r.timeOfHappening = `${tp[0].padStart(2,'0')}:${tp[1].padStart(2,'0')}`;
    }
  }

  function syncParentSummary(r) {
    const units = normalizeRecord(r).units;
    r.equipNo = units.map(u => (u.equipNo || '').trim()).filter(Boolean).join(', ');
    r.conveyorItem = Array.from(new Set(units.map(u => (u.conveyorItem || '').trim()).filter(Boolean))).join(', ');
    const mergedCat = {};
    units.forEach(u => { Object.keys(CATS2).forEach(k => { if (u.cat2 && u.cat2[k]) mergedCat[k] = true; }); });
    r.cat2 = mergedCat;
    const first = units[0] || blankUnit();
    r.beforeImage = first.beforeImage || '';
    r.beforeImageDate = first.beforeImageDate || '';
    r.beforeImageTime = first.beforeImageTime || '';
    r.afterImage = first.afterImage || '';
    r.afterImageDate = first.afterImageDate || '';
    r.afterImageTime = first.afterImageTime || '';
    r.cleaningImage = first.cleaningImage || '';
    r.cleaningImageDate = first.cleaningImageDate || '';
    r.cleaningImageTime = first.cleaningImageTime || '';
    r.inspectionMethod = Array.from(new Set(units.map(u => (u.inspectionMethod || '').trim()).filter(Boolean))).join(', ');
    r.taskPerformed = Array.from(new Set(units.flatMap(u => parseMultiList(u.taskPerformed)))).join(', ');
    r.reasonDetail = first.reasonDetail || '';
    r.resultCat = first.resultCat || '';
    r.paramSpeed = first.paramSpeed || '';
    r.paramTemp = first.paramTemp || '';
    r.paramCurrent = first.paramCurrent || '';
    r.paramVoltage = first.paramVoltage || '';
    r.resultDetail = first.resultDetail || '';
  }

  let state = {
    tab: 'dashboard',
    records: [],
    deleteQueue: [],
    activeId: null,
    activeUnitIdx: 0,
    cleanActiveRecord: null,
    isDirty: false,
    loaded: false,
    showErrors: false,
    isOnline: typeof navigator !== 'undefined' ? navigator.onLine : true,
    isSyncing: false,
    isAutoRefreshing: false,
    refreshShownAt: 0,
    offlineEntryNotified: false,
    userChangedDateFilter: false,
    cloudFetchError: null,
    tableLimit: 10,
    charts: { cat: null, status: null }
  };

  function getStatus(r) {
    const units = normalizeRecord(r).units;
    const allUnitsComplete = units.every(u =>
      checkReq(u.inspectionMethod) &&
      parseMultiList(u.taskPerformed).length > 0 &&
      checkReq(u.resultCat)
    );
    const anyUnitProgress = units.some(u =>
      parseMultiList(u.taskPerformed).length > 0 ||
      checkReq(u.resultCat) ||
      checkReq(u.afterImage)
    );
    const doneValid = parseMultiList(r.doneByName).length > 0;
    const checkValid = (r.checkByName || '').trim().length >= 3;
    const confirmValid = checkReq(r.confirmedByName);
    if (allUnitsComplete && doneValid && checkValid && confirmValid) return 'done';
    if (anyUnitProgress || doneValid || checkValid || confirmValid) return 'progress';
    return 'open';
  }

  function getStatusLabel(st) {
    if (st === 'done') return 'Completed';
    if (st === 'progress') return 'In Progress';
    return 'Open';
  }

  function getPendingItems(r) {
    const units = normalizeRecord(r).units;
    const pending = [];
    const multi = units.length > 1;
    units.forEach((u, idx) => {
      const miss = [];
      if (!checkReq(u.inspectionMethod)) miss.push('Inspection Method');
      if (parseMultiList(u.taskPerformed).length === 0) miss.push('Task Performed');
      if (!checkReq(u.resultCat)) miss.push('Result');
      if (miss.length > 0) {
        const label = u.equipNo ? `No. ${u.equipNo}` : `Unit ${idx + 1}`;
        pending.push(multi ? `${label}: ${miss.join(', ')}` : miss.join(', '));
      }
    });
    const signMiss = [];
    if (parseMultiList(r.doneByName).length === 0) signMiss.push('Done By (TECH)');
    if ((r.checkByName || '').trim().length < 3) signMiss.push('Check By (TO)');
    if (!checkReq(r.confirmedByName)) signMiss.push('Confirmed By (TE/E/SE)');
    if (signMiss.length > 0) pending.push(`Sign-off: ${signMiss.join(', ')}`);
    return pending;
  }

  function renderStatusChipHtml(r, tipDown = false) {
    const st = getStatus(r);
    const lbl = getStatusLabel(st);
    const cls = st === 'done' ? 'chip-done' : (st === 'progress' ? 'chip-progress' : 'chip-open');
    if (st !== 'progress') {
      return `<span class="status-chip ${cls}">${lbl}</span>`;
    }
    const items = getPendingItems(r);
    const listHtml = items.length
      ? `<ul class="status-tip-list">${items.map(it => `<li>${esc(it)}</li>`).join('')}</ul>`
      : `<div>Complete remaining fields to close this memo.</div>`;
    return `<span class="status-tip-wrap ${tipDown ? 'tip-down' : ''}" tabindex="0"><span class="status-chip ${cls}">${lbl} ⓘ</span><div class="status-tip-box"><div class="status-tip-title">Pending Items</div>${listHtml}</div></span>`;
  }

  function showModal(title, msg, opts = {}) {
    const type = typeof opts === 'string' ? opts : (opts.type || 'alert');
    const errorMode = typeof opts === 'object' ? Boolean(opts.errorMode) : false;
    return new Promise(resolve => {
      let overlay = document.getElementById('ppm-modal-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'ppm-modal-overlay';
        overlay.innerHTML = `<div id="ppm-modal-box"><div id="ppm-modal-title"></div><div id="ppm-modal-msg"></div><input type="password" id="ppm-modal-input" placeholder="Enter password..." autocomplete="new-password"/><div id="ppm-modal-actions"></div></div>`;
      }
      if (overlay.parentNode !== ROOT) ROOT.appendChild(overlay);
      const titleEl = overlay.querySelector('#ppm-modal-title');
      const msgEl = overlay.querySelector('#ppm-modal-msg');
      const inputEl = overlay.querySelector('#ppm-modal-input');
      const actionsEl = overlay.querySelector('#ppm-modal-actions');
      titleEl.textContent = title;
      inputEl.style.display = type === 'prompt' ? 'block' : 'none';
      inputEl.value = '';
      actionsEl.innerHTML = '';
      const isRich = type === 'offline-entry' || type === 'offline-submit' || type === 'offline-synced' || type === 'custom-html';
      if (isRich) {
        msgEl.style.whiteSpace = 'normal';
        msgEl.innerHTML = msg;
      } else {
        msgEl.style.whiteSpace = 'pre-wrap';
        msgEl.textContent = msg;
      }
      function close() { overlay.classList.remove('active'); }
      const createBtn = (cls, text, cb) => {
        const b = document.createElement('button');
        b.className = cls; b.textContent = text;
        b.onclick = () => { close(); cb(); };
        return b;
      };
      if (type === 'alert') actionsEl.appendChild(createBtn(errorMode ? 'btn btn-danger' : 'btn btn-primary', 'OK', () => resolve(true)));
      else if (type === 'offline-entry') actionsEl.appendChild(createBtn('btn btn-primary', 'Continue Offline Entry', () => resolve(true)));
      else if (type === 'offline-submit') actionsEl.appendChild(createBtn('btn btn-primary', 'OK, View Memo', () => resolve(true)));
      else if (type === 'offline-synced') actionsEl.appendChild(createBtn('btn btn-primary', 'OK', () => resolve(true)));
      else if (type === 'confirm') {
        actionsEl.appendChild(createBtn('btn btn-ghost', 'Cancel', () => resolve(false)));
        actionsEl.appendChild(createBtn('btn btn-solid-danger', 'Delete', () => resolve(true)));
      } else if (type === 'prompt') {
        actionsEl.appendChild(createBtn('btn btn-ghost', 'Cancel', () => resolve(null)));
        const handleSub = () => { close(); resolve(inputEl.value); };
        actionsEl.appendChild(createBtn('btn btn-primary', 'Confirm', handleSub));
        inputEl.onkeydown = e => { if (e.key === 'Enter') handleSub(); };
      } else if (type === 'unsaved') {
        actionsEl.appendChild(createBtn('btn btn-primary', 'Cancel & Keep Editing', () => resolve(false)));
        actionsEl.appendChild(createBtn('btn btn-solid-danger', 'Discard Data', () => resolve(true)));
      }
      void overlay.offsetWidth;
      overlay.classList.add('active');
      if (type === 'prompt') setTimeout(() => inputEl.focus(), 50);
    });
  }

  function openImageLightbox(title, imgSrc) {
    if (!imgSrc) return;
    let lb = document.getElementById('ppm-lightbox-overlay');
    if (!lb) {
      lb = document.createElement('div');
      lb.id = 'ppm-lightbox-overlay';
      lb.innerHTML = `<div id="ppm-lightbox-card"><div id="ppm-lightbox-head"><span id="ppm-lightbox-title"></span><button type="button" class="btn btn-ghost btn-sm" id="ppm-lightbox-close">Close</button></div><div id="ppm-lightbox-body"><img id="ppm-lightbox-img" alt="Reference Preview"/></div></div>`;
      lb.addEventListener('click', (e) => { if (e.target === lb) lb.classList.remove('active'); });
      lb.querySelector('#ppm-lightbox-close').addEventListener('click', () => lb.classList.remove('active'));
    }
    if (lb.parentNode !== ROOT) ROOT.appendChild(lb);
    lb.querySelector('#ppm-lightbox-title').textContent = title;
    lb.querySelector('#ppm-lightbox-img').src = imgSrc;
    lb.classList.add('active');
  }

  function notifyOfflineEntry(force = false) {
    if (navigator.onLine) return Promise.resolve(false);
    if (!force && state.offlineEntryNotified) return Promise.resolve(false);
    state.offlineEntryNotified = true;
    state.isOnline = false;
    updateNetworkBadge();
    const html = `
      <div class="modal-offline-banner entry">📡 No Internet Connection — Offline Mode Active</div>
      <div>You can continue entering <b>Memo Details</b> and capturing watermarked camera photos. Records are stored locally on this device and will auto-sync to Google Sheets &amp; Drive when internet returns.</div>
    `;
    return showModal("Offline Entry Notification", html, "offline-entry");
  }

  function getPendingCount() {
    const pendingRecs = state.records.filter(r => !r.isDraft && r.syncPending).length;
    return pendingRecs + (state.deleteQueue ? state.deleteQueue.length : 0);
  }

  function updateNetworkBadge() {
    const wrap = document.getElementById('ppm-net-status');
    if (!wrap) return;
    const pendingCount = getPendingCount();
    let badgeHtml = '';
    if (state.isSyncing) {
      badgeHtml = `<span class="net-badge net-syncing"><span class="net-dot"></span>Syncing to Cloud...</span>`;
    } else if (!state.isOnline) {
      badgeHtml = `<span class="net-badge net-offline"><span class="net-dot"></span>Offline Mode${pendingCount > 0 ? ` • ${pendingCount} Queued` : ''}</span>`;
    } else if (pendingCount > 0) {
      badgeHtml = `<span class="net-badge net-online"><span class="net-dot"></span>Online</span><button type="button" class="sync-now-btn" id="ppm-manual-sync-btn">↻ Sync Pending (${pendingCount})</button>`;
    } else if (state.cloudFetchError) {
      const errLabel = state.cloudFetchError === 'auth' ? 'Access Blocked (Check Script)' : 'Sync Failed';
      badgeHtml = `<span class="net-badge net-offline"><span class="net-dot"></span>${errLabel}</span><button type="button" class="sync-now-btn" id="ppm-retry-read-btn">↻ Retry</button>`;
    } else if (state.isAutoRefreshing && state.records.filter(r => !r.isDraft).length === 0) {
      badgeHtml = `<span class="net-badge net-syncing"><span class="net-dot"></span>Loading Cloud Data...</span>`;
    } else {
      badgeHtml = `<span class="net-badge net-online"><span class="net-dot"></span>Online • Synced</span>`;
    }
    const refreshIndHtml = `<span class="refresh-indicator ${state.isAutoRefreshing ? 'visible' : ''}" id="ppm-refresh-ind" aria-live="polite" title="Refreshing data"><span class="refresh-spin">↻</span></span>`;
    wrap.innerHTML = badgeHtml + refreshIndHtml;
    const manualBtn = document.getElementById('ppm-manual-sync-btn');
    if (manualBtn) manualBtn.addEventListener('click', () => syncOfflineQueue(true, true));
    const retryBtn = document.getElementById('ppm-retry-read-btn');
    if (retryBtn) retryBtn.addEventListener('click', () => fetchCloudRecords(true));
  }

  function startRefreshIndicator() {
    state.isAutoRefreshing = true;
    state.refreshShownAt = Date.now();
    updateNetworkBadge();
  }

  function finishRefreshIndicator() {
    const elapsed = Date.now() - (state.refreshShownAt || 0);
    const delay = Math.max(0, 950 - elapsed);
    setTimeout(() => {
      state.isAutoRefreshing = false;
      updateNetworkBadge();
    }, delay);
  }

  async function saveRecords() {
    try {
      await OfflineDB.saveAllRecords(state.records);
      if (window.localStorage) {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(state.records));
        } catch (quotaErr) {
          const slim = state.records.map(rec => ({
            ...rec,
            beforeImage: String(rec.beforeImage || '').startsWith('http') ? rec.beforeImage : '',
            cleaningImage: String(rec.cleaningImage || '').startsWith('http') ? rec.cleaningImage : '',
            afterImage: String(rec.afterImage || '').startsWith('http') ? rec.afterImage : '',
            units: (rec.units || []).map(u => ({
              ...u,
              beforeImage: String(u.beforeImage || '').startsWith('http') ? u.beforeImage : '',
              cleaningImage: String(u.cleaningImage || '').startsWith('http') ? u.cleaningImage : '',
              afterImage: String(u.afterImage || '').startsWith('http') ? u.afterImage : ''
            }))
          }));
          localStorage.setItem(STORE_KEY, JSON.stringify(slim));
        }
      }
    } catch (e) {}
    updateNetworkBadge();
  }

  async function saveDeleteQueue() {
    await OfflineDB.setMeta(DELETE_QUEUE_KEY, state.deleteQueue);
    try { if (window.localStorage) localStorage.setItem(DELETE_QUEUE_KEY, JSON.stringify(state.deleteQueue)); } catch (e) {}
    updateNetworkBadge();
  }

  function postPayloadWithTimeout(payloadObj, timeoutMs = 20000) {
    if (window.google && window.google.script && window.google.script.run) {
      return new Promise((resolve, reject) => {
        const runner = window.google.script.run
          .withSuccessHandler(() => resolve(true))
          .withFailureHandler(err => reject(err));
        if (payloadObj.action === 'delete') runner.deleteRecordFromClient(payloadObj.createdAt);
        else runner.saveRecordFromClient(JSON.stringify(payloadObj));
      });
    }
    return new Promise((resolve, reject) => {
      if (!navigator.onLine) return reject(new Error('Offline'));
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => { if (controller) controller.abort(); reject(new Error('Timeout')); }, timeoutMs);
      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        credentials: 'omit',
        redirect: 'follow',
        body: new URLSearchParams({ payload: JSON.stringify(payloadObj) }),
        signal: controller ? controller.signal : undefined
      }).then(() => { clearTimeout(timer); resolve(true); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  function parseCloudPayload(rawText, cbName) {
    const trimmed = String(rawText || '').replace(/^\uFEFF/, '').trim();
    if (!trimmed) throw new Error('EMPTY_RESPONSE');
    if (trimmed.startsWith('<')) throw new Error('HTML_AUTH_REDIRECT');
    let jsonStr = trimmed;
    if (cbName) {
      const escapedCb = cbName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('^(?:/\\*\\*/\\s*)?' + escapedCb + '\\s*\\(([\\s\\S]*)\\)\\s*;?\\s*$');
      const m = jsonStr.match(re);
      if (m) jsonStr = m[1].trim();
    }
    return JSON.parse(jsonStr);
  }

  function mergeCloudRecords(googleData, isBackground = false) {
    if (!Array.isArray(googleData)) return;
    state.isOnline = true;
    state.cloudFetchError = null;
    const cleanTime = iso => (!iso || typeof iso !== 'string' || !iso.includes('T')) ? iso : new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    const delSet = new Set((state.deleteQueue || []).map(d => String(d.createdAt)));

    let validData = [];
    googleData.forEach(g => {
      if (!g || !g.createdAt || String(g.createdAt).trim() === '') return;
      if (delSet.has(String(g.createdAt))) return;
      g.happeningDate = normalizeDateStr(g.happeningDate);
      g.timeOfHappening = cleanTime(g.timeOfHappening);
      g.syncPending = false;
      normalizeRecord(g);
      validData.push(g);
    });

    const drafts = state.records.filter(r => r.isDraft);
    const localPendingMap = new Map(state.records.filter(r => !r.isDraft && r.syncPending).map(r => [String(r.createdAt), r]));
    const cloudMap = new Map(validData.map(g => [String(g.createdAt), g]));

    const mergedCloud = validData.map(cloudRec => {
      const idKey = String(cloudRec.createdAt);
      if (localPendingMap.has(idKey)) return localPendingMap.get(idKey);
      const localMatch = state.records.find(r => String(r.createdAt) === idKey);
      if (localMatch && Array.isArray(localMatch.units)) {
        cloudRec.units.forEach((cu, idx) => {
          const lu = localMatch.units[idx];
          if (lu) {
            if (!cu.beforeImage && lu.beforeImage) cu.beforeImage = lu.beforeImage;
            if (!cu.cleaningImage && lu.cleaningImage) cu.cleaningImage = lu.cleaningImage;
            if (!cu.afterImage && lu.afterImage) cu.afterImage = lu.afterImage;
          }
        });
      }
      return cloudRec;
    });

    const localOnlyPending = Array.from(localPendingMap.values()).filter(r => !cloudMap.has(String(r.createdAt)));
    state.records = [...drafts, ...localOnlyPending, ...mergedCloud].sort((a, b) => Number(b.createdAt) - Number(a.createdAt));
    saveRecords();
    state.loaded = true;

    const validOrActive = state.records.filter(r => !r.isDraft || String(r.createdAt) === String(state.activeId));
    if (validOrActive.length > 0 && !state.activeId) state.activeId = validOrActive[0].createdAt;

    if (state.tab === 'dashboard') {
      const content = ROOT.querySelector('#ppm-content');
      if (content && content.querySelector('#dash-kpi-grid')) {
        if (!state.userChangedDateFilter) {
          const { defStart, defEnd } = getDefaultDateBounds();
          const sEl = document.getElementById('dash-start');
          const eEl = document.getElementById('dash-end');
          if (sEl) sEl.value = defStart;
          if (eEl) eEl.value = defEnd;
        }
        updateDashboardUI(content);
        updateNetworkBadge();
        return;
      }
    }
    if (state.tab === 'input' && state.isDirty) {
      updateNetworkBadge();
    } else if (!isBackground || state.tab === 'document') {
      render();
    }
  }

  function fetchCloudRecords(isBackground = false) {
    return new Promise((resolve) => {
      if (!navigator.onLine) return resolve(false);
      startRefreshIndicator();
      const finish = (ok, errType = null) => {
        state.cloudFetchError = ok ? null : (errType || 'network');
        finishRefreshIndicator();
        if (!ok && state.tab === 'dashboard') {
          const content = ROOT.querySelector('#ppm-content');
          if (content && content.querySelector('#dash-kpi-grid')) updateDashboardUI(content);
        }
        resolve(ok);
      };

      if (window.google && window.google.script && window.google.script.run) {
        window.google.script.run
          .withSuccessHandler(data => { mergeCloudRecords(data, isBackground); finish(true); })
          .withFailureHandler(() => finish(false, 'script'))
          .readAllRecords();
        return;
      }

      const cbName = 'syncGoogleSheets_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const reqUrl = `${WEB_APP_URL}?action=read&callback=${cbName}&t=${Date.now()}`;
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => { if (controller) controller.abort(); }, 25000);

      // Primary: Cookie-free CORS fetch (prevents Android multi-account & iOS WebKit ORB blocks)
      fetch(reqUrl, {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        redirect: 'follow',
        cache: 'no-store',
        signal: controller ? controller.signal : undefined
      })
        .then(res => {
          clearTimeout(timer);
          if (!res.ok) throw new Error('HTTP_' + res.status);
          return res.text();
        })
        .then(text => {
          const cloudData = parseCloudPayload(text, cbName);
          if (!Array.isArray(cloudData)) throw new Error('INVALID_PAYLOAD');
          mergeCloudRecords(cloudData, isBackground);
          finish(true);
        })
        .catch(err => {
          clearTimeout(timer);
          if (err && err.message === 'HTML_AUTH_REDIRECT') {
            console.error('Apps Script returned an HTML login page. Set Web App access to "Anyone".');
            finish(false, 'auth');
            return;
          }
          // Fallback: Anonymous script tag (omits Google cookies)
          const script = document.createElement('script');
          script.crossOrigin = 'anonymous';
          const fbTimer = setTimeout(() => { cleanup(); finish(false, 'timeout'); }, 25000);
          function cleanup() {
            clearTimeout(fbTimer);
            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
            if (script.parentNode) script.parentNode.removeChild(script);
          }
          window[cbName] = function (cloudData) {
            cleanup();
            if (!Array.isArray(cloudData)) return finish(false, 'invalid');
            mergeCloudRecords(cloudData, isBackground);
            finish(true);
          };
          script.onerror = function () {
            cleanup();
            state.isOnline = navigator.onLine;
            finish(false, 'orb_or_network');
          };
          script.src = `${WEB_APP_URL}?action=read&callback=${cbName}&t=${Date.now()}_fb`;
          document.body.appendChild(script);
        });
    });
  }

  async function syncOfflineQueue(manualTrigger = false, notifyOnComplete = false) {
    if (state.isSyncing) return;
    if (!navigator.onLine) {
      state.isOnline = false; updateNetworkBadge();
      if (manualTrigger) await showModal("Offline", "No internet connection detected. Your records remain safely stored offline.", "alert");
      return;
    }
    const pendingDeletes = [...(state.deleteQueue || [])];
    const pendingRecords = state.records.filter(r => !r.isDraft && r.syncPending);
    if (pendingDeletes.length === 0 && pendingRecords.length === 0) { updateNetworkBadge(); return; }

    state.isSyncing = true;
    updateNetworkBadge();
    let syncedCount = 0;
    try {
      for (const delItem of pendingDeletes) {
        await postPayloadWithTimeout({ action: 'delete', createdAt: delItem.createdAt }, 12000);
        state.deleteQueue = state.deleteQueue.filter(x => String(x.createdAt) !== String(delItem.createdAt));
        await saveDeleteQueue();
      }
      for (const rec of pendingRecords) {
        syncParentSummary(rec);
        await postPayloadWithTimeout({ ...rec, syncPending: false }, 25000);
        rec.syncPending = false;
        syncedCount++;
      }
      if (syncedCount > 0) await saveRecords();
      setTimeout(() => fetchCloudRecords(true), 1200);
      if (notifyOnComplete && syncedCount > 0) {
        const html = `<div class="modal-offline-banner synced">☁️ Offline Records Synced!</div><div>Uploaded <b>${syncedCount}</b> queued memo(s) to Google Sheets &amp; Drive.</div>`;
        await showModal("Cloud Sync Complete", html, "offline-synced");
      }
    } catch (err) {
      console.warn('Sync paused:', err);
    } finally {
      state.isSyncing = false;
      updateNetworkBadge();
    }
  }

  async function loadRecords() {
    try {
      const idbRecs = await OfflineDB.getAllRecords();
      if (Array.isArray(idbRecs) && idbRecs.length > 0) {
        state.records = idbRecs.map(normalizeRecord);
      } else if (window.localStorage) {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) state.records = JSON.parse(raw).map(normalizeRecord);
      }
      const idbDel = await OfflineDB.getMeta(DELETE_QUEUE_KEY);
      if (Array.isArray(idbDel)) state.deleteQueue = idbDel;
      else if (window.localStorage) {
        const rawDel = localStorage.getItem(DELETE_QUEUE_KEY);
        if (rawDel) state.deleteQueue = JSON.parse(rawDel);
      }
    } catch (e) { state.records = []; }

    if (state.deleteQueue.length > 0) {
      const delSet = new Set(state.deleteQueue.map(d => String(d.createdAt)));
      state.records = state.records.filter(r => !delSet.has(String(r.createdAt)));
    }
    state.records.sort((a, b) => Number(b.createdAt) - Number(a.createdAt));
    const initValid = state.records.filter(r => !r.isDraft || String(r.createdAt) === String(state.activeId));
    if (initValid.length > 0 && !state.activeId) state.activeId = initValid[0].createdAt;
    state.loaded = true;
    render();

    if (navigator.onLine) {
      await syncOfflineQueue(false, false);
      fetchCloudRecords(false);
    } else {
      await notifyOfflineEntry(false);
    }
  }

  function revertActiveRecord() {
    if (state.cleanActiveRecord && state.activeId) {
      const idx = state.records.findIndex(x => String(x.createdAt) === String(state.activeId));
      if (idx !== -1) {
        state.records[idx] = normalizeRecord(JSON.parse(JSON.stringify(state.cleanActiveRecord)));
        saveRecords();
      }
    }
    state.isDirty = false;
  }

  async function wrapUnsaved() {
    if (state.isDirty) {
      const discard = await showModal(
        "Unsaved Changes Detected",
        "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.",
        "unsaved"
      );
      if (!discard) return false;
      revertActiveRecord();
    }
    return true;
  }

  function getNextReportNo() {
    const now = new Date();
    const prefix = `${String(now.getFullYear()).slice(-2)}${String(now.getMonth() + 1).padStart(2, '0')}-`;
    let max = 0;
    state.records.forEach(rec => {
      if (rec.reportNo && String(rec.reportNo).startsWith(prefix)) {
        const num = parseInt(String(rec.reportNo).split('-')[1], 10);
        if (!isNaN(num) && num > max) max = num;
      }
    });
    return prefix + String(max + 1).padStart(3, '0');
  }

  function normalizeDateStr(val) {
    if (!val) return '';
    const s = String(val).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    if (s.includes('T')) {
      const d = new Date(s);
      if (!isNaN(d)) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
    }
    const slash = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (slash) {
      const yyyy = slash[3].length === 2 ? '20' + slash[3] : slash[3];
      return `${yyyy}-${slash[2].padStart(2, '0')}-${slash[1].padStart(2, '0')}`;
    }
    return s;
  }

  function fmtDate(r) {
    const norm = normalizeDateStr(r.happeningDate);
    if (norm) {
      const p = norm.substring(0, 10).split('-');
      if (p.length === 3) return `${p[2]}/${p[1]}/${p[0].slice(-2)}`;
    }
    return '—';
  }

  function displayFullDate(r) {
    const norm = normalizeDateStr(r.happeningDate);
    if (norm && norm.includes('-')) {
      const p = norm.substring(0, 10).split('-');
      if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
    }
    return r.beforeImageDate || '—';
  }

  function getTs(iso) {
    const norm = normalizeDateStr(iso);
    if (norm) {
      const p = norm.split('-');
      if (p.length === 3) {
        const ts = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getTime();
        if (!isNaN(ts)) return ts;
      }
    }
    return null;
  }

  function getDefaultDateBounds() {
    const toIsoStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    let minTs = Date.now(), maxTs = Date.now();
    state.records.filter(r => !r.isDraft).forEach(r => {
      const t = getTs(r.happeningDate) || Number(r.createdAt);
      if (t && !isNaN(t)) {
        if (t < minTs) minTs = t;
        if (t > maxTs) maxTs = t;
      }
    });
    return { defStart: toIsoStr(new Date(minTs)), defEnd: toIsoStr(new Date(maxTs)) };
  }

  function getActive() {
    return state.activeId ? (state.records.find(r => String(r.createdAt) === String(state.activeId)) || null) : null;
  }

  // ==================== DASHBOARD TAB ====================
  function getFilteredDashboardRecords() {
    const sDate = document.getElementById('dash-start')?.value;
    const eDate = document.getElementById('dash-end')?.value;
    const getSel = n => Array.from(document.querySelectorAll(`input[name="${n}"]:checked`)).map(cb => cb.value);
    const selInsp = getSel('dash-insp');
    const selTask = getSel('dash-task');
    const selCat = getSel('dash-cat');
    const selStat = getSel('dash-status');
    const lineQ = (document.getElementById('dash-line')?.value || '').trim().toLowerCase();
    const convQ = (document.getElementById('dash-conveyor')?.value || '').trim().toLowerCase();
    const startTs = sDate ? getTs(sDate) : 0;
    const endTs = eDate ? (getTs(eDate) + 86400000) : Infinity;

    return state.records.filter(r => !r.isDraft).filter(r => {
      const units = normalizeRecord(r).units;
      const t = getTs(r.happeningDate) || Number(r.createdAt);
      if ((sDate || eDate) && (!t || t < startTs || t >= endTs)) return false;
      if (selStat.length && !selStat.includes(getStatus(r))) return false;
      if (selInsp.length && !units.some(u => selInsp.includes(u.inspectionMethod || ''))) return false;
      if (selTask.length && !units.some(u => parseMultiList(u.taskPerformed).some(tk => selTask.includes(tk)))) return false;
      if (selCat.length && !units.some(u => selCat.some(c => u.cat2 && u.cat2[c]))) return false;
      if (lineQ) {
        const matchLine = units.some(u => `${r.lineEquipment || ''}-${u.equipNo || ''}`.toLowerCase().includes(lineQ)) ||
                          (r.lineEquipment || '').toLowerCase().includes(lineQ);
        if (!matchLine) return false;
      }
      if (convQ && !units.some(u => (u.conveyorItem || '').toLowerCase().includes(convQ))) return false;
      return true;
    });
  }

  function setupDropdownFilters(wrapperId, defaultText = 'All') {
    const wrapper = document.getElementById(wrapperId);
    if (!wrapper) return;
    const btn = wrapper.querySelector('.dd-btn');
    const menu = wrapper.querySelector('.dd-menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menu.classList.contains('open');
      document.querySelectorAll('.dd-menu').forEach(m => m.classList.remove('open'));
      if (!isOpen) menu.classList.add('open');
    });
    menu.addEventListener('click', (e) => e.stopPropagation());
    const checkboxes = menu.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const checked = Array.from(checkboxes).filter(c => c.checked);
        const span = btn.querySelector('span') || btn;
        if (checked.length === 0) span.textContent = defaultText;
        else if (checked.length === 1) span.textContent = checked[0].nextElementSibling?.textContent?.trim() || checked[0].value;
        else span.textContent = `${checked.length} selected`;
        state.tableLimit = 10;
        const content = ROOT.querySelector('#ppm-content');
        if (content) updateDashboardUI(content);
      });
    });
  }

  function bindJPEGExport(btnId, filename) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('click', () => {
      if (typeof window.html2canvas === 'undefined') {
        showModal("Notice", "Export library is still loading. Please try again in a moment.");
        return;
      }
      const target = btn.closest('.panel');
      if (!target) return;
      const hideEls = target.querySelectorAll('.export-chart-btn');
      hideEls.forEach(el => { el.style.visibility = 'hidden'; });
      window.html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(canvas => {
        hideEls.forEach(el => { el.style.visibility = ''; });
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }).catch(() => {
        hideEls.forEach(el => { el.style.visibility = ''; });
        showModal("Export Error", "Unable to export chart image.", { errorMode: true });
      });
    });
  }

  function renderDashboardCharts(container, recs) {
    if (typeof window.Chart === 'undefined') return;
    if (state.charts.cat) { state.charts.cat.destroy(); state.charts.cat = null; }
    if (state.charts.status) { state.charts.status.destroy(); state.charts.status = null; }

    const isMobileChart = window.innerWidth <= 640;

    const customBgPlugin = {
      id: 'customCanvasBackgroundColor',
      beforeDraw: (c, a, o) => {
        const ctx = c.ctx; ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = o.color || '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.restore();
      }
    };

    // Category Chart (Exact sample_A vertical translucent blue bars)
    const catCtx = container.querySelector('#ppm-category-chart');
    if (catCtx) {
      const selCatNames = Array.from(document.querySelectorAll('input[name="dash-cat"]:checked')).map(cb => CATS2[cb.value]).filter(Boolean);
      const catArr = [];
      Object.entries(CATS2).forEach(([k, name]) => {
        let count = 0;
        recs.forEach(r => {
          const units = normalizeRecord(r).units;
          if (units.some(u => u.cat2 && u.cat2[k])) count++;
        });
        if (selCatNames.length === 0 || selCatNames.includes(name)) catArr.push({ name, count });
      });
      catArr.sort((a, b) => b.count - a.count);

      state.charts.cat = new window.Chart(catCtx, {
        type: 'bar',
        plugins: [customBgPlugin],
        data: {
          labels: catArr.map(x => x.name),
          datasets: [{
            label: 'Records',
            data: catArr.map(x => x.count),
            backgroundColor: catArr.map(() => 'rgba(37, 99, 235, 0.45)'),
            borderColor: catArr.map(() => 'rgba(37, 99, 235, 1)'),
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            customCanvasBackgroundColor: { color: '#ffffff' },
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(17, 24, 39, 0.95)',
              titleFont: { size: 13, weight: 'bold' },
              bodyFont: { size: 12 },
              padding: 10,
              cornerRadius: 8
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: { display: true, text: 'Total Memo', font: { size: 12, weight: 'bold' } },
              ticks: { stepSize: 1, font: { size: 10 } }
            },
            x: {
              ticks: { font: { size: 10 }, maxRotation: isMobileChart ? 25 : 0, minRotation: 0, display: true }
            }
          }
        }
      });
    }

    // Status Chart (Exact sample_A 45% cutout doughnut + center Total Memo + % slice labels + mobile bottom legend)
    const centerTextPlugin = {
      id: 'centerText',
      beforeDraw: c => {
        if (c.config.type !== 'doughnut') return;
        const w = c.width, h = c.height, ctx = c.ctx;
        ctx.save();
        const meta = c.getDatasetMeta(0);
        const centerX = meta.data.length ? meta.data[0].x : w / 2;
        const centerY = meta.data.length ? meta.data[0].y : h / 2;
        ctx.font = 'bold ' + (h / 114).toFixed(2) + 'em sans-serif';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#1f2937';
        const tot = c.data.datasets[0].data.reduce((a, b) => a + b, 0);
        ctx.fillText(tot.toString(), centerX, centerY - 6);
        ctx.font = 'normal ' + ((h / 114) * 0.35).toFixed(2) + 'em sans-serif';
        ctx.fillText('Total Memo', centerX, centerY + 12);
        ctx.restore();
      }
    };

    const sliceLabelsPlugin = {
      id: 'sliceLabels',
      afterDatasetsDraw: c => {
        if (c.config.type !== 'doughnut') return;
        const ctx = c.ctx, ds = c.data.datasets[0], tot = ds.data.reduce((a, b) => a + b, 0);
        if (!tot) return;
        c.getDatasetMeta(0).data.forEach((sec, i) => {
          if (!ds.data[i]) return;
          const pos = sec.tooltipPosition();
          ctx.save();
          ctx.fillStyle = '#374151';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(255,255,255,0.85)';
          ctx.shadowBlur = 4;
          ctx.fillText(Math.round((ds.data[i] / tot) * 100) + '%', pos.x, pos.y);
          ctx.restore();
        });
      }
    };

    const stCtx = container.querySelector('#ppm-urgency-chart');
    if (stCtx) {
      const sCounts = { done: 0, progress: 0, open: 0 };
      recs.forEach(r => { const st = getStatus(r); if (sCounts[st] !== undefined) sCounts[st]++; });

      state.charts.status = new window.Chart(stCtx, {
        type: 'doughnut',
        plugins: [customBgPlugin, centerTextPlugin, sliceLabelsPlugin],
        data: {
          labels: ['Completed', 'In Progress', 'Open'],
          datasets: [{
            data: [sCounts.done, sCounts.progress, sCounts.open],
            backgroundColor: ['rgba(5, 150, 105, 0.45)', 'rgba(217, 119, 6, 0.45)', 'rgba(156, 163, 175, 0.45)'],
            borderColor: ['rgba(5, 150, 105, 1)', 'rgba(217, 119, 6, 1)', 'rgba(156, 163, 175, 1)'],
            borderWidth: 1,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '45%',
          plugins: {
            customCanvasBackgroundColor: { color: '#ffffff' },
            legend: {
              position: isMobileChart ? 'bottom' : 'right',
              labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: isMobileChart ? 12 : 10, font: { size: 11 } }
            },
            tooltip: {
              backgroundColor: 'rgba(17, 24, 39, 0.95)',
              titleFont: { size: 13, weight: 'bold' },
              bodyFont: { size: 12 },
              padding: 10,
              cornerRadius: 8,
              callbacks: {
                label: c => ` ${c.label || ''}: ${c.raw || 0} memo${c.raw !== 1 ? 's' : ''} (${Math.round(((c.raw || 0) / (c.chart._metasets[c.datasetIndex].total || 1)) * 100)}%)`
              }
            }
          }
        }
      });
    }
  }

  function updateDashboardUI(container) {
    const filtered = getFilteredDashboardRecords().sort((a, b) => Number(b.createdAt) - Number(a.createdAt));
    const openCount = filtered.filter(r => getStatus(r) !== 'done').length;
    const doneCount = filtered.filter(r => getStatus(r) === 'done').length;
    const totalUnits = filtered.reduce((acc, r) => acc + normalizeRecord(r).units.length, 0);

    const catCounts = {}, inspCounts = {};
    filtered.forEach(r => {
      normalizeRecord(r).units.forEach(u => {
        if (u.cat2) Object.keys(CATS2).forEach(k => { if (u.cat2[k]) catCounts[CATS2[k]] = (catCounts[CATS2[k]] || 0) + 1; });
        if (u.inspectionMethod) inspCounts[u.inspectionMethod] = (inspCounts[u.inspectionMethod] || 0) + 1;
      });
    });
    const topInsp = Object.entries(inspCounts).sort((a, b) => b[1] - a[1])[0] || null;
    const topCat = Object.entries(catCounts).sort((a, b) => b[1] - a[1])[0] || null;
    const compRate = filtered.length === 0 ? null : Math.round((doneCount / filtered.length) * 100);

    const kpiCards = [
      { l: 'Open / In Progress', v: openCount, c: 'var(--crit)', s: `${filtered.length} total filtered`, p: openCount > 0 ? `<span class="kpi-pill pill-crit">Needs attention</span>` : `<span class="kpi-pill pill-ok">All clear</span>` },
      { l: 'Inspection Method', v: topInsp ? topInsp[0] : '—', c: 'var(--warn)', s: topInsp ? `${topInsp[1]} unit(s) logged` : 'No inspection data', p: topInsp ? `<span class="kpi-pill pill-warn">Most used</span>` : '' },
      { l: 'Top Category', v: topCat ? topCat[0] : '—', c: 'var(--accent-2)', s: topCat ? `${topCat[1]} unit(s) logged` : 'No category data', p: '' },
      { l: 'Completion Rate', v: compRate === null ? '—' : (compRate + '%'), c: 'var(--accent)', s: `${doneCount} of ${filtered.length} report(s) done`, p: compRate === 100 ? `<span class="kpi-pill pill-ok">Perfect</span>` : '' },
      { l: 'Total Units Logged', v: totalUnits, c: 'var(--ok)', s: `Across ${filtered.length} report(s)`, p: '' }
    ];

    const gridEl = container.querySelector('#dash-kpi-grid');
    if (gridEl) {
      gridEl.innerHTML = kpiCards.map(c => `<div class="kpi-card"><div class="bar" style="background:${c.c}"></div><div class="kpi-label">${c.l}</div><div class="kpi-value">${c.v}</div><div class="kpi-sub">${c.s}</div>${c.p}</div>`).join('');
    }

    renderDashboardCharts(container, filtered);

            ? 'This dashboard was opened as a local file attachment. Open it via its HTTPS web URL in Chrome.'

        tContainer.querySelector('#dash-show-all-btn')?.addEventListener('click', () => { state.tableLimit = filtered.length; updateDashboardUI(container); });

      }
    }
  }

  function optimizeCameraImage(file, watermark = {}, maxDim = 1280, quality = 0.78) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('Invalid image'));
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Read error'));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Decode error'));
        img.onload = () => {
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          const pad = Math.max(12, Math.round(w * 0.018));
          const fontSize = Math.max(13, Math.round(w * 0.021));
          const lineHeight = Math.round(fontSize * 1.42);
          const barHeight = lineHeight * 2 + pad * 1.5;
          const barY = h - barHeight;
          const accent = watermark.accentColor || '#2563eb';

          const grad = ctx.createLinearGradient(0, barY - pad, 0, h);
          grad.addColorStop(0, 'rgba(15, 23, 42, 0.58)');
          grad.addColorStop(1, 'rgba(15, 23, 42, 0.90)');
          ctx.fillStyle = grad; ctx.fillRect(0, barY, w, barHeight);
          ctx.fillStyle = accent; ctx.fillRect(0, barY, Math.max(4, Math.round(w * 0.006)), barHeight);

          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)'; ctx.shadowBlur = 4;
          ctx.font = `700 ${fontSize}px ui-monospace, monospace`;
          ctx.fillStyle = '#f8fafc'; ctx.textAlign = 'left';
          const row1Y = barY + pad * 0.75 + lineHeight * 0.5;
          const row2Y = row1Y + lineHeight;
          ctx.fillText(`Date: ${watermark.date || ''}   |   Time: ${watermark.time || ''}`, pad * 1.35, row1Y);

          ctx.font = `600 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
          ctx.fillStyle = '#e2e8f0';
          let locDisplay = `Location: ${watermark.location || 'Not Specified'}`;
          while (ctx.measureText(locDisplay).width > (w - pad * 3.5) && locDisplay.length > 14) locDisplay = locDisplay.slice(0, -4) + '...';
          ctx.fillText(locDisplay, pad * 1.35, row2Y);

          if (watermark.tag) {
            ctx.font = `800 ${Math.max(11, Math.round(fontSize * 0.82))}px ui-sans-serif, system-ui, sans-serif`;
            ctx.fillStyle = accent; ctx.textAlign = 'right';
            ctx.fillText(String(watermark.tag).toUpperCase(), w - pad, row1Y);
          }
          ctx.shadowBlur = 0;
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function isUnitComplete(u) {
    return checkReq(u.equipNo) && Object.keys(CATS2).some(k => u.cat2 && u.cat2[k]) &&
           checkReq(u.inspectionMethod) && parseMultiList(u.taskPerformed).length > 0 && checkReq(u.resultCat);
  }

  function suggestNextEquipNo(r) {
    const units = normalizeRecord(r).units;
    const used = new Set(units.map(u => String(u.equipNo || '').trim()));
    const line = r.lineEquipment || '';
    const lastNo = String((units[units.length - 1] && units[units.length - 1].equipNo) || '').trim();

    if (lastNo) {
      const m = lastNo.match(/^(.*?)(\d+)$/);
      if (m) {
        const prefix = m[1], numStr = m[2];
        let nextNum = parseInt(numStr, 10) + 1;
        for (let tries = 0; tries < 50; tries++) {
          const candidate = prefix + String(nextNum).padStart(numStr.length, '0');
          if (!used.has(candidate)) return candidate;
          nextNum++;
        }
      }
    }
    if (line && EQUIP_DB[line]) {
      const avail = Object.keys(EQUIP_DB[line]).sort().find(n => !used.has(n));
      if (avail) return avail;
    }
    return '';
  }

    });

    if (!ig || (ig.toUpperCase().startsWith('VENDOR') && ig.trim().toUpperCase() === 'VENDOR')) {
      container.querySelectorAll('[data-calc-group="issuedGroup"]').forEach(el => el.classList.add('err-highlight'));
    }
    if (!checkReq(u.equipNo)) container.querySelector('[data-unit-field="equipNo"]')?.classList.add('err-highlight');
    if (!checkReq(u.conveyorItem)) container.querySelector('[data-unit-field="conveyorItem"]')?.classList.add('err-highlight');
    if (!Object.keys(CATS2).some(k => u.cat2 && u.cat2[k])) container.querySelector('#sec-category')?.classList.add('err-sec');
    if (!u.beforeImage) container.querySelector('[data-ref-card="before"]')?.classList.add('err-highlight');
    if (!checkReq(u.inspectionMethod)) container.querySelector('[data-unit-field="inspectionMethod"]')?.classList.add('err-highlight');

  }

  function renderInput(container) {
    let r = getActive();
    if (!r) {
      r = blankRecord(); r.reportNo = getNextReportNo();
      state.records.unshift(r); state.activeId = r.createdAt; state.activeUnitIdx = 0; state.isDirty = false;
    }
    normalizeRecord(r);
    if (state.activeUnitIdx >= r.units.length) state.activeUnitIdx = 0;
    if (!state.isDirty) state.cleanActiveRecord = JSON.parse(JSON.stringify(r));

    const u = r.units[state.activeUnitIdx];
    const options = state.records.slice().sort((a, b) => Number(b.createdAt) - Number(a.createdAt))
      .map(x => `<option value="${x.createdAt}" ${String(x.createdAt) === String(r.createdAt) ? 'selected' : ''}>${x.isDraft ? '[Draft] ' : (x.syncPending ? '[Pending Sync] ' : '')}BHS/PPM ${esc(x.reportNo || 'N/A')}</option>`).join('');

    let igBase = r.issuedGroup || '', igVendor = '';
    if (igBase.toUpperCase().startsWith('VENDOR')) {
      igBase = 'Vendor';
      igVendor = (r.issuedGroup || '').substring(6).replace(/^:\s*/, '').trim();

    const noOptions = lineEquipMap ? Object.keys(lineEquipMap).sort() : [];
    const cleaningVisible = Boolean(u.showCleaningBox || u.cleaningImage);

    const selectedTasks = parseMultiList(u.taskPerformed);
    const taskBtnLabel = selectedTasks.length === 0 ? 'Select task(s)...' : selectedTasks.join(', ');

    const selectedDoneBy = parseMultiList(r.doneByName);
    const doneByBtnLabel = selectedDoneBy.length === 0 ? 'Select Technician(s)...' : (selectedDoneBy.length <= 2 ? selectedDoneBy.join(', ') : `${selectedDoneBy.length} Technicians selected`);

    const makeSelect = (lbl, attr, val, opts) => {
      const list = (val && !opts.includes(val)) ? [val, ...opts] : opts;
      return `<label class="f">${lbl}<select ${attr}><option value=""></option>${list.map(o => `<option value="${esc(o)}" ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;

      const done = isUnitComplete(item);
      const icon = isAct ? '●' : (done ? '✓' : '○');
      const lbl = item.equipNo ? `No. ${esc(item.equipNo)}` : `Unit ${idx + 1}`;
      return `<div class="unit-pill ${isAct ? 'active' : ''} ${done ? 'done' : ''}" data-unit-tab="${idx}"><span>${icon} ${lbl}</span>${r.units.length > 1 ? `<button type="button" class="u-rm" data-unit-rm="${idx}" title="Remove unit">×</button>` : ''}</div>`;
    }).join('');

    container.innerHTML = `
      <div class="form-shell">
        <div class="form-toolbar">
          <div class="rec-select">
            <span style="font-weight:700">Report No.:</span>
            <select class="recpick" id="ppm-recpick">${options}</select>
            <div class="toolbar-status-box" id="ppm-toolbar-status"></div>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="ppm-new-btn">✚ Add New Memo</button>
            <button type="button" class="btn btn-danger" id="ppm-del-btn">Delete ✘</button>
            <button type="button" class="btn btn-primary" id="ppm-submit-btn" style="background:var(--ok)">Submit ✔</button>
            <button type="button" class="btn btn-primary" id="ppm-view-btn">View Memo ➜</button>
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">Notification &amp; Work Order</div>
          <div class="grid g5">
            <label class="f">Notification No.<input type="text" data-field="notificationNo" value="${esc(r.notificationNo)}"/></label>

            ${makeSelect('Maintenance Type', 'data-field="maintenanceType"', r.maintenanceType, ['Breakdown', 'Corrective', 'Preventive'])}
            <label class="f">Report No. (BHS/PPM)<input type="text" data-field="reportNo" value="${esc(r.reportNo)}" readonly class="locked-field"/></label>
            <label class="f">Time of Record<input type="time" data-field="timeOfHappening" value="${esc(r.timeOfHappening)}" readonly class="locked-field" tabindex="-1"/></label>
          </div>
          <div class="grid g3" style="margin-top:10px">
            <label class="f">Date<input type="date" data-field="happeningDate" value="${esc(r.happeningDate)}" readonly class="locked-field" tabindex="-1"/></label>
            ${makeSelect('Issued By', 'data-field="issuedBy"', r.issuedBy, TECH_NAMES)}
            <label class="f">Group
              <div style="display:flex;gap:6px">
                <select style="flex:1;min-width:0" data-calc-group="issuedGroup" data-part="base">
                  <option value=""></option>

                </select>
                ${igBase === 'Vendor' ? `<input type="text" style="flex:1;min-width:0" placeholder="Vendor Name..." data-calc-group="issuedGroup" data-part="vendor" value="${esc(igVendor)}"/>` : ''}

            </label>

        </div>

        <div class="sec">
          <div class="sec-title">Title &amp; Equipment</div>
          <div class="grid g2">
            <label class="f">Title<input type="text" data-field="title" value="${esc(r.title)}"/></label>
            <label class="f">Line/Equipment<input type="text" data-field="lineEquipment" value="${esc(r.lineEquipment)}" list="dl-line-equip" autocomplete="off" placeholder="Type or select..."/><datalist id="dl-line-equip">${Object.keys(EQUIP_DB).sort().map(l => `<option value="${esc(l)}"></option>`).join('')}</datalist></label>
          </div>

          <div class="unit-bar-wrap">
            <div class="unit-bar-head">
