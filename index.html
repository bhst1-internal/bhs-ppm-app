<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BHS Maintenance : Planned Preventative Maintenance (PPM)</title>
<style>
  /* Base Reset & Theme Variables */
  #acm-root,#acm-root *{box-sizing:border-box}
  #acm-root{
    --ink:#1f2937;--ink-light:#374151;--paper:#ffffff;--line:#e5e7eb;--line-dark:#9ca3af;
    --accent:#2563eb;--accent-2:#1d4ed8;--bg:#f3f4f6;--input-bg:#f9fafb;--text-sec:#6b7280;
    --ok:#059669;--warn:#d97706;--crit:#dc2626;
    font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);background:var(--bg);padding:0;min-height:100vh;font-size:.875rem;line-height:1.4;position:relative
  }
  body{margin:0;background:#f3f4f6}
  .mono-font,#acm-root input[type=date],#acm-root input[type=time],#acm-root .kpi-value,#acm-root .doc-footer-code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace
  }
  #acm-root .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
  #acm-root .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  #acm-root .brand{display:flex;flex-direction:column;gap:2px}
  #acm-root .brand .k{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sec);font-weight:700}
  #acm-root .brand .t{font-size:1.125rem;font-weight:800;color:var(--ink)}
  #acm-root .tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:10px}
  #acm-root .tab-btn{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .15s}
  #acm-root .tab-btn.active{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  #acm-root .tab-btn:hover:not(.active){color:var(--ink)}

  /* KPI Grid */
  #acm-root .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .kpi-grid{grid-template-columns:repeat(2,1fr)}}
  #acm-root .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:visible}
  #acm-root .kpi-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
  #acm-root .kpi-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sec);font-weight:700}
  #acm-root .kpi-value{font-size:1.45rem;font-weight:800;color:var(--ink);line-height:1.1;margin-top:2px}
  #acm-root .kpi-sub{font-size:.75rem;color:var(--text-sec)}
  #acm-root .kpi-pill{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:999px;width:fit-content;margin-top:2px}
  #acm-root .pill-ok{background:#d1fae5;color:var(--ok)}
  #acm-root .pill-warn{background:#fef3c7;color:var(--warn)}
  #acm-root .pill-crit{background:#fee2e2;color:var(--crit)}

  /* Multi-Select Dropdowns */
  #acm-root .dd-wrapper{position:relative;width:100%;margin-top:2px}
  #acm-root .dd-btn{width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);font-size:.75rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #acm-root .dd-btn::after{content:"▼";font-size:.55rem;margin-left:6px;color:var(--line-dark);flex-shrink:0}
  #acm-root .dd-menu{display:none;position:absolute;top:100%;left:0;width:100%;max-height:220px;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:7px;z-index:120;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:4px}
  #acm-root .dd-menu.open{display:flex;flex-direction:column;gap:6px}

  /* Charts & Panels */
  #acm-root .charts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .charts-grid{grid-template-columns:minmax(0,1fr)}}
  #acm-root .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;overflow:hidden}
  #acm-root .panel h3{margin:0 0 10px;font-size:.875rem;font-weight:800;color:var(--ink)}
  #acm-root .panel .hint{font-size:.75rem;color:var(--line-dark);margin-bottom:8px}
  #acm-root .table-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto}
  #acm-root table.list{width:100%;border-collapse:collapse}
  #acm-root table.list th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sec);background-color:var(--input-bg);padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
  #acm-root table.list td{font-size:.72rem;color:var(--ink-light);padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  #acm-root table.list tr:hover td{background:var(--input-bg)}
  #acm-root table.list tr.grp-multi-first td{border-top:2px solid #cbd5e1}
  #acm-root table.list tr.grp-multi-sub td{border-top:1px dashed #e2e8f0}
  #acm-root table.list td.grp-accent{border-left:3px solid #2563eb;background:#f8fafc}
  #acm-root .status-chip{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  #acm-root .chip-open{background:#e5e7eb;color:var(--text-sec)}
  #acm-root .chip-progress{background:#fef3c7;color:var(--warn)}
  #acm-root .chip-done{background:#d1fae5;color:var(--ok)}
  #acm-root .link-btn{border:none;background:none;color:var(--accent);font-weight:700;font-size:.75rem;cursor:pointer;padding:2px 4px}
  #acm-root .empty-state{text-align:center;padding:34px 10px;color:var(--text-sec);font-size:.875rem}

  /* Pending Items Hover Tooltip for In Progress Status */
  #acm-root .status-tip-wrap{position:relative;display:inline-flex;align-items:center;cursor:help}
  #acm-root .status-tip-box{
    display:none;position:absolute;right:0;bottom:calc(100% + 8px);width:265px;
    background:#111827;color:#f8fafc;border-radius:9px;padding:10px 12px;
    box-shadow:0 10px 24px rgba(15,23,42,.28);z-index:220;text-align:left;pointer-events:none
  }
  #acm-root .status-tip-box::after{
    content:'';position:absolute;top:100%;right:18px;border:6px solid transparent;border-top-color:#111827
  }
  #acm-root .status-tip-wrap:hover .status-tip-box,
  #acm-root .status-tip-wrap:focus-within .status-tip-box{display:block}
  #acm-root .status-tip-title{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fbbf24;margin-bottom:5px;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:4px}
  #acm-root .status-tip-list{margin:0;padding-left:15px;font-size:.71rem;line-height:1.45;color:#e2e8f0}
  #acm-root .status-tip-list li{margin-bottom:2px}

  /* Pagination Footer Bar */
  #acm-root .table-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  #acm-root .table-pager-info{font-size:.75rem;color:var(--text-sec);font-weight:600}
  #acm-root .table-pager-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* Forms & Toolbars */
  #acm-root .form-shell{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px 24px}
  #acm-root .form-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  #acm-root .form-toolbar .rec-select{display:flex;align-items:center;gap:8px;font-size:.875rem}
  #acm-root select.recpick{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;background:var(--input-bg);color:var(--ink);font-family:ui-monospace,monospace}
  #acm-root .btn{border:none;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .btn-primary{background:var(--accent);color:#fff}
  #acm-root .btn-primary:hover{background:var(--accent-2)}
  #acm-root .btn-ghost{background:var(--line);color:var(--ink-light)}
  #acm-root .btn-ghost:hover{background:#d1d5db}
  #acm-root .btn-danger{background:#fee2e2;color:var(--crit)}
  #acm-root .btn-danger:hover{background:#fca5a5}
  #acm-root .btn-solid-danger{background:var(--crit);color:#fff}
  #acm-root .btn-solid-danger:hover{background:#b91c1c}
  #acm-root .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  #acm-root .btn-export-excel{background-color:var(--ok);color:#ffffff;font-size:.82rem;font-weight:700;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
  #acm-root .btn-export-excel:hover{background-color:#047857}
  #acm-root .btn-export-excel svg{width:15px;height:15px}
  #acm-root .sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;transition:all .2s}
  #acm-root .sec>.sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
  #acm-root .grid{display:grid;gap:10px}
  #acm-root .g2{grid-template-columns:1fr 1fr}
  #acm-root .g3{grid-template-columns:1fr 1fr 1fr}
  #acm-root .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  #acm-root .g5{grid-template-columns:repeat(5,1fr)}
  @media (max-width:720px){#acm-root .g2,#acm-root .g3,#acm-root .g4,#acm-root .g5{grid-template-columns:1fr}}
  #acm-root label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--ink-light);font-weight:600}
  #acm-root input[type=text],#acm-root input[type=date],#acm-root input[type=time],#acm-root input[type=number],#acm-root textarea,#acm-root select{
    padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;font-family:inherit;color:var(--ink);background:var(--input-bg);transition:all .2s
  }
  #acm-root textarea{resize:vertical;min-height:58px}
  #acm-root .check-row,#acm-root .radio-row{display:flex;flex-wrap:wrap;gap:12px}
  #acm-root .chk,#acm-root .rad{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--ink-light);cursor:pointer}
  #acm-root .chk input,#acm-root .rad input{width:15px;height:15px;accent-color:var(--accent)}

  /* Multi-Unit Selector Bar */
  #acm-root .unit-bar-wrap{margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid #cbd5e1}
  #acm-root .unit-bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  #acm-root .unit-bar-title{font-size:.74rem;font-weight:800;color:#1e3a8a;text-transform:uppercase;letter-spacing:.04em}
  #acm-root .unit-bar-actions{display:flex;gap:6px;flex-wrap:wrap}
  #acm-root .unit-act-btn{border:1px solid #cbd5e1;background:#ffffff;color:#1e293b;padding:4px 9px;border-radius:7px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .unit-act-btn:hover{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
  #acm-root .unit-act-btn.primary{background:#2563eb;border-color:#2563eb;color:#ffffff}
  #acm-root .unit-act-btn.primary:hover{background:#1d4ed8}
  #acm-root .unit-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  #acm-root .unit-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid #cbd5e1;background:#ffffff;color:#334155;font-size:.74rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .unit-pill:hover{border-color:#93c5fd;background:#f0f9ff}
  #acm-root .unit-pill.active{background:#1d4ed8;border-color:#1d4ed8;color:#ffffff;box-shadow:0 2px 6px rgba(29,78,216,.25)}
  #acm-root .unit-pill-dot{font-size:.72rem;line-height:1}
  #acm-root .unit-pill-del{border:none;background:transparent;color:inherit;opacity:.7;font-size:.72rem;cursor:pointer;padding:0 2px;line-height:1}
  #acm-root .unit-pill-del:hover{opacity:1;color:#ef4444}
  #acm-root .unit-active-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border-radius:7px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:.74rem;font-weight:700}

  /* Reference Image Section (Memo Details) */
  #acm-root .ref-sec-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  #acm-root .ref-sec-header .sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0}
  #acm-root .ref-cleaning-toggle-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px dashed #38bdf8;background:#f0f9ff;color:#0369a1;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .ref-cleaning-toggle-btn:hover{background:#e0f2fe;border-color:#0284c7}
  #acm-root .ref-cleaning-toggle-btn.active{border-style:solid;border-color:#0284c7;background:#e0f2fe;color:#075985}
  #acm-root .ref-img-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  @media (max-width:720px){#acm-root .ref-img-grid{grid-template-columns:1fr}}
  #acm-root .ref-img-card{border:1px solid var(--line);border-radius:10px;background:var(--input-bg);overflow:hidden;display:flex;flex-direction:column;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  #acm-root .ref-img-card:hover{border-color:#cbd5e1;box-shadow:0 4px 12px rgba(15,23,42,.06)}
  #acm-root .ref-img-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
  #acm-root .ref-img-badge{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center}
  #acm-root .badge-before{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
  #acm-root .badge-cleaning{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
  #acm-root .badge-after{background:#d1fae5;color:#047857;border:1px solid #a7f3d0}
  #acm-root .ref-img-meta{font-size:.68rem;color:var(--text-sec);font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  #acm-root .ref-img-stage{position:relative;height:210px;background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  #acm-root .ref-img-preview{width:100%;height:100%;object-fit:contain;display:block;background:#0f172a}
  #acm-root .ref-img-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;text-align:center;color:var(--text-sec);transition:transform .15s}
  #acm-root .ref-img-stage:hover .ref-img-empty{transform:translateY(-2px)}
  #acm-root .ref-cam-circle{width:46px;height:46px;border-radius:999px;background:#dbeafe;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:2px;box-shadow:0 2px 6px rgba(37,99,235,.15)}
  #acm-root .ref-img-empty-title{font-size:.8rem;font-weight:700;color:var(--ink)}
  #acm-root .ref-img-empty-sub{font-size:.7rem;color:var(--text-sec)}
  #acm-root .ref-img-footer{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--paper);border-top:1px solid var(--line)}
  #acm-root .ref-img-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink-light);font-size:.73rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .ref-img-btn:hover{background:var(--line);color:var(--ink)}
  #acm-root .ref-img-btn.cam{background:var(--accent);border-color:var(--accent);color:#fff}
  #acm-root .ref-img-btn.cam:hover{background:var(--accent-2);border-color:var(--accent-2)}
  #acm-root .ref-img-btn.del{color:var(--crit);background:#fef2f2;border-color:#fecaca}
  #acm-root .ref-img-btn.del:hover{background:#fee2e2}

  /* Modal & Lightbox */
  #acm-root #acm-modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.7);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)}
  #acm-root #acm-modal-overlay.active{opacity:1;pointer-events:auto}
  #acm-root #acm-modal-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:90%;max-width:440px;box-shadow:0 12px 32px rgba(0,0,0,.18);transform:translateY(12px);transition:transform .2s ease}
  #acm-root #acm-modal-overlay.active #acm-modal-box{transform:translateY(0)}
  #acm-root #acm-modal-title{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:8px}
  #acm-root #acm-modal-msg{font-size:.875rem;color:var(--ink-light);margin-bottom:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  #acm-root #acm-modal-input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px;font-size:.875rem;font-family:inherit;color:var(--ink);background:var(--input-bg);outline:none;display:none}
  #acm-root #acm-modal-input:focus{border-color:var(--accent)}
  #acm-root #acm-modal-actions{display:flex;justify-content:flex-end;gap:8px}
  #acm-root #acm-lightbox-overlay{position:fixed;inset:0;background:rgba(15,23,42,.82);z-index:99998;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(3px)}
  #acm-root #acm-lightbox-overlay.active{opacity:1;pointer-events:auto}
  #acm-root #acm-lightbox-card{background:var(--paper);border-radius:12px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.35)}
  #acm-root #acm-lightbox-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:.875rem;color:var(--ink)}
  #acm-root #acm-lightbox-body{background:#0f172a;display:flex;align-items:center;justify-content:center;overflow:auto;padding:8px}
  #acm-root #acm-lightbox-body img{max-width:100%;max-height:78vh;object-fit:contain;display:block}

  /* Network Status Badge */
  #acm-root .net-status-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #acm-root .net-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid transparent}
  #acm-root .net-dot{width:8px;height:8px;border-radius:999px;display:inline-block}
  #acm-root .net-online{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
  #acm-root .net-online .net-dot{background:#10b981}
  #acm-root .net-offline{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  #acm-root .net-offline .net-dot{background:#ef4444}
  #acm-root .net-syncing{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  #acm-root .net-syncing .net-dot{background:#2563eb;animation:ppmPulse 1s infinite}
  #acm-root .sync-now-btn{border:1px solid #f59e0b;background:#fffbeb;color:#b45309;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  #acm-root .chip-sync{background:#dbeafe;color:#1d4ed8;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:999px;display:inline-block;margin-left:4px}
  @keyframes ppmPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}

  /* A4 Memo View Styling */
  #acm-root .doc-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  #acm-root .doc-scroll{overflow-x:auto;overflow-y:auto;background:#cbd5e1;padding:24px 14px;border-radius:12px;max-height:calc(100vh - 140px)}

      if (u.cat2) Object.keys(u.cat2).forEach(k => { if (u.cat2[k]) mergedCat2[k] = true; });
    });
    r.cat2 = mergedCat2;
    r.inspectionMethod = Array.from(new Set(units.map(u => (u.inspectionMethod || '').trim()).filter(Boolean))).join(', ');
    r.taskPerformed = Array.from(new Set(units.flatMap(u => parseMultiList(u.taskPerformed)))).join(', ');
    r.reasonDetail = first.reasonDetail || '';
    r.resultCat = first.resultCat || '';
    r.paramSpeed = first.paramSpeed || '';
    r.paramTemp = first.paramTemp || '';
    r.paramCurrent = first.paramCurrent || '';
    r.paramVoltage = first.paramVoltage || '';
    r.resultDetail = first.resultDetail || '';
  }

  function isUnitComplete(u) {
    return checkReq(u.equipNo) && checkReq(u.inspectionMethod) && checkReq(u.taskPerformed) && checkReq(u.resultCat);
  }

  // Returns clean standardized status: "Open", "In Progress", or "Completed"
  function getStatus(r) {
    const units = ensureUnits(r);
    const allUnitsCore = units.every(u =>
      checkReq(u.inspectionMethod) && checkReq(u.taskPerformed) && checkReq(u.resultCat)
    );
    const anyUnitProgress = units.some(u =>
      checkReq(u.taskPerformed) || checkReq(u.afterImage) || checkReq(u.resultCat)
    );
    const doneValid = (r.doneByName || '').trim().length >= 3;
    const checkValid = (r.checkByName || '').trim().length >= 3;
    const confirmValid = checkReq(r.confirmedByName);
    if (allUnitsCore && doneValid && checkValid && confirmValid) return 'Completed';
    if (anyUnitProgress || doneValid || checkValid || confirmValid) return 'In Progress';
    return 'Open';
  }

  function getStatusKey(r) {
    const label = getStatus(r);
    if (label === 'Completed') return 'done';
    if (label === 'In Progress') return 'progress';
    return 'open';
  }

  // Computes the exact list of missing items needed to complete a Report No.
  function getPendingItems(r) {
    const units = ensureUnits(r);
    const multi = units.length > 1;
    const items = [];
    units.forEach((u, idx) => {
      const missing = [];
      if (!checkReq(u.inspectionMethod)) missing.push('Inspection Method');
      if (!checkReq(u.taskPerformed)) missing.push('Task Performed');
      if (!checkReq(u.resultCat)) missing.push('Result');
      if (missing.length) {
        const prefix = multi ? `${u.equipNo || `Unit ${idx + 1}`}: ` : '';
        items.push(`${prefix}${missing.join(', ')}`);
      }
    });
    if ((r.doneByName || '').trim().length < 3) items.push('Sign-off: Done By (TECH)');
    if ((r.checkByName || '').trim().length < 3) items.push('Sign-off: Check By (TO)');
    if (!checkReq(r.confirmedByName)) items.push('Sign-off: Confirmed By (TE/E/SE)');
    return items;
  }

          <div id="acm-modal-box">

            <div id="acm-modal-msg"></div>
            <input type="text" id="acm-modal-input" autocomplete="off"/>
            <div id="acm-modal-actions"></div>
          </div>`;
        ROOT.appendChild(overlay);
      }

      const titleEl = overlay.querySelector('#acm-modal-title');
      const msgEl = overlay.querySelector('#acm-modal-msg');
      const inputEl = overlay.querySelector('#acm-modal-input');
      const actionsEl = overlay.querySelector('#acm-modal-actions');

      titleEl.textContent = title || 'Notice';
      if (opts.html) {
        msgEl.style.whiteSpace = 'normal';
        msgEl.innerHTML = opts.html;
      } else {
        msgEl.style.whiteSpace = 'pre-wrap';
        msgEl.textContent = msg || '';

        inputEl.style.display = 'block';
        inputEl.type = opts.inputType || 'text';
        inputEl.autocomplete = opts.inputType === 'password' ? 'new-password' : 'off';
        inputEl.value = opts.defaultValue || '';
        inputEl.placeholder = opts.placeholder || '';
      } else {
        inputEl.style.display = 'none';

      actionsEl.innerHTML = '';

        cancelBtn.className = 'btn btn-ghost';

        cancelBtn.onclick = () => {
          overlay.classList.remove('active');
          resolve(opts.input ? null : false);

        actionsEl.appendChild(cancelBtn);

      const submitOk = () => {
        overlay.classList.remove('active');
        if (opts.input) resolve(inputEl.value);
        else resolve(true);

      const okBtn = document.createElement('button');
      okBtn.type = 'button';

      okBtn.textContent = opts.okText || 'OK';

  function updateNetworkBadge() {

  function postPayloadWithTimeout(payloadObj, timeoutMs = 20000) {
    if (window.google && window.google.script && window.google.script.run) {
      return new Promise((resolve, reject) => {
        const runner = window.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        if (payloadObj.action === 'delete') runner.deleteRecordFromClient(payloadObj.createdAt);
        else runner.saveRecordFromClient(JSON.stringify(payloadObj));
      });
    }
    return new Promise((resolve, reject) => {
      if (!navigator.onLine) return reject(new Error('Device is offline'));
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => { if (controller) controller.abort(); reject(new Error('Request timed out')); }, timeoutMs);
      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams({ payload: JSON.stringify(payloadObj) }),
        signal: controller ? controller.signal : undefined
      }).then(() => { clearTimeout(timer); resolve(true); }).catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  function mergeCloudRecords(googleData) {
    if (!Array.isArray(googleData)) return;
    state.isOnline = true;
    const cleanDate = iso => (!iso || typeof iso !== 'string' || !iso.includes('T')) ? iso : iso.substring(0, 10);
    const cleanTime = iso => (!iso || typeof iso !== 'string' || !iso.includes('T')) ? iso : new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    const delSet = new Set((state.deleteQueue || []).map(d => String(d.createdAt)));

    let validData = [];
    googleData.forEach(g => {
      if (!g || !g.createdAt || delSet.has(String(g.createdAt))) return;
      g.happeningDate = cleanDate(g.happeningDate);
      g.timeOfHappening = cleanTime(g.timeOfHappening);
      ensureUnits(g);
      g.syncPending = false;
      validData.push(g);
    });

    const drafts = state.records.filter(r => r.isDraft);
    const cloudMap = new Map(validData.map(g => [String(g.createdAt), g]));
    const localPending = state.records.filter(r => !r.isDraft && !cloudMap.has(String(r.createdAt)));

    state.records = [...drafts, ...localPending, ...validData].sort((a, b) => b.createdAt - a.createdAt);
    saveRecords();
    if (!state.activeId && state.records.length) state.activeId = state.records[0].createdAt;
    if (!(state.tab === 'input' && state.dirty)) render();
    else updateNetworkBadge();
  }

  function fetchCloudRecords() {
    if (window.google && window.google.script && window.google.script.run) {
      window.google.script.run
        .withSuccessHandler(data => mergeCloudRecords(data))
        .withFailureHandler(() => { updateNetworkBadge(); })
        .readAllRecords();
      return;
    }
    if (!navigator.onLine || !WEB_APP_URL) return;
    const oldScript = document.getElementById('ppm-sheets-sync');
    if (oldScript) oldScript.remove();
    window.syncGoogleSheets = mergeCloudRecords;
    const script = document.createElement('script');
    script.id = 'ppm-sheets-sync';
    script.src = `${WEB_APP_URL}?action=read&callback=syncGoogleSheets&t=${Date.now()}`;
    script.onerror = () => { updateNetworkBadge(); };
    document.body.appendChild(script);
  }

  async function syncOfflineQueue(manualTrigger = false) {
    if (state.isSyncing) return;
    if (!navigator.onLine) {
      state.isOnline = false;
      updateNetworkBadge();
      if (manualTrigger) await showModal('Offline', 'No internet connection detected. Records remain safely stored offline.');
      return;
    }
    const pendingDeletes = [...(state.deleteQueue || [])];
    const pendingRecords = state.records.filter(r => !r.isDraft && r.syncPending);
    if (!pendingDeletes.length && !pendingRecords.length) { updateNetworkBadge(); return; }

    state.isSyncing = true;
    updateNetworkBadge();
    try {
      for (const delItem of pendingDeletes) {
        await postPayloadWithTimeout({ action: 'delete', createdAt: delItem.createdAt }, 12000);
        state.deleteQueue = state.deleteQueue.filter(x => String(x.createdAt) !== String(delItem.createdAt));
        await saveDeleteQueue();
      }
      for (const rec of pendingRecords) {
        syncParentSummaryFromUnits(rec);
        await postPayloadWithTimeout({ ...rec, syncPending: false }, 25000);
        rec.syncPending = false;
      }
      await saveRecords();
      setTimeout(() => fetchCloudRecords(), 1200);
    } catch (err) {
      console.warn('Sync paused:', err);
    } finally {
      state.isSyncing = false;
      updateNetworkBadge();
    }
  }

  async function loadRecords() {
    try {
      const idbRecs = await OfflineDB.getAllRecords();
      if (Array.isArray(idbRecs) && idbRecs.length) {
        state.records = idbRecs;
      } else {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) state.records = JSON.parse(raw);
        } catch (e) {}
      }
      const idbDel = await OfflineDB.getMeta(DELETE_QUEUE_KEY);
      if (Array.isArray(idbDel)) state.deleteQueue = idbDel;
    } catch (e) { state.records = []; }

    state.records.forEach(r => ensureUnits(r));
    state.records.sort((a, b) => b.createdAt - a.createdAt);
    if (state.records.length && !state.activeId) state.activeId = state.records[0].createdAt;
    state.loaded = true;
    render();

    if (navigator.onLine) {
      await syncOfflineQueue(false);
      fetchCloudRecords();
    }
  }

  function getNextReportNo() {
    const now = new Date();
    const prefix = `${String(now.getFullYear()).slice(-2)}${String(now.getMonth() + 1).padStart(2, '0')}-`;
    let max = 0;
    state.records.forEach(rec => {
      if (rec.reportNo && String(rec.reportNo).startsWith(prefix)) {
        const num = parseInt(String(rec.reportNo).split('-')[1], 10);
        if (!isNaN(num) && num > max) max = num;
      }
    });
    return prefix + String(max + 1).padStart(3, '0');
  }

  // Camera Watermark Processing
  function optimizeCameraImage(file, watermark = {}, maxDim = 1280, quality = 0.78) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('Invalid image file'));
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Failed to read image'));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Failed to decode image'));
        img.onload = () => {
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          const pad = Math.max(12, Math.round(w * 0.018));
          const fontSize = Math.max(13, Math.round(w * 0.021));
          const lineHeight = Math.round(fontSize * 1.42);
          const barHeight = lineHeight * 2 + pad * 1.5;
          const barY = h - barHeight;

          const grad = ctx.createLinearGradient(0, barY - pad, 0, h);
          grad.addColorStop(0, 'rgba(15, 23, 42, 0.58)');
          grad.addColorStop(1, 'rgba(15, 23, 42, 0.90)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, barY, w, barHeight);

          ctx.fillStyle = watermark.accentColor || '#2563eb';
          ctx.fillRect(0, barY, Math.max(4, Math.round(w * 0.006)), barHeight);

          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.85)';
          ctx.shadowBlur = 4;

          ctx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
          ctx.fillStyle = '#f8fafc';
          ctx.textAlign = 'left';
          const row1Y = barY + pad * 0.75 + lineHeight * 0.5;
          const row2Y = row1Y + lineHeight;
          ctx.fillText(`Date: ${watermark.date || ''}   |   Time: ${watermark.time || ''}`, pad * 1.35, row1Y);

          ctx.font = `600 ${fontSize}px ui-sans-serif, system-ui, -apple-system, sans-serif`;
          ctx.fillStyle = '#e2e8f0';
          let locDisplay = `Location: ${watermark.location || 'Not Specified'}`;
          const maxLocW = w - pad * 3.5;
          while (ctx.measureText(locDisplay).width > maxLocW && locDisplay.length > 14) {
            locDisplay = locDisplay.slice(0, -4) + '...';
          }
          ctx.fillText(locDisplay, pad * 1.35, row2Y);

          if (watermark.tag) {
            ctx.font = `800 ${Math.max(11, Math.round(fontSize * 0.82))}px ui-sans-serif, system-ui, sans-serif`;
            ctx.fillStyle = watermark.accentColor || '#2563eb';
            ctx.textAlign = 'right';
            ctx.fillText(String(watermark.tag).toUpperCase(), w - pad, row1Y);
          }

          ctx.shadowBlur = 0;
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // CORS-safe Google Drive image proxy for JPEG export
  const DRIVE_IMG_CACHE = {};
  function extractDriveFileId(url) {
    if (!url || typeof url !== 'string') return '';
    const m1 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m1) return m1[1];
    const m2 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    return m2 ? m2[1] : '';
  }

  function fetchDriveImageAsDataUrl(url) {
    return new Promise((resolve) => {
      if (!url) return resolve('');
      if (String(url).startsWith('data:image/')) return resolve(url);
      const fileId = extractDriveFileId(url);
      if (!fileId || !navigator.onLine) return resolve('');
      if (DRIVE_IMG_CACHE[fileId]) return resolve(DRIVE_IMG_CACHE[fileId]);

      const cbName = 'ppmImgCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const script = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); resolve(''); }, 15000);
      function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function (res) {
        cleanup();
        if (res && res.ok && res.dataUrl) {
          DRIVE_IMG_CACHE[fileId] = res.dataUrl;
          resolve(res.dataUrl);
        } else resolve('');
      };
      script.onerror = () => { cleanup(); resolve(''); };
      script.src = `${WEB_APP_URL}?action=image&id=${encodeURIComponent(fileId)}&callback=${cbName}&t=${Date.now()}`;
      document.body.appendChild(script);
    });
  }

  function bindJPEGExport(btnId, targetId, fileName) {
    const btn = ROOT.querySelector(`#${btnId}`);
    const target = ROOT.querySelector(`#${targetId}`);
    if (!btn || !target) return;
    btn.addEventListener('click', async () => {
      if (typeof window.html2canvas === 'undefined') {
        showModal('Export Unavailable', 'Image export library is still loading or unavailable offline.');
        return;
      }

        hideEls.forEach(el => { el.style.visibility = ''; });
        const link = document.createElement('a');
        link.download = `${fileName}_${new Date().toISOString().slice(0, 10)}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);

        link.click();
        document.body.removeChild(link);

  function setupDropdownMenu(wrapperEl, defaultText, onChange) {
    if (!wrapperEl) return;

      else if (checked.length <= 2) btn.textContent = checked.map(c => c.dataset.label || c.value).join(', ');
      else btn.textContent = `${checked.length} selected`;

    checkboxes.forEach(cb => cb.addEventListener('change', () => {

  // ==================== DASHBOARD TAB ====================
  function getFilteredDashboardRecords() {
    const f = state.filters;
    const startTs = f.start ? getTs(f.start) : 0;
    const endTs = f.end ? (getTs(f.end) + 86400000) : Infinity;
    const lineQ = (f.line || '').toLowerCase();
    const convQ = (f.conveyor || '').toLowerCase();

    return state.records.filter(r => !r.isDraft).filter(r => {
      const units = ensureUnits(r);
      const t = getTs(r.happeningDate);
      if ((f.start || f.end) && (!t || t < startTs || t >= endTs)) return false;
      if (f.insp.length && !units.some(u => f.insp.includes(u.inspectionMethod || ''))) return false;
      if (f.task.length && !units.some(u => parseMultiList(u.taskPerformed).some(tk => f.task.includes(tk)))) return false;
      if (f.status.length && !f.status.includes(getStatusKey(r))) return false;
      if (f.cat.length && !units.some(u => f.cat.some(c => u.cat2 && u.cat2[c]))) return false;
      if (lineQ) {
        const lineMatches = units.some(u => ((r.lineEquipment || '') + '-' + (u.equipNo || '')).toLowerCase().includes(lineQ));
        if (!lineMatches) return false;
      }
      if (convQ) {
        const convMatches = units.some(u => (u.conveyorItem || '').toLowerCase().includes(convQ));
        if (!convMatches) return false;
      }
      return true;
    });
  }

  function computeKPIs(recs) {
    const open = recs.filter(r => getStatusKey(r) !== 'done');
    const completed = recs.filter(r => getStatusKey(r) === 'done');
    const catCounts = {}, inspCounts = {};
    CATS2.forEach(c => { catCounts[c.label] = 0; });
    INSPECTION_METHODS.forEach(m => { inspCounts[m] = 0; });

    recs.forEach(r => {
      const units = ensureUnits(r);
      CATS2.forEach(c => {
        if (units.some(u => u.cat2 && u.cat2[c.key])) catCounts[c.label]++;
      });
      units.forEach(u => {
        const im = (u.inspectionMethod || '').trim();
        if (im) inspCounts[im] = (inspCounts[im] || 0) + 1;
      });
    });

    let topCat = null, topCatCount = 0;
    Object.entries(catCounts).forEach(([k, v]) => { if (v > topCatCount) { topCat = k; topCatCount = v; } });
    let topInsp = null, topInspCount = 0;
    Object.entries(inspCounts).forEach(([k, v]) => { if (v > topInspCount) { topInsp = k; topInspCount = v; } });

    return {
      total: recs.length,
      openCount: open.length,
      completedCount: completed.length,
      topInsp, topInspCount,
      topCat, topCatCount
    };
  }

  function renderDashboardCharts(container, recs) {
    if (typeof window.Chart === 'undefined') return;
    if (state.charts.cat) { state.charts.cat.destroy(); state.charts.cat = null; }
    if (state.charts.status) { state.charts.status.destroy(); state.charts.status = null; }

    const customBgPlugin = {
      id: 'customCanvasBackgroundColor',
      beforeDraw: (c, a, o) => {
        const ctx = c.ctx;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = o.color || '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.restore();
      }
    };

    const catCountsArr = CATS2.map(c => ({
      name: c.label,
      count: recs.filter(r => ensureUnits(r).some(u => u.cat2 && u.cat2[c.key])).length
    })).sort((a, b) => b.count - a.count);

    const catCanvas = container.querySelector('#chart-cat');
    if (catCanvas) {
      state.charts.cat = new window.Chart(catCanvas, {
        type: 'bar',
        plugins: [customBgPlugin],
        data: {
          labels: catCountsArr.map(x => x.name),
          datasets: [{
            label: 'Records',
            data: catCountsArr.map(x => x.count),
            backgroundColor: catCountsArr.map(() => 'rgba(37, 99, 235, 0.45)'),
            borderColor: catCountsArr.map(() => 'rgba(37, 99, 235, 1)'),
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(17, 24, 39, 0.95)',
              titleFont: { size: 13, weight: 'bold' },
              bodyFont: { size: 12 },
              padding: 10,
              cornerRadius: 8
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: { display: true, text: 'Total Memo', font: { size: 12, weight: 'bold' } },
              ticks: { stepSize: 1, font: { size: 10 } }
            },
            x: {
              ticks: { font: { size: 10 }, maxRotation: 0, minRotation: 0, display: true }
            }
          }
        }
      });
    }

    const centerTextPlugin = {
      id: 'centerText',
      beforeDraw: (c) => {
        if (c.config.type !== 'doughnut') return;
        const w = c.width, h = c.height, ctx = c.ctx;
        ctx.restore();
        const meta = c.getDatasetMeta(0);
        const centerX = meta.data.length ? meta.data[0].x : w / 2;
        const centerY = meta.data.length ? meta.data[0].y : h / 2;
        ctx.font = 'bold ' + (h / 114).toFixed(2) + 'em sans-serif';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#1f2937';
        const tot = c.data.datasets[0].data.reduce((a, b) => a + b, 0);
        ctx.fillText(tot.toString(), centerX, centerY - 6);
        ctx.font = 'normal ' + ((h / 114).toFixed(2) * 0.35) + 'em sans-serif';
        ctx.fillText('Total Memo', centerX, centerY + 12);
        ctx.save();
      }
    };

    const sliceLabelsPlugin = {
      id: 'sliceLabels',
      afterDatasetsDraw: (c) => {
        if (c.config.type !== 'doughnut') return;
        const ctx = c.ctx, ds = c.data.datasets[0], tot = ds.data.reduce((a, b) => a + b, 0);
        if (!tot) return;
        c.getDatasetMeta(0).data.forEach((sec, i) => {
          if (!ds.data[i]) return;
          const pos = sec.tooltipPosition();
          ctx.fillStyle = '#374151';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(255,255,255,0.85)';
          ctx.shadowBlur = 4;
          ctx.fillText(Math.round((ds.data[i] / tot) * 100) + '%', pos.x, pos.y);
          ctx.shadowBlur = 0;
        });
      }
    };

    const stCompleted = recs.filter(r => getStatusKey(r) === 'done').length;
    const stProgress = recs.filter(r => getStatusKey(r) === 'progress').length;
    const stOpen = recs.filter(r => getStatusKey(r) === 'open').length;

    const statusCanvas = container.querySelector('#chart-status');
    if (statusCanvas) {
      state.charts.status = new window.Chart(statusCanvas, {
        type: 'doughnut',
        plugins: [customBgPlugin, centerTextPlugin, sliceLabelsPlugin],
        data: {
          labels: ['Completed', 'In Progress', 'Open'],
          datasets: [{
            data: [stCompleted, stProgress, stOpen],
            backgroundColor: ['rgba(5, 150, 105, 0.45)', 'rgba(217, 119, 6, 0.45)', 'rgba(156, 163, 175, 0.45)'],
            borderColor: ['rgba(5, 150, 105, 1)', 'rgba(217, 119, 6, 1)', 'rgba(156, 163, 175, 1)'],
            borderWidth: 1,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '45%',
          plugins: {
            legend: {
              position: 'right',
              labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, font: { size: 11 } }
            },
            tooltip: {
              backgroundColor: 'rgba(17, 24, 39, 0.95)',
              titleFont: { size: 13, weight: 'bold' },
              bodyFont: { size: 12 },
              padding: 10,
              cornerRadius: 8,
              callbacks: {
                label: (c) => ` ${c.label || ''}: ${c.raw || 0} memo${c.raw !== 1 ? 's' : ''} (${Math.round(((c.raw || 0) / (c.chart._metasets[c.datasetIndex].total || 1)) * 100)}%)`
              }
            }
          }
        }
      });
    }
  }

  function updateDashboardData(container) {
    const filtered = getFilteredDashboardRecords().sort((a, b) => b.createdAt - a.createdAt);
    const k = computeKPIs(filtered);
    const completionPct = k.total === 0 ? null : Math.round((k.completedCount / k.total) * 100);

    const kpiCards = [
      { l: 'Open Work Orders', v: k.openCount, c: 'var(--crit)', s: `${k.total} total filtered`, p: k.openCount > 0 ? `<span class="kpi-pill pill-crit">Needs attention</span>` : `<span class="kpi-pill pill-ok">All clear</span>` },
      { l: 'Inspection Method', v: k.topInsp || '—', c: 'var(--warn)', s: k.topInsp ? `${k.topInspCount} occurrence${k.topInspCount === 1 ? '' : 's'} logged` : 'No inspection data yet', p: k.topInsp ? `<span class="kpi-pill pill-warn">Most used</span>` : '' },
      { l: 'Top Fault Category', v: k.topCat || '—', c: 'var(--accent-2)', s: k.topCat ? `${k.topCatCount} occurrence${k.topCatCount === 1 ? '' : 's'} logged` : 'No category data yet', p: '' },
      { l: 'Total Completion', v: completionPct === null ? '—' : `${completionPct}%`, c: 'var(--accent)', s: `${k.completedCount} of ${k.total} job${k.total === 1 ? '' : 's'} done`, p: completionPct === 100 ? `<span class="kpi-pill pill-ok">Perfect</span>` : '' },
      { l: 'Total Units Logged', v: filtered.reduce((acc, r) => acc + ensureUnits(r).length, 0), c: 'var(--ok)', s: `Across ${k.total} submitted memo${k.total === 1 ? '' : 's'}`, p: '' }
    ];

    const gridEl = container.querySelector('#dash-kpi-grid');
    if (gridEl) {
      gridEl.innerHTML = kpiCards.map(c => `
        <div class="kpi-card">
          <div class="bar" style="background:${c.c}"></div>
          <div class="kpi-label">${c.l}</div>
          <div class="kpi-value">${escapeHtml(c.v)}</div>
          <div class="kpi-sub">${escapeHtml(c.s)}</div>
          ${c.p}
        </div>`).join('');
    }

    // Recent 10 pagination slice on Report No. records
    const visibleRecs = filtered.slice(0, state.visibleLimit);
    const remainingCount = Math.max(0, filtered.length - visibleRecs.length);

    const rowsHtml = visibleRecs.map(r => {
      const units = ensureUnits(r);
      const uLen = units.length;
      const isMulti = uLen > 1;
      const stKey = getStatusKey(r);
      const stLabel = getStatus(r);
      const syncTag = r.syncPending ? `<span class="chip-sync">Pending Sync</span>` : '';

      let statusHtml = '';
      if (stKey === 'progress') {
        const pendingItems = getPendingItems(r);
        const listHtml = pendingItems.length
          ? pendingItems.map(p => `<li>${escapeHtml(p)}</li>`).join('')
          : '<li>Pending final verification</li>';
        statusHtml = `
          <span class="status-tip-wrap" tabindex="0">
            <span class="status-chip chip-progress">In Progress <span style="font-size:.6rem;opacity:.8">ⓘ</span></span>
            <div class="status-tip-box">
              <div class="status-tip-title">Pending Items</div>
              <ul class="status-tip-list">${listHtml}</ul>
            </div>
          </span>${syncTag}`;
      } else {
        statusHtml = `<span class="status-chip ${stKey === 'done' ? 'chip-done' : 'chip-open'}">${escapeHtml(stLabel)}</span>${syncTag}`;
      }

      return units.map((u, uIdx) => {
        const rowCls = isMulti ? (uIdx === 0 ? 'grp-multi-first' : 'grp-multi-sub') : '';
        const unitTypes = CATS2.filter(c => u.cat2 && u.cat2[c.key]).map(c => c.label).join(', ');
        const unitTasks = parseMultiList(u.taskPerformed).join(', ');
        const noText = `<span class="mono-font b" style="color:var(--ink)">${escapeHtml(u.equipNo) || '—'}</span>`;

        if (uIdx === 0) {
          const rs = uLen > 1 ? ` rowspan="${uLen}"` : '';
          const multiBadge = isMulti ? `<div style="font-size:.62rem;color:#2563eb;font-weight:700;margin-top:2px">${uLen} units</div>` : '';
          return `<tr class="${rowCls}">
            <td${rs} class="${isMulti ? 'grp-accent' : ''}">
              <button type="button" class="link-btn mono-font" data-act="open" data-id="${r.createdAt}" style="text-decoration:underline;padding:0;text-align:left">${escapeHtml(r.reportNo || '—')}</button>
              ${multiBadge}
            </td>
            <td${rs} class="mono-font">${escapeHtml(fmtDate(r))}</td>
            <td${rs}>${escapeHtml(r.title) || '<span style="color:var(--line-dark)">Untitled</span>'}</td>
            <td${rs} class="b">${escapeHtml(r.lineEquipment) || '—'}</td>
            <td>${noText}</td>
            <td>${escapeHtml(u.conveyorItem) || '—'}</td>
            <td>${escapeHtml(unitTypes) || '—'}</td>
            <td>${escapeHtml(u.inspectionMethod) || '—'}</td>
            <td>${escapeHtml(unitTasks) || '—'}</td>
            <td${rs}>${statusHtml}</td>
          </tr>`;
        }
        return `<tr class="${rowCls}">
          <td>${noText}</td>
          <td>${escapeHtml(u.conveyorItem) || '—'}</td>
          <td>${escapeHtml(unitTypes) || '—'}</td>
          <td>${escapeHtml(u.inspectionMethod) || '—'}</td>
          <td>${escapeHtml(unitTasks) || '—'}</td>
        </tr>`;
      }).join('');
    }).join('');

    const pagerHtml = filtered.length > 0 ? `
      <div class="table-pager">
        <div class="table-pager-info">Showing <b>${visibleRecs.length}</b> of <b>${filtered.length}</b> Report No. record${filtered.length === 1 ? '' : 's'}</div>
        <div class="table-pager-actions">
          ${remainingCount > 0 ? `<button type="button" class="btn btn-primary" id="btn-load-more-10" style="padding:6px 12px;font-size:.75rem">Show Next ${Math.min(10, remainingCount)} Records</button>` : ''}
          ${remainingCount > 10 ? `<button type="button" class="btn btn-ghost" id="btn-show-all-recs" style="padding:6px 12px;font-size:.75rem">Show All (${filtered.length})</button>` : ''}
          ${state.visibleLimit > 10 && filtered.length > 10 ? `<button type="button" class="btn btn-ghost" id="btn-reset-recent-10" style="padding:6px 12px;font-size:.75rem">Show Recent 10</button>` : ''}
        </div>
      </div>` : '';

    const tContainer = container.querySelector('#dash-table-container');
    if (tContainer) {
      tContainer.innerHTML = filtered.length === 0
        ? `<div class="empty-state">No submitted PPM records found matching filters. Click <b>Memo Details</b> to create one.</div>`
        : `<table class="list"><thead><tr><th>Report No.</th><th>Date</th><th>Title</th><th>Line/Equipment</th><th>No.</th><th>Conveyor/Item</th><th>Type</th><th>Inspection Method</th><th>Task Performed</th><th>Status</th></tr></thead><tbody>${rowsHtml}</tbody></table>${pagerHtml}`;

      tContainer.querySelectorAll('[data-act="open"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeId = String(btn.dataset.id);
          state.activeUnitIdx = 0;
          state.tab = 'input';
          render();
        });
      });

      tContainer.querySelector('#btn-load-more-10')?.addEventListener('click', () => {
        state.visibleLimit += 10;
        updateDashboardData(container);
      });
      tContainer.querySelector('#btn-show-all-recs')?.addEventListener('click', () => {
        state.visibleLimit = filtered.length;
        updateDashboardData(container);
      });
      tContainer.querySelector('#btn-reset-recent-10')?.addEventListener('click', () => {
        state.visibleLimit = 10;
        updateDashboardData(container);
      });
    }

    renderDashboardCharts(container, filtered);
  }

  function renderDashboard(container) {

              <button type="button" class="dd-btn">All</button>

            </div>
          </label>
          <label class="f">Status
            <div class="dd-wrapper" id="dd-status-wrapper">
              <button type="button" class="dd-btn">All</button>
              <div class="dd-menu">
                <label class="chk"><input type="checkbox" value="open" data-label="Open" ${state.filters.status.includes('open') ? 'checked' : ''}/> <span>Open</span></label>
                <label class="chk"><input type="checkbox" value="progress" data-label="In Progress" ${state.filters.status.includes('progress') ? 'checked' : ''}/> <span>In Progress</span></label>
                <label class="chk"><input type="checkbox" value="done" data-label="Completed" ${state.filters.status.includes('done') ? 'checked' : ''}/> <span>Completed</span></label>
              </div>
            </div>
          </label>
          <label class="f">Category
            <div class="dd-wrapper" id="dd-cat-wrapper">
              <button type="button" class="dd-btn">All</button>
              <div class="dd-menu">${CATS2.map(c => `<label class="chk"><input type="checkbox" value="${c.key}" data-label="${escapeHtml(c.label)}" ${state.filters.cat.includes(c.key) ? 'checked' : ''}/> <span>${escapeHtml(c.label)}</span></label>`).join('')}</div>
            </div>
          </label>
          <label class="f">Line/Equipment - No.
            <input type="text" id="dash-line" list="dl-dash-lines" value="${escapeHtml(state.filters.line)}" placeholder="e.g. BM4-01" autocomplete="off"/>
            <datalist id="dl-dash-lines">${allLinesNos.map(x => `<option value="${escapeHtml(x)}"></option>`).join('')}</datalist>
          </label>
          <label class="f">Conveyor/Item
            <input type="text" id="dash-conveyor" list="dl-dash-conv" value="${escapeHtml(state.filters.conveyor)}" placeholder="e.g. TRANSFER CONVEYOR" autocomplete="off"/>
            <datalist id="dl-dash-conv">${allConveyors.map(x => `<option value="${escapeHtml(x)}"></option>`).join('')}</datalist>
          </label>
        </div>
      </div>

      <div class="kpi-grid" id="dash-kpi-grid"></div>

      <div class="charts-grid">
        <div class="panel" id="panel-chart-cat">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <h3 style="margin:0">Category</h3>
            <button type="button" class="export-chart-btn" id="btn-export-cat" title="Save Section as JPEG" style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;border:1px solid var(--line);font-size:.65rem;font-weight:700;color:var(--text-sec);cursor:pointer;background:var(--bg)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:14px;height:14px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>JPEG</button>
          </div>
          <div class="hint">Records count by category across filtered records</div>
          <div style="height:230px;position:relative;width:100%"><canvas id="chart-cat"></canvas></div>
        </div>
        <div class="panel" id="panel-chart-status">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <h3 style="margin:0">Status</h3>
            <button type="button" class="export-chart-btn" id="btn-export-status" title="Save Section as JPEG" style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;border:1px solid var(--line);font-size:.65rem;font-weight:700;color:var(--text-sec);cursor:pointer;background:var(--bg)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:14px;height:14px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>JPEG</button>

    const applyFilterChange = () => { state.visibleLimit = 10; updateDashboardData(container); };

    setupDropdownMenu(container.querySelector('#dd-task-wrapper'), 'All', vals => { state.filters.task = vals; applyFilterChange(); });
    setupDropdownMenu(container.querySelector('#dd-status-wrapper'), 'All', vals => { state.filters.status = vals; applyFilterChange(); });

    container.querySelector('#dash-start').addEventListener('change', e => { state.filters.start = e.target.value; applyFilterChange(); });
    container.querySelector('#dash-end').addEventListener('change', e => { state.filters.end = e.target.value; applyFilterChange(); });
    container.querySelector('#dash-line').addEventListener('input', e => { state.filters.line = e.target.value; applyFilterChange(); });
    container.querySelector('#dash-conveyor').addEventListener('input', e => { state.filters.conveyor = e.target.value; applyFilterChange(); });

    container.querySelector('#dash-reset-btn').addEventListener('click', () => {
      state.filters = { start: '', end: '', insp: [], task: [], status: [], cat: [], line: '', conveyor: '' };
      state.visibleLimit = 10;
      renderDashboard(container);
    });

    container.querySelector('#dash-export-btn').addEventListener('click', () => {
      const recs = getFilteredDashboardRecords().sort((a, b) => b.createdAt - a.createdAt);
      if (!recs.length) return showModal('Export Failed', 'No records to export based on current filters.', { errorMode: true });
      const csvRows = [['Report No.', 'Date', 'Title', 'Line/Equipment', 'No.', 'Conveyor/Item', 'Type', 'Inspection Method', 'Task Performed', 'Status']];
      recs.forEach(r => {
        const units = ensureUnits(r);
        const stLabel = getStatus(r);
        units.forEach(u => {
          const typeList = CATS2.filter(c => u.cat2 && u.cat2[c.key]).map(c => c.label);
          csvRows.push([
            r.reportNo || '', fmtDate(r), r.title || '', r.lineEquipment || '', u.equipNo || '', u.conveyorItem || '',
            typeList.join(', '), u.inspectionMethod || '', parseMultiList(u.taskPerformed).join(', '), stLabel
          ].map(v => `"${String(v).replace(/"/g, '""')}"`));
        });
      });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob(['\uFEFF' + csvRows.map(e => e.join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' }));
      link.download = 'PPM_Records.csv';

  async function openQuickAddRangeModal(r, container) {
    const line = (r.lineEquipment || '').trim().toUpperCase();
    const raw = await showModal(
      'Quick Add Conveyor Range',
      `Enter start and end numbers separated by a hyphen (e.g. 01-05) or comma-separated numbers (e.g. 01, 02, 03) for ${line || 'this line'}:`,
      { input: true, placeholder: '01-05', okText: 'Add Units' }
    );
    if (!raw || !raw.trim()) return;
    const units = ensureUnits(r);
    const existingNos = new Set(units.map(u => (u.equipNo || '').trim().toUpperCase()));
    let toAdd = [];

    const rangeMatch = raw.trim().match(/^(\d+)\s*[-–to]+\s*(\d+)$/i);
    if (rangeMatch) {
      const start = parseInt(rangeMatch[1], 10);
      const end = parseInt(rangeMatch[2], 10);
      const padLen = Math.max(rangeMatch[1].length, rangeMatch[2].length);
      if (!isNaN(start) && !isNaN(end) && end >= start && (end - start) <= 40) {
        for (let i = start; i <= end; i++) {
          toAdd.push(String(i).padStart(padLen, '0'));
        }
      }
    } else {
      toAdd = raw.split(',').map(s => s.trim()).filter(Boolean);
    }

    if (!toAdd.length) return;
    toAdd.forEach(no => {
      const upperNo = no.toUpperCase();
      if (existingNos.has(upperNo)) return;
      const desc = (line && EQUIP_DB[line] && EQUIP_DB[line][no]) ? EQUIP_DB[line][no] : '';
      if (units.length === 1 && !units[0].equipNo && !units[0].beforeImage && !units[0].reasonDetail) {
        units[0].equipNo = no;
        units[0].conveyorItem = desc;
      } else {
        units.push(blankUnit(no, desc));
      }
      existingNos.add(upperNo);
    });
    state.activeUnitIdx = units.length - 1;
    state.dirty = true;
    syncParentSummaryFromUnits(r);
    saveRecords();
    renderInput(container);
  }

    });

    container.querySelectorAll('[data-unit-field]').forEach(el => {
      const ev = (el.type === 'radio' || el.tagName === 'SELECT') ? 'change' : 'input';
      el.addEventListener(ev, () => {
        u[el.dataset.unitField] = el.value;
        state.dirty = true;
        syncParentSummaryFromUnits(r);
        saveRecords();
      });
    });

    container.querySelector('#acm-toggle-cleaning-btn')?.addEventListener('click', () => {
      if (u.cleaningImage) return openImageLightbox(`No. ${u.equipNo || state.activeUnitIdx + 1} — Cleaning`, u.cleaningImage);
      u.showCleaningBox = !u.showCleaningBox;
      saveRecords();
      renderInput(container);
    });
    container.querySelector('[data-cam-hide="cleaning"]')?.addEventListener('click', () => {
      if (!u.cleaningImage) { u.showCleaningBox = false; saveRecords(); renderInput(container); }
    });

    const slotTitles = { before: 'Before', after: 'After', cleaning: 'Cleaning' };
    const slotAccents = { before: '#f59e0b', after: '#10b981', cleaning: '#0284c7' };
    const getSlotImg = s => s === 'before' ? u.beforeImage : (s === 'cleaning' ? u.cleaningImage : u.afterImage);

    ['before', 'after', 'cleaning'].forEach(slot => {
      const fileInp = container.querySelector(`[data-cam-input="${slot}"]`);
      const triggerCam = () => { if (fileInp) { fileInp.value = ''; fileInp.click(); } };
      container.querySelector(`[data-cam-trigger="${slot}"]`)?.addEventListener('click', triggerCam);
      container.querySelector(`[data-ref-stage="${slot}"]`)?.addEventListener('click', () => {
        const src = getSlotImg(slot);
        if (src) openImageLightbox(`${r.lineEquipment || 'Unit'} ${u.equipNo || ''} — ${slotTitles[slot]}`, src);
        else triggerCam();
      });
      container.querySelector(`[data-cam-zoom="${slot}"]`)?.addEventListener('click', () => {
        const src = getSlotImg(slot);
        if (src) openImageLightbox(`${r.lineEquipment || 'Unit'} ${u.equipNo || ''} — ${slotTitles[slot]}`, src);
      });
      container.querySelector(`[data-cam-clear="${slot}"]`)?.addEventListener('click', () => {
        state.dirty = true;
        if (slot === 'before') { u.beforeImage = ''; u.beforeImageDate = ''; u.beforeImageTime = ''; }
        else if (slot === 'cleaning') { u.cleaningImage = ''; u.cleaningImageDate = ''; u.cleaningImageTime = ''; }
        else { u.afterImage = ''; u.afterImageDate = ''; u.afterImageTime = ''; }
        syncParentSummaryFromUnits(r);
        saveRecords();
        renderInput(container);
      });
      fileInp?.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const metaEl = container.querySelector(`[data-ref-meta="${slot}"]`);
        if (metaEl) metaEl.textContent = 'Processing watermark...';
        try {
          const now = new Date();
          const yyyy = now.getFullYear(), mm = String(now.getMonth() + 1).padStart(2, '0'), dd = String(now.getDate()).padStart(2, '0');
          const hNoPad = String(now.getHours()), hh = hNoPad.padStart(2, '0'), min = String(now.getMinutes()).padStart(2, '0'), ss = String(now.getSeconds()).padStart(2, '0');
          const isoDate = `${yyyy}-${mm}-${dd}`, formattedDate = `${dd}/${mm}/${yyyy}`, wmTime = `${hNoPad}:${min}:${ss}`, inputTime = `${hh}:${min}`;
          const locText = [r.lineEquipment, u.equipNo].filter(Boolean).join(' - ') || 'Not Specified';

          const dataUrl = await optimizeCameraImage(file, {
            date: formattedDate, time: wmTime, location: locText,
            tag: slotTitles[slot], accentColor: slotAccents[slot]
          });

          state.dirty = true;
          if (slot === 'before') {
            u.beforeImage = dataUrl; u.beforeImageDate = formattedDate; u.beforeImageTime = wmTime;
            if (!r.happeningDate) r.happeningDate = isoDate;
            if (!r.timeOfHappening) r.timeOfHappening = inputTime;
          } else if (slot === 'cleaning') {
            u.cleaningImage = dataUrl; u.cleaningImageDate = formattedDate; u.cleaningImageTime = wmTime; u.showCleaningBox = true;
          } else {
            u.afterImage = dataUrl; u.afterImageDate = formattedDate; u.afterImageTime = wmTime;
          }
          syncParentSummaryFromUnits(r);
          saveRecords();
          renderInput(container);
        } catch (err) {
          if (metaEl) metaEl.textContent = 'Camera Only';
          await showModal('Camera Error', 'Unable to process captured photo.', { errorMode: true });
        }
      });
    });

    container.querySelector('#acm-recpick').addEventListener('change', async (e) => {
      if (await wrapUnsaved()) {
        state.activeId = String(e.target.value);
        state.activeUnitIdx = 0;
        state.dirty = false;
        render();
      } else e.target.value = state.activeId;
    });

    container.querySelector('#acm-new-btn').addEventListener('click', async () => {
      if (await wrapUnsaved()) {
        const nr = blankRecord();
        nr.reportNo = getNextReportNo();
        state.records.unshift(nr);
        state.activeId = nr.createdAt;
        state.activeUnitIdx = 0;
        state.dirty = false;
        saveRecords();
        render();
      }
    });

    container.querySelector('#acm-del-btn').addEventListener('click', async () => {
      if (!await showModal('Confirm Deletion', 'Delete this record? This cannot be undone.', { confirm: true, danger: true, okText: 'Delete' })) return;
      const pass = await showModal('Authorization', 'Password required to delete this record:', { input: true, inputType: 'password', placeholder: 'Enter password...', okText: 'Confirm' });
      if (pass === 'KLIA123!') {
        if (!r.isDraft) {
          if (navigator.onLine) {
            postPayloadWithTimeout({ action: 'delete', createdAt: r.createdAt }, 10000).catch(async () => {
              state.deleteQueue.push({ createdAt: r.createdAt, deletedAt: Date.now() });
              await saveDeleteQueue();
            });
          } else {
            state.deleteQueue.push({ createdAt: r.createdAt, deletedAt: Date.now() });
            await saveDeleteQueue();
          }
        }
        state.records = state.records.filter(x => String(x.createdAt) !== String(r.createdAt));
        state.activeId = state.records.length ? state.records[0].createdAt : null;
        state.activeUnitIdx = 0;
        state.dirty = false;
        await saveRecords();
        render();
        await showModal('Deleted', 'Record removed successfully.');
      } else if (pass !== null) {
        await showModal('Error', 'Incorrect password. Deletion cancelled.', { errorMode: true });
      }
    });

    const handleView = async () => { if (await wrapUnsaved()) { state.tab = 'document'; render(); } };
    container.querySelector('#acm-view-btn').addEventListener('click', handleView);
    container.querySelector('#acm-view-btn-bottom').addEventListener('click', handleView);

    const handleSubmit = async () => {
      const errs = [];
      if (!checkReq(r.happeningDate) || !checkReq(r.timeOfHappening)) errs.push('[Notification & Work Order] Date & Time of Happening');
      if (!checkReq(r.issuedBy)) errs.push('[Notification & Work Order] Issued By');
      if (!checkReq(r.issuedGroup) || r.issuedGroup.trim().toUpperCase() === 'VENDOR') errs.push('[Notification & Work Order] Group');
      if (!checkReq(r.maintenanceType)) errs.push('[Notification & Work Order] Maintenance Type');
      if (!checkReq(r.title) || !checkReq(r.lineEquipment)) errs.push('[Title & Equipment] Title & Line/Equipment');
      units.forEach((item, idx) => {
        const tag = `Unit ${idx + 1}${item.equipNo ? ` (No. ${item.equipNo})` : ''}`;
        if (!checkReq(item.equipNo)) errs.push(`${tag}: Equipment No. is required`);
        if (!(item.cat2 && CATS2.some(c => item.cat2[c.key]))) errs.push(`${tag}: Select at least one Category`);
        if ((item.reasonDetail || '').trim().split(/\s+/).filter(Boolean).length < 2) errs.push(`${tag}: Enter at least 2 words in Remarks`);
      });

      if (errs.length) {
        await showModal('Submit Failed', 'Please complete the required fields:\n\n- ' + errs.join('\n- '), { errorMode: true });
        return;
      }

      syncParentSummaryFromUnits(r);
      r.status = getStatus(r);
      r.isDraft = false;
      r.syncPending = true;
      r.updatedAt = Date.now();
      state.dirty = false;
      state.cleanActiveRecord = JSON.parse(JSON.stringify(r));
      await saveRecords();

      if (!navigator.onLine) {
        await showModal('Saved Offline', 'No internet connection. Record & photos are safely stored locally and will auto-sync when online.');
        state.tab = 'document';
        render();
        return;
      }

      const btns = [container.querySelector('#acm-submit-btn'), container.querySelector('#acm-submit-btn-bottom')].filter(Boolean);
      btns.forEach(b => { b.textContent = 'Saving...'; b.disabled = true; });
      try {
        await postPayloadWithTimeout({ ...r, syncPending: false }, 25000);
        r.syncPending = false;
        await saveRecords();
        setTimeout(() => fetchCloudRecords(), 1200);
        await showModal('Success', 'Record and reference photos sent to Google Sheets & Drive!\nMoving to Memo View.');
        state.tab = 'document';
        render();
      } catch (err) {
        await showModal('Saved Offline', 'Unable to reach cloud right now. Your record is queued locally for automatic sync.');
        state.tab = 'document';
        render();
      }
    };
    container.querySelector('#acm-submit-btn').addEventListener('click', handleSubmit);
    container.querySelector('#acm-submit-btn-bottom').addEventListener('click', handleSubmit);
  }

  // ==================== MEMO VIEW TAB (A4 DOCUMENT) ====================
  function buildDocPhotoBox(unitIdx, slot, title, tagCls, imgSrc, imgDate, imgTime, emptyMsg, stageHeightPx = null) {
    const ts = [imgDate, imgTime].filter(Boolean).join(' ');

    return `<div class="ppm-photo-box">
      <div class="ppm-photo-head">
        <span class="ppm-photo-tag ${tagCls}">${title}</span>
        <span class="ppm-photo-ts">${escapeHtml(ts) || '—'}</span>
      </div>
      <div class="ppm-photo-stage" ${styleAttr}>
        ${imgSrc
          ? `<img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(title)} Reference Photo" data-doc-unit="${unitIdx}" data-doc-zoom="${slot}" title="Click to enlarge ${escapeHtml(title)} photo"/>`
          : `<div class="ppm-photo-empty">${escapeHtml(emptyMsg)}</div>`}
      </div>
    </div>`;
  }

    container.innerHTML = `

                  <span style="font-size:10px;font-weight:700;color:#475569">Status:</span>
                  <span class="status-chip ${stChipCls}">${escapeHtml(stLabel)}</span>
                  ${r.isDraft ? `<span class="status-chip chip-open" style="border:1px dashed #94a3b8">Draft (Unsubmitted)</span>` : ''}
                  ${!r.isDraft && r.syncPending ? `<span class="chip-sync">Pending Cloud Sync</span>` : ''}
                </div>
              </div>
              <div class="ppm-doc-ctrl">
                <table>
                  <tr><td class="ctrl-lbl">Report No.</td><td class="ctrl-val mono-font" style="color:#1e3a8a;font-size:11px">BHS/PPM ${escapeHtml(r.reportNo || '—')}</td></tr>
                  <tr><td class="ctrl-lbl">Notification No.</td><td class="ctrl-val mono-font">${escapeHtml(r.notificationNo) || '—'}</td></tr>
                  <tr><td class="ctrl-lbl">Work Order No.</td><td class="ctrl-val mono-font">${escapeHtml(r.workOrderNo) || '—'}</td></tr>
                  <tr><td class="ctrl-lbl">Maintenance Type</td><td class="ctrl-val">${escapeHtml(r.maintenanceType) || '—'}</td></tr>
                </table>
              </div>
            </div>

            ${bodySectionsHtml}

            <div class="ppm-sec" style="margin-bottom:4px">
              <div class="ppm-sec-bar"><span><span class="sec-num">${signSecNum}</span>Sign-off &amp; Verification</span></div>
              <div class="ppm-sign-grid">
                <div class="ppm-sign-cell">
                  <div class="ppm-sign-name">${escapeHtml(r.doneByName) || '&nbsp;'}</div>
                  <div class="ppm-sign-line">Done By ( TECH )</div>
                </div>
                <div class="ppm-sign-cell">
                  <div class="ppm-sign-name">${escapeHtml(r.checkByName) || '&nbsp;'}</div>
                  <div class="ppm-sign-line">Check By ( TO )</div>
                </div>
                <div class="ppm-sign-cell">
                  <div class="ppm-sign-name">${escapeHtml(r.confirmedByName) || '&nbsp;'}</div>
                  <div class="ppm-sign-line">Confirmed By ( TE / E / SE )</div>
                </div>
              </div>
            </div>
          </div>

          <div class="ppm-doc-foot">
            <span>**Please ensure all required fields, operating parameters, and watermarked reference photos are verified.</span>
            <span class="doc-footer-code mono-font">BHS/MP03/PPM/Rev.01</span>
          </div>
        </div>
      </div>
    `;

    container.querySelectorAll('[data-doc-zoom]').forEach(imgEl => {
      imgEl.addEventListener('click', () => {
        const uIdx = parseInt(imgEl.dataset.docUnit, 10) || 0;
        const slot = imgEl.dataset.docZoom;
        const unit = units[uIdx] || units[0];
        const labelMap = { before: 'Before', after: 'After', cleaning: 'Cleaning' };
        const src = slot === 'before' ? unit.beforeImage : (slot === 'cleaning' ? unit.cleaningImage : unit.afterImage);
        openImageLightbox(`${r.lineEquipment ? r.lineEquipment + ' - ' : ''}${unit.equipNo || (uIdx + 1)} — ${labelMap[slot] || ''}`, src);
      });
    });

    container.querySelector('#acm-doc-recpick').addEventListener('change', (e) => {
      state.activeId = String(e.target.value);
      state.activeUnitIdx = 0;
      render();
    });
    container.querySelector('#acm-edit-btn').addEventListener('click', () => { state.tab = 'input'; render(); });
    container.querySelector('#acm-print-btn').addEventListener('click', () => window.print());

    container.querySelector('#acm-doc-jpeg-btn').addEventListener('click', async () => {
      if (typeof window.html2canvas === 'undefined') {
        showModal('Notice', 'Export library is still loading. Please try again in a moment.');
        return;
      }
      const pageEl = container.querySelector('#acm-doc-page');
      const jpegBtn = container.querySelector('#acm-doc-jpeg-btn');
      const origTxt = jpegBtn.textContent;
      jpegBtn.textContent = 'Preparing photos...';
      jpegBtn.disabled = true;

      const imgEls = Array.from(pageEl.querySelectorAll('.ppm-photo-stage img'));
      const originalSrcs = imgEls.map(img => img.getAttribute('src') || '');
      try {
        await Promise.all(imgEls.map(async (imgEl, idx) => {
          const src = originalSrcs[idx];
          if (!src || src.startsWith('data:image/')) return;
          const dataUrl = await fetchDriveImageAsDataUrl(src);
          if (dataUrl) imgEl.setAttribute('src', dataUrl);
        }));
        jpegBtn.textContent = 'Exporting...';
        const canvas = await window.html2canvas(pageEl, { scale: 2, useCORS: true, allowTaint: false, backgroundColor: '#ffffff' });
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = `BHS_PPM_${(r.reportNo || 'Draft').replace(/[^a-zA-Z0-9_-]/g, '_')}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        showModal('Export Notice', 'Unable to export JPEG with cloud-hosted photos. Please use "Print / Save as PDF".', { errorMode: true });
      } finally {
        imgEls.forEach((imgEl, idx) => {
          if (originalSrcs[idx] && imgEl.getAttribute('src') !== originalSrcs[idx]) imgEl.setAttribute('src', originalSrcs[idx]);
        });
        jpegBtn.textContent = origTxt;
        jpegBtn.disabled = false;
      }
    });
  }

  // ==================== MAIN SHELL RENDER ====================
  function render() {
    ROOT.innerHTML = `
      <div class="wrap">
        <div class="topbar">
          <div class="brand">
            <div class="k">KLIA - Baggage Handling System T1</div>
            <div class="t">BHS Maintenance : Planned Preventative Maintenance (PPM)</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div id="ppm-net-status" class="net-status-wrap"></div>
            <div class="tabs">
              <button type="button" class="tab-btn ${state.tab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">Dashboard</button>
              <button type="button" class="tab-btn ${state.tab === 'input' ? 'active' : ''}" data-tab="input">Memo Details</button>
              <button type="button" class="tab-btn ${state.tab === 'document' ? 'active' : ''}" data-tab="document">Memo View</button>
            </div>
          </div>
        </div>
        <div id="acm-content"></div>
      </div>`;

    updateNetworkBadge();

    ROOT.querySelectorAll('.tab-btn').forEach(b => {
      b.addEventListener('click', async () => {
        const targetTab = b.dataset.tab;
        if (state.tab === 'input' && targetTab !== 'input' && state.dirty) {
          const discard = await showModal('Unsaved Changes', 'You have unsaved changes. Click "Discard Data" to abandon them, or "Keep Editing" to stay.', { confirm: true, danger: true, okText: 'Discard Data', cancelText: 'Keep Editing' });
          if (!discard) return;
          revertActiveRecord();
        }
        state.tab = targetTab;
        render();
      });
    });

    const content = ROOT.querySelector('#acm-content');
    if (!state.loaded) {
      content.innerHTML = `<div class="empty-state">Loading records…</div>`;
      return;
    }
    if (state.tab === 'dashboard') renderDashboard(content);
    else if (state.tab === 'input') renderInput(content);
    else renderDocument(content);
  }

  document.addEventListener('click', () => {
    ROOT.querySelectorAll('.dd-menu.open').forEach(m => m.classList.remove('open'));
  });
  window.addEventListener('online', () => { state.isOnline = true; updateNetworkBadge(); syncOfflineQueue(false); });
  window.addEventListener('offline', () => { state.isOnline = false; updateNetworkBadge(); });

  render();
  loadRecords();
})();
</script>
</body>
</html>
