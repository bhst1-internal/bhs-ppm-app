              <div class="unit-bar-actions">
                <button type="button" class="btn btn-primary btn-sm" id="ppm-add-unit-btn">✚ Add No.</button>
                <button type="button" class="btn btn-ghost btn-sm" id="ppm-range-unit-btn">⚡ Quick Add Range</button>
                ${state.activeUnitIdx > 0 ? `<button type="button" class="btn btn-ghost btn-sm" id="ppm-copy-prev-btn">📋 Copy from Prev</button>` : ''}
              </div>
            </div>
            <div class="unit-pills">${unitPillsHtml}</div>
            <div class="grid g2">
              <label class="f">No. (Active Unit)<input type="text" data-unit-field="equipNo" id="ppm-unit-no-input" value="${esc(u.equipNo)}" list="dl-equip-no" autocomplete="off" placeholder="e.g. 01"/><datalist id="dl-equip-no">${noOptions.map(n => `<option value="${esc(n)}">${esc(n)} — ${esc(lineEquipMap[n] || '')}</option>`).join('')}${currentLine ? '<option value="OTHERS">OTHERS</option>' : ''}</datalist></label>
              <label class="f">Conveyor/Item<input type="text" data-unit-field="conveyorItem" id="ppm-unit-conv-input" value="${esc(u.conveyorItem)}" placeholder="Auto-filled from DB or enter item"/></label>
            </div>
          </div>
        </div>

        <div class="active-unit-banner" id="ppm-active-unit-banner">
          <span>Editing Unit ${state.activeUnitIdx + 1} of ${r.units.length}: <b>${esc([r.lineEquipment, u.equipNo].filter(Boolean).join(' - ') || 'Unspecified')}</b>${u.conveyorItem ? ' — ' + esc(u.conveyorItem) : ''}</span>
          <span style="font-weight:600;color:#475569">Category, Reference Image, Remarks &amp; Result apply to this No.</span>
        </div>

        <div class="sec" id="sec-category">
          <div class="sec-title">Category</div>
          <div class="check-row">
            ${Object.entries(CATS2).map(([k, l]) => `<label class="chk"><input type="checkbox" data-unit-cat="${k}" ${(u.cat2 && u.cat2[k]) ? 'checked' : ''}/> ${l}</label>`).join('')}
          </div>
        </div>

        <div class="sec" id="sec-ref-images">
          <div class="ref-sec-header">
            <div class="sec-title">Reference Image</div>
            <button type="button" class="ref-cleaning-toggle-btn ${cleaningVisible ? 'active' : ''}" id="ppm-toggle-cleaning-btn">${cleaningVisible ? '✓ Cleaning Photo Box Shown' : '✚ Add Cleaning Photo (Optional)'}</button>
          </div>
          <div class="ref-img-grid">
            ${renderRefImageCard('before', 'Before', 'badge-before', u.beforeImage, u.beforeImageDate, u.beforeImageTime)}
            ${renderRefImageCard('after', 'After', 'badge-after', u.afterImage, u.afterImageDate, u.afterImageTime)}
            ${cleaningVisible ? renderRefImageCard('cleaning', 'Cleaning', 'badge-cleaning', u.cleaningImage, u.cleaningImageDate, u.cleaningImageTime, !u.cleaningImage) : ''}
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">Remarks</div>
          <div class="grid g2" style="margin-bottom:10px">
            ${makeSelect('Inspection Method', 'data-unit-field="inspectionMethod"', u.inspectionMethod, INSPECTION_METHODS)}
            <label class="f">Task Performed (Multiple Selection)
              <div class="dd-wrapper" id="dd-task-input-wrap">
                <button type="button" class="dd-btn" id="dd-task-input-btn"><span>${esc(taskBtnLabel)}</span></button>
                <div class="dd-menu">

                </div>
              </div>

          </div>
          <label class="f">Describe the details<textarea data-unit-field="reasonDetail">${esc(u.reasonDetail)}</textarea></label>
        </div>

        <div class="sec">
          <div class="sec-title">Result</div>
          <div class="radio-row">
            ${Object.entries(RESULT_CAT).map(([k, l]) => `<label class="rad"><input type="radio" name="unitResultCat" data-unit-field="resultCat" value="${k}" ${u.resultCat === k ? 'checked' : ''}/> ${l}</label>`).join('')}
          </div>
          <div class="grid g4" style="margin-top:10px">
            <label class="f">Speed (m/min)<input type="text" data-unit-field="paramSpeed" value="${esc(u.paramSpeed)}"/></label>
            <label class="f">Temp (°C)<input type="text" data-unit-field="paramTemp" value="${esc(u.paramTemp)}"/></label>
            <label class="f">Current (A)<input type="text" data-unit-field="paramCurrent" value="${esc(u.paramCurrent)}"/></label>
            <label class="f">Voltage (V)<input type="text" data-unit-field="paramVoltage" value="${esc(u.paramVoltage)}"/></label>
          </div>
          <div style="margin-top:10px">
            <label class="f">Detail / Status<textarea data-unit-field="resultDetail">${esc(u.resultDetail)}</textarea></label>
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">Sign-off</div>
          <div class="grid g3">
            <label class="f">Done By (TECH) — Multiple Selection
              <div class="dd-wrapper" id="dd-doneby-wrap">
                <button type="button" class="dd-btn" id="dd-doneby-btn"><span>${esc(doneByBtnLabel)}</span></button>
                <div class="dd-menu">
                  <input type="text" class="dd-search" id="dd-doneby-search" placeholder="Search technician..."/>
                  <div id="dd-doneby-list" style="display:flex;flex-direction:column;gap:5px">
                    ${TECH_NAMES.map(name => `<label class="chk" data-tech-item="${esc(name.toLowerCase())}"><input type="checkbox" name="doneby-chk" value="${esc(name)}" ${selectedDoneBy.includes(name) ? 'checked' : ''}/> <span>${esc(name)}</span></label>`).join('')}
                  </div>
                </div>
              </div>
              <div class="dd-selected-tags" id="doneby-selected-summary">${selectedDoneBy.length ? 'Selected: ' + esc(selectedDoneBy.join(', ')) : 'No technician selected'}</div>
            </label>
            ${makeSelect('Check By (TO)', 'data-field="checkByName"', r.checkByName, TO_NAMES)}
            ${makeSelect('Confirmed By (TE/E/SE)', 'data-field="confirmedByName"', r.confirmedByName, CONF_NAMES)}
          </div>
        </div>

        <div class="form-toolbar" style="justify-content:flex-end;margin-top:14px;margin-bottom:0">
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="ppm-submit-btn-bottom" style="background:var(--ok)">Submit ✔</button>
            <button type="button" class="btn btn-primary" id="ppm-view-btn-bottom">View Memo ➜</button>
          </div>
        </div>
      </div>
    `;

    refreshToolbarStatus(container, r);
    updateInputHighlights(container, r, u);

    // Report No. Picker
    container.querySelector('#ppm-recpick').addEventListener('change', async (e) => {
      const nextId = String(e.target.value);
      if (await wrapUnsaved()) {
        state.showErrors = false;
        state.activeId = nextId;
        state.activeUnitIdx = 0;
        state.isDirty = false;
        render();
      } else {
        e.target.value = state.activeId;
      }
    });

    // Add New Memo
    container.querySelector('#ppm-new-btn').addEventListener('click', async () => {
      if (await wrapUnsaved()) {
        if (!navigator.onLine) await notifyOfflineEntry(true);
        const nr = blankRecord();
        nr.reportNo = getNextReportNo();
        state.records.unshift(nr);
        state.activeId = nr.createdAt;
        state.activeUnitIdx = 0;
        state.showErrors = false;
        state.isDirty = false;
        saveRecords();
        render();
      }
    });

    // Delete Memo
    container.querySelector('#ppm-del-btn').addEventListener('click', async () => {
      if (!await showModal("Confirm Deletion", "Delete this record? This cannot be undone.", "confirm")) return;
      const pass = await showModal("Authorization", "Password required to delete this record:", "prompt");
      if (pass === 'KLIA123!') {
        if (!r.isDraft) {
          if (navigator.onLine) {
            postPayloadWithTimeout({ action: 'delete', createdAt: r.createdAt }, 10000).catch(async () => {
              state.deleteQueue.push({ createdAt: r.createdAt, deletedAt: Date.now() });
              await saveDeleteQueue();
            });
          } else {
            state.deleteQueue.push({ createdAt: r.createdAt, deletedAt: Date.now() });
            await saveDeleteQueue();
          }
        }
        state.records = state.records.filter(x => String(x.createdAt) !== String(r.createdAt));
        state.activeId = state.records.length ? state.records[0].createdAt : null;
        state.activeUnitIdx = 0;
        state.showErrors = false;
        state.isDirty = false;
        await saveRecords();
        render();
        await showModal("Deleted", navigator.onLine ? "Record removed successfully." : "Record removed locally. Cloud deletion queued.", "alert");
      } else if (pass !== null) {
        await showModal("Error", "Incorrect password. Deletion cancelled.", { errorMode: true });
      }
    });

    // View Memo
    const goViewMemo = async () => { if (await wrapUnsaved()) { state.tab = 'document'; render(); } };
    container.querySelector('#ppm-view-btn').addEventListener('click', goViewMemo);
    container.querySelector('#ppm-view-btn-bottom').addEventListener('click', goViewMemo);

    // Parent Field Listeners (including Confirmed By 6-digit PIN)
    container.querySelectorAll('[data-field]').forEach(el => {
      const evType = el.tagName === 'SELECT' ? 'change' : 'input';
      el.addEventListener(evType, async () => {
        const key = el.getAttribute('data-field');
        const newVal = el.value;
        if (key === 'confirmedByName' && newVal !== '') {
          const pwd = await showModal("Authorization", `Enter 6-digit pin for ${newVal}:`, "prompt");
          if (pwd !== CONF_PASS[newVal]) {
            await showModal("Error", "Incorrect pin. Signature reversed.", { errorMode: true });
            el.value = r.confirmedByName || '';
            return;
          }
        }
        state.isDirty = true;
        r[key] = newVal;
        if (key === 'lineEquipment') {
          const dl = container.querySelector('#dl-equip-no');
          const map = (newVal && EQUIP_DB[newVal]) ? EQUIP_DB[newVal] : null;
          if (dl) {
            const opts = map ? Object.keys(map).sort().map(n => `<option value="${esc(n)}">${esc(n)} — ${esc(map[n] || '')}</option>`).join('') : '';
            dl.innerHTML = opts + (newVal ? '<option value="OTHERS">OTHERS</option>' : '');
          }
          if (map && u.equipNo && map[u.equipNo]) {
            u.conveyorItem = map[u.equipNo];
            const convInp = container.querySelector('#ppm-unit-conv-input');
            if (convInp) convInp.value = u.conveyorItem;
          }
        }
        syncParentSummary(r);
        saveRecords();
        refreshToolbarStatus(container, r);
        updateInputHighlights(container, r, u);
      });
    });

    // Group Selector (Shift / OH / Vendor)
    container.querySelectorAll('[data-calc-group]').forEach(el => {
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
        state.isDirty = true;
        const wrp = el.closest('div');
        const bVal = wrp.querySelector('[data-part="base"]')?.value || '';
        const vVal = wrp.querySelector('[data-part="vendor"]')?.value || '';
        r.issuedGroup = bVal === 'Vendor' ? (vVal ? `Vendor: ${vVal}` : 'Vendor') : bVal;
        saveRecords();
        if (el.getAttribute('data-part') === 'base') renderInput(container);
        else updateInputHighlights(container, r, u);
      });
    });

    // Multi-Unit Controls: Add No., Quick Add Range, Copy from Prev, Switch/Remove Pill
    container.querySelector('#ppm-add-unit-btn').addEventListener('click', () => {
      state.isDirty = true;
      const nextNo = suggestNextEquipNo(r);
      const nextConv = (r.lineEquipment && nextNo && EQUIP_DB[r.lineEquipment] && EQUIP_DB[r.lineEquipment][nextNo]) ? EQUIP_DB[r.lineEquipment][nextNo] : '';
      r.units.push(blankUnit(nextNo, nextConv));
      state.activeUnitIdx = r.units.length - 1;
      syncParentSummary(r);
      saveRecords();
      renderInput(container);
      setTimeout(() => container.querySelector('#ppm-unit-no-input')?.focus(), 30);
    });

    container.querySelector('#ppm-range-unit-btn').addEventListener('click', async () => {
      const rangeStr = await showModal("Quick Add Equipment No. Range", "Enter a range (e.g. 01-05) or comma-separated numbers (e.g. 01, 02, 03):", "prompt");
      if (!rangeStr || !rangeStr.trim()) return;
      const toAdd = [];
      rangeStr.split(',').map(s => s.trim()).filter(Boolean).forEach(part => {
        const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
        if (m) {
          const padLen = m[1].length;
          const start = parseInt(m[1], 10), end = parseInt(m[2], 10);
          if (!isNaN(start) && !isNaN(end) && end >= start && (end - start) <= 40) {
            for (let n = start; n <= end; n++) toAdd.push(String(n).padStart(padLen, '0'));
          }
        } else {
          toAdd.push(part);
        }
      });
      if (toAdd.length === 0) return;
      state.isDirty = true;
      const existingSet = new Set(r.units.map(x => String(x.equipNo || '').trim()).filter(Boolean));
      toAdd.forEach(no => {
        if (existingSet.has(no)) return;
        const conv = (r.lineEquipment && EQUIP_DB[r.lineEquipment] && EQUIP_DB[r.lineEquipment][no]) ? EQUIP_DB[r.lineEquipment][no] : '';
        if (r.units.length === 1 && !r.units[0].equipNo && !r.units[0].beforeImage) {
          r.units[0].equipNo = no;
          r.units[0].conveyorItem = conv;
        } else {
          r.units.push(blankUnit(no, conv));
        }
        existingSet.add(no);
      });
      syncParentSummary(r);
      saveRecords();
      renderInput(container);
    });

    container.querySelector('#ppm-copy-prev-btn')?.addEventListener('click', () => {
      if (state.activeUnitIdx <= 0) return;
      const prev = r.units[state.activeUnitIdx - 1];
      state.isDirty = true;
      u.cat2 = { ...(prev.cat2 || {}) };
      u.inspectionMethod = prev.inspectionMethod || '';
      u.taskPerformed = prev.taskPerformed || '';
      u.reasonDetail = prev.reasonDetail || '';
      u.resultCat = prev.resultCat || '';
      u.paramSpeed = prev.paramSpeed || '';
      u.paramTemp = prev.paramTemp || '';
      u.paramCurrent = prev.paramCurrent || '';
      u.paramVoltage = prev.paramVoltage || '';
      u.resultDetail = prev.resultDetail || '';
      syncParentSummary(r);
      saveRecords();
      renderInput(container);
    });

    container.querySelectorAll('[data-unit-tab]').forEach(pill => {
      pill.addEventListener('click', (e) => {
        if (e.target.closest('[data-unit-rm]')) return;
        state.activeUnitIdx = Number(pill.getAttribute('data-unit-tab'));
        renderInput(container);
      });
    });

    container.querySelectorAll('[data-unit-rm]').forEach(rmBtn => {
      rmBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (r.units.length <= 1) return;
        const rmIdx = Number(rmBtn.getAttribute('data-unit-rm'));
        state.isDirty = true;
        r.units.splice(rmIdx, 1);
        if (state.activeUnitIdx >= r.units.length) state.activeUnitIdx = r.units.length - 1;
        syncDateTimeFromFirstBefore(r);
        syncParentSummary(r);
        saveRecords();
        renderInput(container);
      });
    });

    // Active Unit Fields (in-place update without destroying DOM focus)
    container.querySelectorAll('[data-unit-field]').forEach(el => {
      const evType = (el.type === 'radio' || el.tagName === 'SELECT') ? 'change' : 'input';
      el.addEventListener(evType, () => {
        const key = el.getAttribute('data-unit-field');
        state.isDirty = true;
        u[key] = el.value;
        if (key === 'equipNo') {
          const map = (r.lineEquipment && EQUIP_DB[r.lineEquipment]) ? EQUIP_DB[r.lineEquipment] : null;
          if (el.value === 'OTHERS') u.conveyorItem = 'OTHERS';
          else if (map && map[el.value]) u.conveyorItem = map[el.value];
          const convInp = container.querySelector('#ppm-unit-conv-input');
          if (convInp && map && map[el.value]) convInp.value = u.conveyorItem;
          const activePill = container.querySelector(`[data-unit-tab="${state.activeUnitIdx}"] span`);
          if (activePill) activePill.textContent = `● ${u.equipNo ? 'No. ' + u.equipNo : 'Unit ' + (state.activeUnitIdx + 1)}`;
          const banner = container.querySelector('#ppm-active-unit-banner b');
          if (banner) banner.textContent = [r.lineEquipment, u.equipNo].filter(Boolean).join(' - ') || 'Unspecified';
        }
        syncParentSummary(r);
        saveRecords();
        refreshToolbarStatus(container, r);
        updateInputHighlights(container, r, u);
      });
    });

    // Unit Category checkboxes
    container.querySelectorAll('[data-unit-cat]').forEach(cb => {
      cb.addEventListener('change', () => {
        state.isDirty = true;
        if (!u.cat2) u.cat2 = {};
        u.cat2[cb.getAttribute('data-unit-cat')] = cb.checked;
        syncParentSummary(r);
        saveRecords();
        updateInputHighlights(container, r, u);
      });
    });

    // Multi-Select Task Performed Dropdown
    const taskWrap = container.querySelector('#dd-task-input-wrap');
    if (taskWrap) {
      const tBtn = taskWrap.querySelector('.dd-btn');
      const tMenu = taskWrap.querySelector('.dd-menu');
      tBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = tMenu.classList.contains('open');
        document.querySelectorAll('.dd-menu').forEach(m => m.classList.remove('open'));
        if (!isOpen) tMenu.classList.add('open');
      });
      tMenu.addEventListener('click', e => e.stopPropagation());
      tMenu.querySelectorAll('input[name="unit-task-chk"]').forEach(cb => {
        cb.addEventListener('change', () => {
          state.isDirty = true;
          const sel = Array.from(tMenu.querySelectorAll('input[name="unit-task-chk"]:checked')).map(c => c.value);
          u.taskPerformed = sel.join(', ');
          tBtn.querySelector('span').textContent = sel.length ? u.taskPerformed : 'Select task(s)...';
          syncParentSummary(r);
          saveRecords();
          refreshToolbarStatus(container, r);
          updateInputHighlights(container, r, u);
        });
      });
    }

    // Searchable Multi-Select Done By (TECH) Dropdown
    const doneWrap = container.querySelector('#dd-doneby-wrap');
    if (doneWrap) {
      const dBtn = doneWrap.querySelector('.dd-btn');
      const dMenu = doneWrap.querySelector('.dd-menu');
      const dSearch = doneWrap.querySelector('#dd-doneby-search');
      const dSummary = container.querySelector('#doneby-selected-summary');
      dBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = dMenu.classList.contains('open');
        document.querySelectorAll('.dd-menu').forEach(m => m.classList.remove('open'));
        if (!isOpen) { dMenu.classList.add('open'); setTimeout(() => dSearch?.focus(), 30); }
      });
      dMenu.addEventListener('click', e => e.stopPropagation());
      dSearch?.addEventListener('input', () => {
        const q = dSearch.value.trim().toLowerCase();
        dMenu.querySelectorAll('[data-tech-item]').forEach(lbl => {

    const getSlotImg = s => s === 'before' ? u.beforeImage : (s === 'cleaning' ? u.cleaningImage : u.afterImage);

    ['before', 'cleaning', 'after'].forEach(slot => {

      container.querySelector(`[data-cam-clear="${slot}"]`)?.addEventListener('click', () => {
        state.isDirty = true;
        if (slot === 'before') { u.beforeImage = ''; u.beforeImageDate = ''; u.beforeImageTime = ''; syncDateTimeFromFirstBefore(r); }
        else if (slot === 'cleaning') { u.cleaningImage = ''; u.cleaningImageDate = ''; u.cleaningImageTime = ''; }
        else { u.afterImage = ''; u.afterImageDate = ''; u.afterImageTime = ''; }
        syncParentSummary(r);
        saveRecords();
        renderInput(container);
      });
      fileInp?.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const metaEl = container.querySelector(`[data-ref-meta="${slot}"]`);
        if (metaEl) metaEl.textContent = 'Processing watermark...';
        try {
          const now = new Date();
          const yyyy = now.getFullYear(), mm = String(now.getMonth() + 1).padStart(2, '0'), dd = String(now.getDate()).padStart(2, '0');
          const hNoPad = String(now.getHours()), min = String(now.getMinutes()).padStart(2, '0'), ss = String(now.getSeconds()).padStart(2, '0');
          const formattedDate = `${dd}/${mm}/${yyyy}`, watermarkTime = `${hNoPad}:${min}:${ss}`;
          const locText = [r.lineEquipment, u.equipNo].filter(Boolean).join(' - ') || 'Not Specified';

          const dataUrl = await optimizeCameraImage(file, {
            date: formattedDate, time: watermarkTime, location: locText, tag: slotTitles[slot], accentColor: slotAccents[slot]
          });
          state.isDirty = true;

    // Submit Validation & Cloud Sync
    const handleSubmit = async () => {

      if (!checkReq(r.issuedBy)) errs.push("[Notification & Work Order] Issued By");
      const ig = r.issuedGroup || '';
      if (!ig || (ig.toUpperCase().startsWith('VENDOR') && ig.trim().toUpperCase() === 'VENDOR')) errs.push("[Notification & Work Order] Group");
      if (!checkReq(r.maintenanceType)) errs.push("[Notification & Work Order] Maintenance Type");
      if (!checkReq(r.title) || !checkReq(r.lineEquipment)) errs.push("[Title & Equipment] Title & Line/Equipment are required");

      r.units.forEach((unit, idx) => {
        const tag = unit.equipNo ? `No. ${unit.equipNo}` : `Unit ${idx + 1}`;
        if (!checkReq(unit.equipNo) || !checkReq(unit.conveyorItem)) errs.push(`[${tag}] No. and Conveyor/Item are required`);
        if (!Object.keys(CATS2).some(k => unit.cat2 && unit.cat2[k])) errs.push(`[${tag}] Select at least one Category`);
        if (!unit.beforeImage) errs.push(`[${tag}] Capture 'Before' reference image`);
        if (!checkReq(unit.inspectionMethod)) errs.push(`[${tag}] Select Inspection Method`);
        if (parseMultiList(unit.taskPerformed).length === 0) errs.push(`[${tag}] Select at least one Task Performed`);
        if ((unit.reasonDetail || '').trim().split(/\s+/).filter(Boolean).length < 2) errs.push(`[${tag}] Write at least 2 words in Remarks`);
      });

      updateInputHighlights(container, r, u);
      if (errs.length) {
        await showModal("Submit Failed", "Please complete the highlighted required data:\n\n- " + errs.join("\n- "), { errorMode: true });
        return;
      }

      r.status = getStatusLabel(getStatus(r));
      r.isDraft = false;
      r.syncPending = true;
      r.updatedAt = Date.now();
      state.showErrors = false;
      state.isDirty = false;
      state.cleanActiveRecord = JSON.parse(JSON.stringify(r));
      await saveRecords();

      if (!navigator.onLine) {
        state.isOnline = false; updateNetworkBadge();
        const html = `<div class="modal-offline-banner submit">💾 Record Saved Offline &amp; Queued</div><div>Your PPM submission (<b>BHS/PPM ${esc(r.reportNo)}</b>) is safely stored locally and will auto-sync when internet returns.</div>`;
        await showModal("Offline Submission Saved", html, "offline-submit");
        state.tab = 'document'; render(); return;
      }

      const submitBtns = [container.querySelector('#ppm-submit-btn'), container.querySelector('#ppm-submit-btn-bottom')].filter(Boolean);
      submitBtns.forEach(b => { b.textContent = 'Saving... ⏳'; b.disabled = true; });
      try {
        await postPayloadWithTimeout({ ...r, syncPending: false }, 25000);
        r.syncPending = false;
        await saveRecords();
        setTimeout(() => fetchCloudRecords(true), 1200);
        await showModal("Success", "Record and images sent to Google Sheets & Drive!\nMoving to Memo View.", "alert");
        state.tab = 'document';
        render();
      } catch (err) {
        await showModal("Saved Offline", "Could not reach Google Sheets right now. Your record is queued and will upload automatically once internet stabilizes.", "offline-submit");
        state.tab = 'document';
        render();
      }
    };

    container.querySelector('#ppm-submit-btn').addEventListener('click', handleSubmit);
    container.querySelector('#ppm-submit-btn-bottom').addEventListener('click', handleSubmit);

  // ==================== MEMO VIEW TAB ====================
  const DRIVE_IMG_CACHE = {};
  function extractDriveFileId(url) {
    if (!url || typeof url !== 'string') return '';
    const m1 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m1) return m1[1];
    const m2 = url.match(/\/d\/([a-zA-Z0-9_-]+)/); return m2 ? m2[1] : '';
  }

  function fetchDriveImageAsDataUrl(url) {
    return new Promise((resolve) => {
      if (!url) return resolve('');
      if (String(url).startsWith('data:image/')) return resolve(url);
      const fileId = extractDriveFileId(url);
      if (!fileId || !navigator.onLine) return resolve('');
      if (DRIVE_IMG_CACHE[fileId]) return resolve(DRIVE_IMG_CACHE[fileId]);
      const cbName = 'ppmImgCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const reqUrl = `${WEB_APP_URL}?action=image&id=${encodeURIComponent(fileId)}&callback=${cbName}&t=${Date.now()}`;
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => { if (controller) controller.abort(); }, 20000);

      fetch(reqUrl, {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        redirect: 'follow',
        cache: 'no-store',
        signal: controller ? controller.signal : undefined
      })
        .then(res => {
          clearTimeout(timer);
          if (!res.ok) throw new Error('HTTP_' + res.status);
          return res.text();
        })
        .then(text => {
          const res = parseCloudPayload(text, cbName);
          if (res && res.ok && res.dataUrl) { DRIVE_IMG_CACHE[fileId] = res.dataUrl; resolve(res.dataUrl); }
          else resolve('');
        })
        .catch(() => {
          clearTimeout(timer);
          const script = document.createElement('script');
          script.crossOrigin = 'anonymous';
          const fbTimer = setTimeout(() => { cleanup(); resolve(''); }, 15000);
          function cleanup() {
            clearTimeout(fbTimer);
            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
            if (script.parentNode) script.parentNode.removeChild(script);
          }
          window[cbName] = function (res) {
            cleanup();
            if (res && res.ok && res.dataUrl) { DRIVE_IMG_CACHE[fileId] = res.dataUrl; resolve(res.dataUrl); }
            else resolve('');
          };
          script.onerror = function () { cleanup(); resolve(''); };
          script.src = `${WEB_APP_URL}?action=image&id=${encodeURIComponent(fileId)}&callback=${cbName}&t=${Date.now()}_fb`;
          document.body.appendChild(script);
        });
    });
  }

            <div class="ppm-sign-cell"><div class="ppm-sign-name">${esc(r.doneByName) || '&nbsp;'}</div><div class="ppm-sign-line">Done By ( TECH )</div></div>
            <div class="ppm-sign-cell"><div class="ppm-sign-name">${esc(r.checkByName) || '&nbsp;'}</div><div class="ppm-sign-line">Check By ( TO )</div></div>
            <div class="ppm-sign-cell"><div class="ppm-sign-name">${esc(r.confirmedByName) || '&nbsp;'}</div><div class="ppm-sign-line">Confirmed By ( TE / E / SE )</div></div>
          </div>
        </div>`;
    }

    container.innerHTML = `
      <div class="doc-toolbar">
        <div class="rec-select">
          <span class="b">Viewing:</span>
          <select class="recpick" id="ppm-doc-recpick">${options}</select>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-ghost" id="ppm-edit-btn">← Edit this record</button>
          <button type="button" class="btn btn-ghost" id="ppm-doc-jpeg-btn">Save as JPEG</button>
          <button type="button" class="btn btn-primary" id="ppm-print-btn">Print / Save as PDF</button>
        </div>
      </div>
      <div class="doc-scroll" id="ppm-doc-scroll">
        <div class="doc-scale-wrap" id="ppm-doc-scale-wrap">
          <div class="doc-page" id="ppm-doc-page">
            <div>
              <div class="ppm-doc-top">
                <div class="ppm-doc-brand">
                  <div class="doc-header-title">K. L. International Airport</div>
                  <div class="doc-header-sub">- Baggage Handling &amp; Screening (Terminal 1) -</div>
                  <div class="doc-memo-title">BHS Maintenance : Planned Preventative Maintenance (PPM)</div>
                  <div class="ppm-doc-status-row">
                    <span style="font-size:10px;font-weight:700;color:#475569">Status:</span>
                    <span class="status-chip ${stChipCls}">${esc(getStatusLabel(st))}</span>
                    ${r.isDraft ? `<span class="status-chip chip-open" style="border:1px dashed #94a3b8">Draft (Unsubmitted)</span>` : ''}
                    ${!r.isDraft && r.syncPending ? `<span class="chip-sync">Pending Cloud Sync</span>` : ''}
                  </div>
                </div>
                <div class="ppm-doc-ctrl">
                  <table>
                    <tr><td class="ctrl-lbl">Report No.</td><td class="ctrl-val mono-font" style="color:#1e3a8a;font-size:10.5px">BHS/PPM ${esc(r.reportNo || '—')}</td></tr>
                    <tr><td class="ctrl-lbl">Notification No.</td><td class="ctrl-val mono-font">${esc(r.notificationNo) || '—'}</td></tr>
                    <tr><td class="ctrl-lbl">Work Order No.</td><td class="ctrl-val mono-font">${esc(r.workOrderNo) || '—'}</td></tr>
                    <tr><td class="ctrl-lbl">Maintenance Type</td><td class="ctrl-val">${esc(r.maintenanceType) || '—'}</td></tr>
                  </table>
                </div>
              </div>
              ${bodyHtml}
            </div>
            <div class="ppm-doc-foot">
              <span>**Please ensure all required fields, operating parameters, and watermarked reference photos are verified.</span>
              <span class="doc-footer-code mono-font">BHS/MP03/PPM/Rev.01</span>
            </div>
          </div>
        </div>
      </div>
    `;

    // Auto-scale A4 Memo View on narrow phone screens
    const scaleMemoView = () => {
      const scrollEl = container.querySelector('#ppm-doc-scroll');
      const wrapEl = container.querySelector('#ppm-doc-scale-wrap');
      const pageEl = container.querySelector('#ppm-doc-page');
      if (!scrollEl || !wrapEl || !pageEl) return;
      const availW = scrollEl.clientWidth - 16;
      if (availW > 0 && availW < 794) {
        const scale = Math.max(0.32, availW / 794);
        pageEl.style.transformOrigin = 'top left';
        pageEl.style.transform = `scale(${scale})`;
        wrapEl.style.width = `${Math.round(794 * scale)}px`;
        wrapEl.style.height = `${Math.ceil(pageEl.offsetHeight * scale)}px`;
      } else {
        pageEl.style.transform = '';
        pageEl.style.transformOrigin = '';
        wrapEl.style.width = '';
        wrapEl.style.height = '';
      }
    };
    window._ppmScaleMemoView = scaleMemoView;
    requestAnimationFrame(scaleMemoView);
    container.querySelectorAll('#ppm-doc-page img').forEach(imgEl => imgEl.addEventListener('load', scaleMemoView));

    container.querySelectorAll('[data-doc-slot]').forEach(imgEl => {
      imgEl.addEventListener('click', () => {
        const uIdx = Number(imgEl.getAttribute('data-doc-uidx'));
        const slot = imgEl.getAttribute('data-doc-slot');
        const unit = units[uIdx];
        if (!unit) return;
        const src = slot === 'before' ? unit.beforeImage : (slot === 'cleaning' ? unit.cleaningImage : unit.afterImage);
        openImageLightbox(`${r.lineEquipment || ''} ${unit.equipNo || ''} — ${slot.toUpperCase()}`, src);
      });
    });

    container.querySelector('#ppm-doc-recpick').addEventListener('change', (e) => {
      state.activeId = String(e.target.value);
      state.activeUnitIdx = 0;
      render();
    });
    container.querySelector('#ppm-edit-btn').addEventListener('click', () => { state.tab = 'input'; render(); });
    container.querySelector('#ppm-print-btn').addEventListener('click', () => window.print());

    container.querySelector('#ppm-doc-jpeg-btn').addEventListener('click', async () => {
      if (typeof window.html2canvas === 'undefined') {
        showModal("Notice", "Export library is still loading. Please try again in a moment.");
        return;
      }
      const pageEl = container.querySelector('#ppm-doc-page');
      const wrapEl = container.querySelector('#ppm-doc-scale-wrap');
      const jpegBtn = container.querySelector('#ppm-doc-jpeg-btn');
      const origTxt = jpegBtn.textContent;
      jpegBtn.textContent = 'Preparing photos...';
      jpegBtn.disabled = true;

      const imgEls = Array.from(pageEl.querySelectorAll('.ppm-photo-stage img'));
      const originalSrcs = imgEls.map(img => img.getAttribute('src') || '');
      try {
        await Promise.all(imgEls.map(async (imgEl, idx) => {
          const src = originalSrcs[idx];
          if (!src || src.startsWith('data:image/')) return;
          const dataUrl = await fetchDriveImageAsDataUrl(src);
          if (dataUrl) imgEl.setAttribute('src', dataUrl);
        }));
        jpegBtn.textContent = 'Exporting...';
        pageEl.style.transform = '';
        if (wrapEl) { wrapEl.style.width = ''; wrapEl.style.height = ''; }
        const canvas = await window.html2canvas(pageEl, { scale: 2, useCORS: true, allowTaint: false, backgroundColor: '#ffffff' });
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = `BHS_PPM_${(r.reportNo || 'Draft').replace(/[^a-zA-Z0-9_-]/g, '_')}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        showModal('Export Notice', 'Unable to export JPEG with cloud-hosted photos. Please use "Print / Save as PDF".', { errorMode: true });
      } finally {
        imgEls.forEach((imgEl, idx) => {
          if (originalSrcs[idx] && imgEl.getAttribute('src') !== originalSrcs[idx]) imgEl.setAttribute('src', originalSrcs[idx]);
        });
        scaleMemoView();
        jpegBtn.textContent = origTxt;
        jpegBtn.disabled = false;
      }
    });
  }

  // ==================== APP SHELL & GLOBAL LISTENERS ====================
  function render() {
    ROOT.innerHTML = `
      <div class="wrap">
        <div class="topbar">
          <div class="brand">
            <div class="k">KLIA - Baggage Handling System T1</div>
            <div class="t">BHS Maintenance : Planned Preventative Maintenance (PPM)</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div id="ppm-net-status" class="net-status-wrap"></div>
            <div class="tabs">
              <button type="button" class="tab-btn ${state.tab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">Dashboard</button>
              <button type="button" class="tab-btn ${state.tab === 'input' ? 'active' : ''}" data-tab="input">Memo Details</button>
              <button type="button" class="tab-btn ${state.tab === 'document' ? 'active' : ''}" data-tab="document">Memo View</button>
            </div>
          </div>
        </div>
        <div id="ppm-content"></div>
      </div>`;

    updateNetworkBadge();
    ROOT.querySelectorAll('.tab-btn').forEach(b => {
      b.addEventListener('click', async () => {
        const targetTab = b.getAttribute('data-tab');
        if (state.tab === 'input' && targetTab !== 'input' && !await wrapUnsaved()) return;
        state.tab = targetTab;
        render();
        if (targetTab === 'input' && !navigator.onLine) notifyOfflineEntry(false);
      });
    });

    const content = ROOT.querySelector('#ppm-content');
    if (!state.loaded) {
      content.innerHTML = `<div class="empty-state">Loading records…</div>`;
      return;
    }
    if (state.tab === 'dashboard') renderDashboard(content);
    else if (state.tab === 'input') renderInput(content);
    else renderDocument(content);
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.dd-menu').forEach(m => m.classList.remove('open'));
  });

  function runBackgroundRefresh() {
    if (!navigator.onLine || document.visibilityState === 'hidden') return;
    if (getPendingCount() > 0 && !state.isSyncing) {
      syncOfflineQueue(false, true);
    } else {
      fetchCloudRecords(true);
    }
  }

  window.addEventListener('online', () => {
    state.isOnline = true;
    state.offlineEntryNotified = false;
    updateNetworkBadge();
    syncOfflineQueue(false, true);
  });

  window.addEventListener('offline', () => {
    state.isOnline = false;
    updateNetworkBadge();
    notifyOfflineEntry(false);
  });

  // 30-second automatic background refresh
  setInterval(runBackgroundRefresh, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') runBackgroundRefresh();
  });

  // Responsive resize handler for mobile A4 scaling & Status chart legend placement
  let resizeTimer = null;
  let lastMobileChart = window.innerWidth <= 640;
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.tab === 'document' && typeof window._ppmScaleMemoView === 'function') {
        window._ppmScaleMemoView();
      }
      const nowMobileChart = window.innerWidth <= 640;
      if (state.tab === 'dashboard' && nowMobileChart !== lastMobileChart) {
        lastMobileChart = nowMobileChart;
        const content = ROOT.querySelector('#ppm-content');
        if (content && content.querySelector('#ppm-urgency-chart')) {
          renderDashboardCharts(content, getFilteredDashboardRecords());
        }
      }
    }, 150);
  });

  // ==================== EXIT & BACK-BUTTON PROTECTION ====================
  const exitGuard = {
    depth: 0,
    maxDepth: 3,
    lastArmTs: 0,
    modalOpen: false,
    allowExit: false,
    toastTimer: null
  };

  function hideExitToast() {
    if (exitGuard.toastTimer) { clearTimeout(exitGuard.toastTimer); exitGuard.toastTimer = null; }
    document.getElementById('ppm-exit-toast')?.remove();
  }

  function showExitToast(msg) {
    hideExitToast();
    const toast = document.createElement('div');
    toast.id = 'ppm-exit-toast';
    toast.setAttribute('role', 'status');
    toast.textContent = msg;
    document.body.appendChild(toast);
    exitGuard.toastTimer = setTimeout(hideExitToast, 4500);
  }

  function armExitGuard(isUserGesture = false) {
    if (!window.history || typeof window.history.pushState !== 'function') return;
    if (isUserGesture && exitGuard.allowExit) {
      exitGuard.allowExit = false;
      hideExitToast();
    }
    if (exitGuard.allowExit) return;

    const now = Date.now();
    try {
      if (!isUserGesture) {
        if (exitGuard.depth === 0) {
          history.replaceState({ ppmGuard: 'base', depth: 0 }, '', window.location.href);
          history.pushState({ ppmGuard: 'trap', depth: 1 }, '', window.location.href);
          exitGuard.depth = 1;
          exitGuard.lastArmTs = now;
        }
        return;
      }
      // On real user gestures, maintain up to 3 user-activated guard states so rapid
      // accidental Back taps on Android/iOS Chrome are all intercepted cleanly.
      if (exitGuard.depth < exitGuard.maxDepth && (exitGuard.depth < 1 || (now - exitGuard.lastArmTs) > 300)) {
        exitGuard.depth += 1;
        history.pushState({ ppmGuard: 'trap', depth: exitGuard.depth }, '', window.location.href);
        exitGuard.lastArmTs = now;
      }
    } catch (_) {}
  }

  function closeExitModal(rearm = true) {
    const overlay = document.getElementById('ppm-exit-overlay');
    if (overlay) overlay.classList.remove('active');
    exitGuard.modalOpen = false;
    if (rearm) armExitGuard(true);
  }

  function openExitModal() {
    let overlay = document.getElementById('ppm-exit-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'ppm-exit-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML = `
        <div id="ppm-exit-box">
          <div id="ppm-exit-badge"></div>
          <div id="ppm-exit-title"></div>
          <div id="ppm-exit-msg"></div>
          <div id="ppm-exit-hint"></div>
          <div id="ppm-exit-actions">
            <button type="button" id="ppm-exit-leave">Exit App</button>
            <button type="button" id="ppm-exit-stay">Stay in App</button>
          </div>
        </div>`;
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeExitModal(true);
      });
      document.body.appendChild(overlay);
    }

    const box = overlay.querySelector('#ppm-exit-box');
    const badge = overlay.querySelector('#ppm-exit-badge');
    const titleEl = overlay.querySelector('#ppm-exit-title');
    const msgEl = overlay.querySelector('#ppm-exit-msg');
    const hintEl = overlay.querySelector('#ppm-exit-hint');
    const stayBtn = overlay.querySelector('#ppm-exit-stay');
    const leaveBtn = overlay.querySelector('#ppm-exit-leave');

    const activeRec = getActive();
    const inMemoDetails = state.tab === 'input';
    const hasUnsavedWork = Boolean(state.isDirty || (inMemoDetails && activeRec && activeRec.isDraft));
    const pendingUploads = getPendingCount();

    hintEl.classList.remove('visible');
    hintEl.textContent = '';

    if (state.isSyncing) {
      badge.className = 'warn';
      badge.textContent = '⏳ Cloud Sync In Progress';
      titleEl.textContent = 'Wait Before Exiting?';
      msgEl.innerHTML = 'Your PPM records are currently uploading to Google Sheets &amp; Drive. Leaving now may interrupt the sync.';
      stayBtn.textContent = 'Stay & Finish Sync';
      leaveBtn.textContent = 'Exit Anyway';
    } else if (inMemoDetails && hasUnsavedWork) {
      const repLabel = activeRec && activeRec.reportNo ? `BHS/PPM ${esc(activeRec.reportNo)}` : 'your current memo';
      badge.className = 'warn';
      badge.textContent = '⚠️ Unsaved Work in Memo Details';
      titleEl.textContent = 'Finish Your Memo Before Exiting?';
      msgEl.innerHTML = `You are currently working on <b>${repLabel}</b> in <b>Memo Details</b> and have not tapped <b>Submit ✔</b> yet.<br><br>Stay in the app to complete and submit your entry.`;
      stayBtn.textContent = 'Stay & Continue Memo';
      leaveBtn.textContent = 'Exit App';
    } else if (inMemoDetails) {
      badge.className = 'info';
      badge.textContent = '📝 Memo Details Open';
      titleEl.textContent = 'Exit BHS PPM Dashboard?';
      msgEl.innerHTML = 'You are currently in the <b>Memo Details</b> tab. Tap <b>Stay &amp; Continue</b> to keep working, or <b>Exit App</b> if you meant to leave.';
      stayBtn.textContent = 'Stay & Continue';
      leaveBtn.textContent = 'Exit App';
    } else if (pendingUploads > 0) {
      badge.className = 'warn';
      badge.textContent = `📡 ${pendingUploads} Record(s) Pending Sync`;
      titleEl.textContent = 'Exit BHS PPM Dashboard?';
      msgEl.innerHTML = `You still have <b>${pendingUploads}</b> offline record(s) waiting to sync to Google Sheets. Are you sure you want to exit?`;
      stayBtn.textContent = 'Stay in App';
      leaveBtn.textContent = 'Exit App';
    } else {
      badge.className = 'neutral';
      badge.textContent = '🛡️ Accidental Exit Guard';
      titleEl.textContent = 'Exit BHS PPM Dashboard?';
      msgEl.innerHTML = 'You pressed the Back button. Do you want to stay in the dashboard or exit the app?';
      stayBtn.textContent = 'Stay in App';
      leaveBtn.textContent = 'Exit App';
    }

    stayBtn.onclick = () => closeExitModal(true);
    leaveBtn.onclick = () => {
      closeExitModal(false);
      saveRecords();
      exitGuard.allowExit = true;
      const curDepth = (history.state && typeof history.state.depth === 'number') ? history.state.depth : exitGuard.depth;
      const stepsBack = -(curDepth + 1);
      try { history.go(stepsBack); } catch (_) {}
      setTimeout(() => { try { window.close(); } catch (_) {} }, 180);
      // Fallback for iOS standalone PWA / single-tab browsers where JS cannot force-close the window
      setTimeout(() => {
        if (document.visibilityState === 'visible') {
          showExitToast('Exit unlocked — swipe up or close this browser tab safely.');
        }
      }, 550);
    };

    exitGuard.modalOpen = true;
    box.classList.remove('shake');
    void overlay.offsetWidth;
    overlay.classList.add('active');
    setTimeout(() => stayBtn.focus(), 40);
  }

  ['pointerdown', 'keydown'].forEach((evtName) => {
    document.addEventListener(evtName, (e) => {
      if (e.target && e.target.closest && e.target.closest('#ppm-exit-overlay')) return;
      armExitGuard(true);
    }, { passive: true, capture: true });
  });

  window.addEventListener('popstate', (e) => {
    if (exitGuard.allowExit) return;

    const landedDepth = (e.state && typeof e.state.depth === 'number') ? e.state.depth : 0;
    exitGuard.depth = landedDepth;

    // Immediately re-anchor history synchronously so rapid back-button taps cannot force-exit
    try {
      exitGuard.depth = landedDepth + 1;
      history.pushState({ ppmGuard: 'trap', depth: exitGuard.depth }, '', window.location.href);
    } catch (_) {}

    // 1. Close enlarged photo lightbox first if open
    const lb = document.getElementById('ppm-lightbox-overlay');
    if (lb && lb.classList.contains('active')) {
      lb.classList.remove('active');
      return;
    }

    // 2. Close any open multi-select dropdown menu first
    const openMenus = document.querySelectorAll('.dd-menu.open');
    if (openMenus.length > 0) {
      openMenus.forEach(m => m.classList.remove('open'));
      return;
    }

    // 3. Do not interrupt another active confirmation/PIN modal
    const activeModal = document.getElementById('ppm-modal-overlay');
    if (activeModal && activeModal.classList.contains('active')) {
      return;
    }

    // 4. If Exit Confirmation is already visible, swallow repeated accidental Back taps
    if (exitGuard.modalOpen) {
      const box = document.getElementById('ppm-exit-box');
      const hint = document.getElementById('ppm-exit-hint');
      if (hint) {
        hint.textContent = 'Back button locked — tap "Stay" to keep working, or tap "Exit App" to leave.';
        hint.classList.add('visible');
      }
      if (box) {
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
      }
      return;
    }

    // 5. Show Exit Confirmation Notification
    openExitModal();
  });

  window.addEventListener('beforeunload', (e) => {
    if (exitGuard.allowExit) return;
    const activeRec = getActive();
    const workingInMemo = state.tab === 'input' && (state.isDirty || (activeRec && activeRec.isDraft));
    if (workingInMemo || state.isSyncing) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  window._ppmAllowExitForReload = function () {
    exitGuard.allowExit = true;
  };

  window._ppmCanApplyUpdate = async function () {
    if (state.isSyncing) {
      await showModal("Sync in Progress", "Please wait a moment for your offline records to finish syncing before updating.", "alert");
      return false;
    }
    if (state.tab === 'input' && state.isDirty) {
      return await wrapUnsaved();
    }
    exitGuard.allowExit = true;
    return true;
  };

  armExitGuard(false);
  render();
  loadRecords();
})();
</script>
<script>
(function initAppUpdater() {
  // Bump APP_VERSION to match version.json and CACHE_NAME in sw.js on every release
  const APP_VERSION = '1.0.2';
  let waitingWorker = null;
  let swRegistration = null;
  let reloading = false;
  let dismissedVersion = null;
  let latestMeta = { version: '', notes: '' };

  function showUpdateBanner(newVersion, notes) {
    const versionKey = newVersion || latestMeta.version || 'sw-waiting';
    if (newVersion) latestMeta.version = newVersion;
    if (notes) latestMeta.notes = notes;
    if (dismissedVersion && dismissedVersion === versionKey) return;

    let banner = document.getElementById('ppm-update-banner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'ppm-update-banner';
      banner.setAttribute('role', 'status');
      banner.setAttribute('aria-live', 'polite');
      document.body.appendChild(banner);
    }

    const verLabel = latestMeta.version ? ` (v${latestMeta.version})` : '';
    const noteText = latestMeta.notes || 'A newer version of the BHS PPM dashboard is ready.';
    banner.innerHTML = `
      <div style="flex:1;min-width:200px">
        <div class="upd-title"></div>
        <div class="upd-notes"></div>
      </div>
      <div class="upd-actions">
        <button type="button" class="upd-btn-later" id="ppm-upd-later">Later</button>
        <button type="button" class="upd-btn-now" id="ppm-upd-now">Update Now</button>
      </div>
    `;
    banner.querySelector('.upd-title').textContent = `Update Available${verLabel}`;
    banner.querySelector('.upd-notes').textContent = noteText;

    banner.querySelector('#ppm-upd-later').onclick = () => {
      dismissedVersion = latestMeta.version || 'sw-waiting';
      banner.remove();
    };

    banner.querySelector('#ppm-upd-now').onclick = async () => {
      if (typeof window._ppmCanApplyUpdate === 'function') {
        const ok = await window._ppmCanApplyUpdate();
        if (!ok) return;
      }
      const btn = banner.querySelector('#ppm-upd-now');
      btn.textContent = 'Updating...';
      btn.disabled = true;

      const forceReload = async () => {
        if (reloading) return;
        reloading = true;
        if (typeof window._ppmAllowExitForReload === 'function') window._ppmAllowExitForReload();
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k.startsWith('bhs-ppm-')).map(k => caches.delete(k)));
          }
        } catch (_) {}
        window.location.reload();
      };

      const targetWorker = waitingWorker || (swRegistration && swRegistration.waiting);
      if (targetWorker) {
        targetWorker.postMessage({ type: 'SKIP_WAITING' });
        // Safety fallback for iOS WebKit if controllerchange is delayed
        setTimeout(forceReload, 2500);
      } else {
        if (swRegistration) {
          try { await swRegistration.update(); } catch (_) {}
        }
        await forceReload();
      }
    };
  }

  async function checkVersionJson() {
    if (!navigator.onLine) return;
    try {
      const res = await fetch(`./version.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.version && String(data.version).trim() !== APP_VERSION) {
        if (swRegistration) swRegistration.update().catch(() => {});
        showUpdateBanner(String(data.version).trim(), data.notes ? String(data.notes) : '');
      }
    } catch (_) {}
  }

  function monitorRegistration(reg) {
    swRegistration = reg;
    if (reg.waiting) {
      waitingWorker = reg.waiting;
      checkVersionJson();
      showUpdateBanner('', 'New enhancements are ready. Tap Update Now to refresh.');
    }
    reg.addEventListener('updatefound', () => {
      const installing = reg.installing;
      if (!installing) return;
      installing.addEventListener('statechange', () => {
        if (installing.state === 'installed' && navigator.serviceWorker.controller) {
          waitingWorker = installing;
          checkVersionJson();
          showUpdateBanner('', 'New enhancements are ready. Tap Update Now to refresh.');
        }
      });
    });
  }

  if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      if (typeof window._ppmAllowExitForReload === 'function') window._ppmAllowExitForReload();
      window.location.reload();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then((reg) => {
          monitorRegistration(reg);
          checkVersionJson();
        })
        .catch(() => {
          checkVersionJson();
        });
    });

    // Check for updates whenever the user returns to the installed app
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (swRegistration) swRegistration.update().catch(() => {});
        checkVersionJson();
      }
    });

    // Periodic check every 15 minutes while app stays open
    setInterval(() => {
      if (document.visibilityState === 'visible') {
        if (swRegistration) swRegistration.update().catch(() => {});
        checkVersionJson();
      }
    }, 15 * 60 * 1000);
  }
})();
</script>
