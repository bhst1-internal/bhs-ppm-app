<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BHS Maintenance : Planned Preventative Maintenance (PPM)</title>
<style>
  #acm-root,#acm-root *{box-sizing:border-box}
  #acm-root{--ink:#1f2937;--ink-light:#374151;--paper:#ffffff;--line:#e5e7eb;--line-dark:#9ca3af;--accent:#2563eb;--accent-2:#1d4ed8;--bg:#f3f4f6;--input-bg:#f9fafb;--text-sec:#6b7280;--ok:#059669;--warn:#d97706;--crit:#dc2626;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:0;min-height:100%;font-size:.875rem;line-height:1.4;position:relative}
  .mono-font,#acm-root input[type=date],#acm-root input[type=time],#acm-root .kpi-value,#acm-root .doc-footer-code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  #acm-root .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
  #acm-root .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  #acm-root .brand{display:flex;flex-direction:column;gap:2px}
  #acm-root .brand .k{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sec);font-weight:700}
  #acm-root .brand .t{font-size:1.125rem;font-weight:800;color:var(--ink)}
  #acm-root .tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:10px}
  #acm-root .tab-btn{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .15s}
  #acm-root .tab-btn.active{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  #acm-root .tab-btn:hover:not(.active){color:var(--ink)}
  #acm-root .cloud-alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:.78rem;font-weight:600;border:1px solid transparent}
  #acm-root .cloud-alert.loading{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  #acm-root .cloud-alert.warn{background:#fffbeb;border-color:#fcd34d;color:#92400e}
  #acm-root .cloud-alert.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  #acm-root .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .kpi-grid{grid-template-columns:repeat(2,1fr)}}
  #acm-root .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:visible}
  #acm-root .kpi-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
  #acm-root .kpi-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sec);font-weight:700}
  #acm-root .kpi-value{font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1;margin-top:2px}
  #acm-root .kpi-sub{font-size:.75rem;color:var(--text-sec)}
  #acm-root .kpi-pill{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:999px;width:fit-content;margin-top:2px}
  #acm-root .pill-ok{background:#d1fae5;color:var(--ok)}
  #acm-root .pill-warn{background:#fef3c7;color:var(--warn)}
  #acm-root .pill-crit{background:#fee2e2;color:var(--crit)}
  #acm-root .dd-wrapper{position:relative;width:100%;margin-top:4px}
  #acm-root .dd-wrapper.form-dd{margin-top:0}
  #acm-root .dd-btn{width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);font-size:.75rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #acm-root .dd-btn.placeholder{color:var(--text-sec);font-weight:500}
  #acm-root .dd-btn::after{content:"▼";font-size:.55rem;margin-left:6px;color:var(--line-dark);flex-shrink:0}
  #acm-root .dd-menu{display:none;position:absolute;top:100%;left:0;width:100%;max-height:220px;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:7px;z-index:100;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:4px}
  #acm-root .dd-menu.open{display:flex;flex-direction:column;gap:6px}
  #acm-root [data-tooltip]{position:relative;cursor:help}
  #acm-root [data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:6px 10px;border-radius:6px;font-size:.75rem;white-space:nowrap;z-index:100;margin-bottom:8px;pointer-events:none;font-weight:500;text-transform:none;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  #acm-root [data-tooltip]:hover::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#111827;margin-bottom:-2px;pointer-events:none;z-index:100}
  #acm-root .charts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .charts-grid{grid-template-columns:minmax(0,1fr)}}
  #acm-root .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;overflow:hidden}
  #acm-root .panel h3{margin:0 0 10px;font-size:.875rem;font-weight:800;color:var(--ink)}
  #acm-root .panel .hint{font-size:.75rem;color:var(--line-dark);margin-bottom:8px}
  #acm-root .table-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  #acm-root table.list{width:100%;border-collapse:collapse}
  #acm-root table.list th,#acm-root table.editrows th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sec);background-color:var(--input-bg);padding:6px 8px;border-bottom:2px solid var(--line)}
  #acm-root table.list td,#acm-root table.editrows td{font-size:.7rem;color:var(--ink-light);padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  #acm-root table.list tr:hover td{background:var(--input-bg)}
  #acm-root .status-chip{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
  #acm-root .chip-open{background:#e5e7eb;color:var(--text-sec)}
  #acm-root .chip-progress{background:#fef3c7;color:var(--warn)}
  #acm-root .chip-done{background:#d1fae5;color:var(--ok)}
  #acm-root .link-btn{border:none;background:none;color:var(--accent);font-weight:700;font-size:.75rem;cursor:pointer;padding:2px 4px}
  #acm-root .empty-state{text-align:center;padding:34px 10px;color:var(--text-sec);font-size:.875rem}
  #acm-root .form-shell{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px 24px}
  #acm-root .form-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  #acm-root .form-toolbar .rec-select{display:flex;align-items:center;gap:8px;font-size:.875rem}
  #acm-root select.recpick{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;background:var(--input-bg);color:var(--ink);font-family:ui-monospace,monospace}
  #acm-root .btn{border:none;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .btn-primary{background:var(--accent);color:#fff}
  #acm-root .btn-primary:hover{background:var(--accent-2)}
  #acm-root .btn-ghost{background:var(--line);color:var(--ink-light)}
  #acm-root .btn-ghost:hover{background:#d1d5db}
  #acm-root .btn-danger{background:#fee2e2;color:var(--crit)}
  #acm-root .btn-danger:hover{background:#fca5a5}
  #acm-root .btn-solid-danger{background:var(--crit);color:#fff}
  #acm-root .btn-solid-danger:hover{background:#b91c1c}
  #acm-root .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  #acm-root .btn-export-excel{background-color:var(--ok);color:#ffffff;font-size:.875rem;font-weight:700;padding:8px 16px;border-radius:4px;border:none;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.05);display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
  #acm-root .btn-export-excel:hover{background-color:#047857}
  #acm-root .btn-export-excel svg{width:16px;height:16px}
  #acm-root .sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;transition:all .2s}
  #acm-root .sec>.sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
  #acm-root .grid{display:grid;gap:10px}
  #acm-root .g2{grid-template-columns:1fr 1fr}
  #acm-root .g3{grid-template-columns:1fr 1fr 1fr}
  #acm-root .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  #acm-root .g5{grid-template-columns:repeat(5,1fr)}
  #acm-root .g6{grid-template-columns:repeat(6,1fr)}
  @media (max-width:720px){#acm-root .g2,#acm-root .g3,#acm-root .g4,#acm-root .g5,#acm-root .g6{grid-template-columns:1fr}}
  #acm-root label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--ink-light);font-weight:600}
  #acm-root input[type=text],#acm-root input[type=date],#acm-root input[type=time],#acm-root input[type=number],#acm-root textarea,#acm-root select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;font-family:inherit;color:var(--ink);background:var(--input-bg);transition:all .2s}
  #acm-root select[multiple]{padding:4px 6px}
  #acm-root textarea{resize:vertical;min-height:54px}
  #acm-root .check-row,#acm-root .radio-row{display:flex;flex-wrap:wrap;gap:12px}
  #acm-root .chk,#acm-root .rad{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--ink-light);cursor:pointer}
  #acm-root .chk input,#acm-root .rad input{width:15px;height:15px;accent-color:var(--accent)}
  #acm-root table.editrows{width:100%;border-collapse:collapse;margin-top:6px}
  #acm-root table.editrows input{width:100%;font-size:.75rem}
  #acm-root .err-highlight,#acm-root .err-sec{border:1px solid var(--crit)!important;background-color:#fef2f2!important;box-shadow:0 0 0 1px var(--crit)}
  #acm-root #acm-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,24,39,.7);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)}
  #acm-root #acm-modal-overlay.active{opacity:1;pointer-events:auto}
  #acm-root #acm-modal-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:90%;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,.18);transform:translateY(12px);transition:transform .2s ease}
  #acm-root #acm-modal-overlay.active #acm-modal-box{transform:translateY(0)}
  #acm-root #acm-modal-title{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:8px}
  #acm-root #acm-modal-msg{font-size:.875rem;color:var(--ink-light);margin-bottom:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  #acm-root #acm-modal-input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px;font-size:.875rem;font-family:inherit;color:var(--ink);background:var(--input-bg);outline:none;display:none}
  #acm-root #acm-modal-input:focus{border-color:var(--accent)}
  #acm-root #acm-modal-actions{display:flex;justify-content:flex-end;gap:8px}
  #acm-root .doc-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  #acm-root .doc-scroll{overflow-x:auto;overflow-y:auto;background:#cbd5e1;padding:24px 14px;border-radius:12px;max-height:calc(100vh - 140px)}
  #acm-root .doc-page{width:794px;min-height:1085px;margin:0 auto;background:#ffffff;padding:24px 28px 22px;font-family:Arial,Helvetica,sans-serif;color:#0f172a;font-size:11px;box-shadow:0 6px 24px rgba(15,23,42,.18);display:flex;flex-direction:column;justify-content:space-between;border-radius:2px}
  #acm-root .doc-page table{border-collapse:collapse;width:100%;table-layout:fixed}
  #acm-root .doc-page td,#acm-root .doc-page th{border:1px solid #334155;padding:4px 7px;vertical-align:middle;font-size:10.5px;color:#0f172a}
  #acm-root .ppm-doc-top{display:flex;justify-content:space-between;align-items:stretch;gap:14px;padding-bottom:10px;border-bottom:2px solid #0f172a;margin-bottom:10px}
  #acm-root .ppm-doc-brand{flex:1;display:flex;flex-direction:column;justify-content:center}
  #acm-root .doc-header-title{font-size:17px;font-weight:800;letter-spacing:.02em;color:#0f172a;margin:0;text-transform:uppercase}
  #acm-root .doc-header-sub{font-size:11.5px;font-weight:700;color:#334155;margin:2px 0 6px}
  #acm-root .doc-memo-title{font-size:12.5px;font-weight:800;font-style:italic;color:#1e3a8a;margin:0 0 6px}
  #acm-root .ppm-doc-status-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #acm-root .ppm-doc-ctrl{width:272px;flex-shrink:0}
  #acm-root .ppm-doc-ctrl td{padding:3.5px 7px;font-size:10px}
  #acm-root .ppm-doc-ctrl .ctrl-lbl{width:44%;background:#f1f5f9;font-weight:700;color:#1e293b}
  #acm-root .ppm-doc-ctrl .ctrl-val{font-weight:700;text-align:center}
  #acm-root .ppm-sec{margin-bottom:9px}
  #acm-root .ppm-sec-bar{background:#f1f5f9;border:1px solid #334155;border-bottom:none;padding:4px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#0f172a;display:flex;align-items:center;justify-content:space-between}
  #acm-root .ppm-sec-bar span.sec-num{color:#1d4ed8;margin-right:5px}
  #acm-root .ppm-lbl{background:#f8fafc;font-weight:700;color:#334155;font-size:10px;white-space:nowrap}
  #acm-root .ppm-val{font-weight:600;color:#0f172a;word-break:break-word}
  #acm-root .ppm-chk-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:2px 0}
  #acm-root .ppm-chk-item{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#1e293b}
  #acm-root .ppm-chk-item.checked{font-weight:800;color:#0f172a}
  #acm-root .doc-checkbox{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1.2px solid #0f172a;font-size:9.5px;font-weight:900;line-height:1;background:#fff;color:#0f172a}
  #acm-root .ppm-chk-item.checked .doc-checkbox{background:#dbeafe;border-color:#1e3a8a;color:#1e3a8a}
  #acm-root .ppm-photo-grid{display:grid;gap:8px;border:1px solid #334155;padding:7px;background:#ffffff}
  #acm-root .ppm-photo-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  #acm-root .ppm-photo-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  #acm-root .ppm-photo-box{border:1px solid #94a3b8;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;background:#f8fafc}
  #acm-root .ppm-photo-head{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 7px;background:#f1f5f9;border-bottom:1px solid #cbd5e1;font-size:9.5px}
  #acm-root .ppm-photo-tag{font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:999px;font-size:8.5px}
  #acm-root .ppm-tag-before{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  #acm-root .ppm-tag-cleaning{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}
  #acm-root .ppm-tag-after{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
  #acm-root .ppm-photo-ts{font-size:8.5px;color:#475569;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:nowrap}
  #acm-root .ppm-photo-stage{height:198px;display:flex;align-items:center;justify-content:center;background:#f8fafc;overflow:hidden;position:relative}
  #acm-root .ppm-photo-grid.cols-3 .ppm-photo-stage{height:182px}
  #acm-root .ppm-photo-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;cursor:zoom-in}
  #acm-root .ppm-photo-empty{font-size:9.5px;color:#94a3b8;font-style:italic;text-align:center;padding:12px}
  #acm-root .ppm-notes-box{min-height:58px;white-space:pre-wrap;line-height:1.42;font-size:10.5px;color:#0f172a;vertical-align:top}
  #acm-root .ppm-sign-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #334155}
  #acm-root .ppm-sign-cell{padding:8px 10px 6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:70px;border-right:1px solid #334155;text-align:center}
  #acm-root .ppm-sign-cell:last-child{border-right:none}
  #acm-root .ppm-sign-name{font-size:11.5px;font-weight:800;color:#0f172a;min-height:18px;display:flex;align-items:center;gap:4px;margin-bottom:4px}
  #acm-root .ppm-sign-line{width:92%;border-top:1px solid #0f172a;padding-top:3px;font-size:9.5px;font-weight:700;color:#334155}
  #acm-root .ppm-doc-foot{display:flex;justify-content:space-between;align-items:center;padding-top:5px;border-top:1px solid #cbd5e1;font-size:9px;color:#475569;margin-top:2px}
  #acm-root .doc-footer-code{font-size:9.5px;font-weight:700;color:#1e293b;margin:0}
  #acm-root .unit-bar-wrap{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  #acm-root .unit-bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  #acm-root .unit-bar-title{font-size:.75rem;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
  #acm-root .unit-count-pill{background:#dbeafe;color:var(--accent-2);font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px}
  #acm-root .unit-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #acm-root .unit-act-btn{border:1px solid var(--line);background:var(--input-bg);color:var(--ink-light);padding:4px 10px;border-radius:7px;font-size:.72rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
  #acm-root .unit-act-btn:hover{background:var(--line);color:var(--ink)}
  #acm-root .unit-act-btn.primary{background:#eff6ff;border-color:#93c5fd;color:var(--accent-2)}
  #acm-root .unit-act-btn.primary:hover{background:#dbeafe}
  #acm-root .unit-act-btn.danger{background:#fef2f2;border-color:#fecaca;color:var(--crit)}
  #acm-root .unit-act-btn.danger:hover{background:#fee2e2}
  #acm-root .unit-tabs-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  #acm-root .unit-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--input-bg);color:var(--ink-light);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .unit-pill:hover{border-color:#94a3b8;background:#f1f5f9}
  #acm-root .unit-pill.active{border-color:var(--accent);background:#eff6ff;color:var(--accent-2);box-shadow:0 2px 6px rgba(37,99,235,.15)}
  #acm-root .unit-pill.complete:not(.active){border-color:#a7f3d0;background:#ecfdf5;color:#065f46}
  #acm-root .unit-pill-sub{font-size:.66rem;font-weight:600;opacity:.8;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #acm-root .unit-active-card{background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px}
  #acm-root .unit-active-banner{font-size:.72rem;font-weight:800;color:var(--accent-2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  #acm-root .ppm-unit-matrix th{background:#f1f5f9;font-size:9px;font-weight:800;text-transform:uppercase;color:#1e293b;padding:4px 5px}
  #acm-root .ppm-unit-matrix td{font-size:9.2px;padding:3.5px 5px;vertical-align:top;line-height:1.3}
  #acm-root .ppm-multi-photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border:1px solid #334155;padding:6px;background:#ffffff}
  #acm-root .ppm-multi-photo-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  #acm-root .ppm-multi-photo-grid .ppm-photo-head{padding:2px 5px;font-size:8.5px}

  // Automatically expands COMPRESSED_DB into EQUIP_DB[Line][No] = ConveyorItem
  const EQUIP_DB = (() => {
    const db = {};
    if (!COMPRESSED_DB) return db;

    const addEntry = (line, no, item) => {
      const l = String(line || '').trim().toUpperCase();
      const n = String(no || '').trim();
      const it = String(item || '').trim();
      if (!l || !n) return;
      if (!db[l]) db[l] = {};
      db[l][n] = it;
    };

    const expandTokens = (line, item, tokens) => {
      (Array.isArray(tokens) ? tokens : [tokens]).forEach(tok => {
        const s = String(tok || '').trim();
        const rangeMatch = s.match(/^(\d+)\s*-\s*(\d+)$/);
        if (rangeMatch) {
          const padLen = rangeMatch[1].length;
          const start = parseInt(rangeMatch[1], 10);
          const end = parseInt(rangeMatch[2], 10);
          const step = start <= end ? 1 : -1;
          for (let i = start; step > 0 ? i <= end : i >= end; i += step) {
            addEntry(line, String(i).padStart(padLen, '0'), item);
          }
        } else if (s) {
          addEntry(line, s, item);
        }
      });
    };

    if (Array.isArray(COMPRESSED_DB)) {
      COMPRESSED_DB.forEach(row => {
        if (Array.isArray(row)) addEntry(row[0], row[1], row[2]);
        else if (row && typeof row === 'object') {
          addEntry(row.lineEquipment || row.line, row.equipNo || row.no, row.conveyorItem || row.item);
        }
      });
      return db;
    }

    if (typeof COMPRESSED_DB === 'object') {
      Object.entries(COMPRESSED_DB).forEach(([line, val]) => {
        if (!val || typeof val !== 'object') return;
        Object.entries(val).forEach(([k, v]) => {
          if (Array.isArray(v)) {
            expandTokens(line, k, v);
          } else {
            addEntry(line, k, v);
          }
        });
      });
    }
    return db;
  })();

  // Offline storage layer (IndexedDB with localStorage fallback)
  const OfflineDB = (() => {
    const DB_NAME = 'BHS_PPM_OFFLINE_DB';
    const DB_VERSION = 1;
    let dbPromise = null;

    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve) => {
        try {
          if (typeof indexedDB === 'undefined') { resolve(null); return; }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
      return dbPromise;
    }

    async function get(key) {
      const db = await open();
      if (db) {
        try {
          return await new Promise((resolve) => {
            const tx = db.transaction('kv', 'readonly');
            const req = tx.objectStore('kv').get(key);
            req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
            req.onerror = () => resolve(null);
          });
        } catch (e) {}
      }
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    async function set(key, value) {
      const db = await open();
      if (db) {
        try {
          await new Promise((resolve) => {
            const tx = db.transaction('kv', 'readwrite');
            tx.objectStore('kv').put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (e) {}
      }
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    return { get, set };
  })();

  // Compresses camera/upload photo and stamps Date, Time (H:mm:ss), and Location watermark
  function optimizeCameraImage(file, meta = {}) {
    return new Promise((resolve, reject) => {
      if (!file) { reject(new Error('No file')); return; }
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const dateStr = `${dd}/${mm}/${yyyy}`;
      const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      const locStr = [meta.lineEquipment, meta.equipNo].filter(Boolean).join(' - ') || 'BHS Terminal 1';
      const labelTag = String(meta.label || '').toUpperCase();

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1024;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          // Watermark banner along bottom
          const barH = Math.max(44, Math.round(h * 0.085));
          ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
          ctx.fillRect(0, h - barH, w, barH);

          const fontSize = Math.max(12, Math.round(barH * 0.34));
          ctx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
          ctx.fillStyle = '#ffffff';
          ctx.textBaseline = 'middle';

          const line1 = `${labelTag ? '[' + labelTag + '] ' : ''}Date: ${dateStr} | Time: ${timeStr}`;
          const line2 = `Location: ${locStr}`;
          const padX = Math.max(10, Math.round(w * 0.02));
          ctx.fillText(line1, padX, h - barH * 0.68);
          ctx.fillStyle = '#fde68a';
          ctx.fillText(line2, padX, h - barH * 0.28);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          resolve({ dataUrl, dateStr, timeStr });
        };
        img.onerror = () => reject(new Error('Image load failed'));
        img.src = ev.target.result;
      };
      reader.onerror = () => reject(new Error('File read failed'));
      reader.readAsDataURL(file);
    });
  }

  function getNextUnitNo(r) {
    const units = ensureUnits(r);
    const used = new Set(units.map(u => String(u.equipNo || '').trim().toUpperCase()).filter(Boolean));
    const lastNo = String(units[units.length - 1]?.equipNo || '').trim();

    const m = lastNo.match(/^(.*?)(\d+)$/);
    if (m) {
      const prefix = m[1];
      const padLen = m[2].length;
      let num = parseInt(m[2], 10) + 1;
      for (let i = 0; i < 200; i++) {
        const candidate = `${prefix}${String(num + i).padStart(padLen, '0')}`;
        if (!used.has(candidate.toUpperCase())) return candidate;
      }
    }

    const line = String(r.lineEquipment || '').trim().toUpperCase();
    if (line && EQUIP_DB[line]) {
      const keys = Object.keys(EQUIP_DB[line]).sort();
      for (const k of keys) {
        if (!used.has(k.toUpperCase())) return k;
      }
    }
    return '';
  }

  function getStatus(r) {

      Boolean((u.inspectionMethod || '').trim()) &&

    const anyUnitProgress = units.some(u =>
      Boolean((u.taskPerformed || '').trim()) ||
      Boolean((u.afterImage || '').trim()) ||
      Boolean((u.resultCat || '').trim())

    const hasDone = (r.doneByName || '').trim().length >= 3;
    const hasCheck = (r.checkByName || '').trim().length >= 3;
    const hasConfirm = Boolean((r.confirmedByName || '').trim());

    if (allUnitsCore && hasDone && hasCheck && hasConfirm) return 'Completed';
    if (allUnitsCore && hasDone && hasCheck && !hasConfirm) return 'In progress - Confirmed By (pending)';
    if (anyUnitProgress || hasDone || hasCheck || hasConfirm) return 'In progress';
    return 'Open';

  // Fetches Google Drive thumbnail via Apps Script JSONP to bypass CORS for Save as JPEG
  const DRIVE_IMG_CACHE = {};
  function fetchDriveImageAsDataUrl(url) {
    return new Promise((resolve) => {
      if (!url || String(url).startsWith('data:image/')) { resolve(url); return; }
      if (DRIVE_IMG_CACHE[url]) { resolve(DRIVE_IMG_CACHE[url]); return; }
      const match = String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (!match || isPlaceholderUrl()) { resolve(url); return; }

      const fileId = match[1];
      const cbName = 'ppmImgCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const script = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); resolve(url); }, 10000);

      function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function(res) {
        cleanup();
        if (res && res.ok && res.dataUrl) {
          DRIVE_IMG_CACHE[url] = res.dataUrl;
          resolve(res.dataUrl);
        } else {
          resolve(url);
        }
      };
      script.onerror = function() { cleanup(); resolve(url); };
      script.src = `${WEB_APP_URL}?action=image&id=${encodeURIComponent(fileId)}&callback=${cbName}`;
      document.body.appendChild(script);
    });
  }

  function bindJPEGExport(btnId, targetId, fileName) {
    const btn = ROOT.querySelector(`#${btnId}`);
    const target = ROOT.querySelector(`#${targetId}`);
    if (!btn || !target) return;
    btn.addEventListener('click', async () => {
      await ensureChartJs();
      if (!window.html2canvas) {
        showModal('Export Unavailable', 'Image export library could not be loaded while offline.');
        return;
      }
      const origText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Preparing JPEG...';
      try {
        const imgs = Array.from(target.querySelectorAll('img'));
        const origSrcs = imgs.map(img => img.src);
        await Promise.all(imgs.map(async (img) => {
          if (img.src && !img.src.startsWith('data:')) {
            img.src = await fetchDriveImageAsDataUrl(img.src);
          }
        }));
        const canvas = await window.html2canvas(target, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff'
        });
        imgs.forEach((img, idx) => { img.src = origSrcs[idx]; });
        const link = document.createElement('a');
        link.download = `${fileName}_${new Date().toISOString().slice(0, 10)}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
      } catch (err) {
        showModal('Export Failed', err.message || 'Unable to generate JPEG.');
      } finally {
        btn.disabled = false;
        btn.textContent = origText;
      }
    });
  }

  window.syncGoogleSheets = async function(cloudData) {
    if (!Array.isArray(cloudData)) return;
    const localMap = new Map(state.records.map(r => [String(r.createdAt), r]));
    const delQueue = (await OfflineDB.get(DELETE_QUEUE_KEY)) || [];
    const delSet = new Set(delQueue.map(String));

    const merged = [];
    const seen = new Set();

    cloudData.forEach(cRec => {
      const id = String(cRec.createdAt);
      if (delSet.has(id)) return;
      seen.add(id);
      const lRec = localMap.get(id);
      if (lRec && lRec.pendingSync) {
        ensureUnits(lRec);
        merged.push(lRec);
      } else {
        cRec.pendingSync = false;
        ensureUnits(cRec);
        merged.push(cRec);
      }
    });

    localMap.forEach((lRec, id) => {
      if (!seen.has(id) && !delSet.has(id)) {
        ensureUnits(lRec);
        merged.push(lRec);
      }
    });

    merged.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
    state.records = merged;
    await OfflineDB.set(STORE_KEY, state.records);
    render();
  };

  function fetchCloudRecords(silent = false) {
    return new Promise((resolve) => {
      if (!state.isOnline) {
        state.cloudStatus = 'offline';
        state.cloudMessage = 'Offline mode — showing records stored on this device.';
        if (!silent) render();
        resolve(false);
        return;
      }

      if (hasGoogleScriptRun()) {
        if (!silent) {
          state.cloudStatus = 'loading';
          state.cloudMessage = 'Loading records from Google Sheets...';
          render();
        }
        window.google.script.run
          .withSuccessHandler(async (data) => {
            await window.syncGoogleSheets(data || []);
            state.cloudStatus = (data && data.length === 0 && state.records.length === 0) ? 'empty' : 'ok';
            state.cloudMessage = (state.cloudStatus === 'empty')
              ? 'Connected to Google Sheets, but PPM_Records currently has 0 rows.'
              : '';
            render();
            resolve(true);
          })
          .withFailureHandler((err) => {
            state.cloudStatus = 'error';
            state.cloudMessage = `Google Sheets read error: ${err?.message || err}`;
            render();
            resolve(false);
          })
          .readAllRecords();
        return;
      }

      if (isPlaceholderUrl()) {
        state.cloudStatus = 'warn';
        state.cloudMessage = 'WEB_APP_URL is not configured yet. Showing local browser records only.';
        if (!silent) render();
        resolve(false);
        return;
      }

      if (!silent) {
        state.cloudStatus = 'loading';
        state.cloudMessage = 'Syncing records from Google Sheets...';
        render();
      }

      const cbName = 'syncGoogleSheets_' + Date.now();
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        cleanup();
        state.cloudStatus = 'error';
        state.cloudMessage = 'Could not reach Google Sheets (timed out). Verify that your Apps Script Web App is deployed as "Execute as: Me" and "Who has access: Anyone" using the /exec URL.';
        render();
        resolve(false);
      }, 12000);

      function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = async function(cloudData) {
        cleanup();
        await window.syncGoogleSheets(cloudData || []);
        state.cloudStatus = (Array.isArray(cloudData) && cloudData.length === 0 && state.records.length === 0) ? 'empty' : 'ok';
        state.cloudMessage = (state.cloudStatus === 'empty')
          ? 'Connected to Google Sheets, but the PPM_Records sheet currently has 0 saved rows.'
          : '';
        render();
        resolve(true);
      };

      script.onerror = function() {
        cleanup();
        state.cloudStatus = 'error';
        state.cloudMessage = 'Unable to load records from Google Sheets. Confirm your Web App URL ends with /exec and "Who has access" is set to Anyone.';
        render();
        resolve(false);
      };

      script.src = `${WEB_APP_URL}?action=read&callback=${cbName}&_ts=${Date.now()}`;
      document.body.appendChild(script);
    });
  }

  async function postPayloadWithTimeout(payloadObj, timeoutMs = 25000) {
    if (!state.isOnline) throw new Error('Offline');
    if (hasGoogleScriptRun()) {
      return await new Promise((resolve, reject) => {
        if (payloadObj.action === 'delete') {
          window.google.script.run
            .withSuccessHandler(() => resolve(true))
            .withFailureHandler(reject)
            .deleteRecordFromClient(payloadObj.createdAt);
        } else {
          window.google.script.run
            .withSuccessHandler(() => resolve(true))
            .withFailureHandler(reject)
            .saveRecordFromClient(JSON.stringify(payloadObj));
        }
      });
    }
    if (isPlaceholderUrl()) throw new Error('Placeholder URL');

    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payloadObj),
        signal: controller.signal
      });
      clearTimeout(id);
      return true;
    } catch (err) {
      clearTimeout(id);
      throw err;
    }
  }

  async function syncRecordToSheet(rec) {
    ensureUnits(rec);
    try {
      await postPayloadWithTimeout(rec, 30000);
      rec.pendingSync = false;
      const idx = state.records.findIndex(x => String(x.createdAt) === String(rec.createdAt));
      if (idx !== -1) state.records[idx].pendingSync = false;
      await OfflineDB.set(STORE_KEY, state.records);
      return true;
    } catch (err) {
      rec.pendingSync = true;
      const idx = state.records.findIndex(x => String(x.createdAt) === String(rec.createdAt));
      if (idx !== -1) state.records[idx].pendingSync = true;
      await OfflineDB.set(STORE_KEY, state.records);
      return false;
    }
  }

  async function deleteRecordFromSheet(createdAt) {
    try {
      await postPayloadWithTimeout({ action: 'delete', createdAt }, 15000);
      return true;
    } catch (err) {
      const q = (await OfflineDB.get(DELETE_QUEUE_KEY)) || [];
      if (!q.includes(createdAt)) {
        q.push(createdAt);
        await OfflineDB.set(DELETE_QUEUE_KEY, q);
      }
      return false;
    }
  }

  async function syncPendingQueue(showPopup = false) {
    if (!state.isOnline || state.isSyncing) return;
    const pendingList = state.records.filter(r => r.pendingSync);
    const delQueue = (await OfflineDB.get(DELETE_QUEUE_KEY)) || [];
    if (pendingList.length === 0 && delQueue.length === 0) return;

    state.isSyncing = true;
    render();
    let syncedCount = 0;

    for (const rec of pendingList) {
      const ok = await syncRecordToSheet(rec);
      if (ok) syncedCount++;
    }

    const remainingDeletes = [];
    for (const delId of delQueue) {
      try {
        await postPayloadWithTimeout({ action: 'delete', createdAt: delId }, 15000);
      } catch (e) {
        remainingDeletes.push(delId);
      }
    }
    await OfflineDB.set(DELETE_QUEUE_KEY, remainingDeletes);

    state.isSyncing = false;
    render();
    if (syncedCount > 0) {
      await fetchCloudRecords(true);
      if (showPopup) showOnlineSyncCompletePopup(syncedCount);
    }
  }

    window.addEventListener('online', async () => {

  function getFilteredRecords() {
    const f = state.filters;
    return state.records.filter(r => {
      if (r.isDraft) return false;
      const units = ensureUnits(r);
      const status = getStatus(r);

      if (f.search) {
        const q = f.search.toLowerCase();
        const unitHay = units.map(u => `${u.equipNo} ${u.conveyorItem} ${u.inspectionMethod} ${u.taskPerformed} ${u.reasonDetail}`).join(' ');
        const hay = `${r.reportNo} ${r.title} ${r.lineEquipment} ${r.issuedBy} ${unitHay}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (f.equip.length > 0) {
        const unitKeys = units.map(u => `${r.lineEquipment || ''} - ${u.equipNo || ''}`.trim());
        if (!f.equip.some(sel => unitKeys.includes(sel))) return false;
      }
      if (f.item.length > 0) {
        const unitItems = units.map(u => (u.conveyorItem || '').trim());
        if (!f.item.some(sel => unitItems.includes(sel))) return false;
      }
      if (f.method.length > 0) {
        const unitMethods = units.map(u => (u.inspectionMethod || '').trim());
        if (!f.method.some(sel => unitMethods.includes(sel))) return false;
      }
      if (f.status.length > 0) {
        if (!f.status.includes(status)) return false;
      }
      if (f.dateFrom && (r.happeningDate || '') < f.dateFrom) return false;
      if (f.dateTo && (r.happeningDate || '') > f.dateTo) return false;
      return true;
    });
  }

  function computeKPIs(recs) {
    const total = recs.length;
    const completed = recs.filter(r => getStatus(r) === 'Completed').length;
    const inProgress = recs.filter(r => getStatus(r).startsWith('In progress')).length;
    const open = recs.filter(r => getStatus(r) === 'Open').length;

    const methodCounts = {};
    recs.forEach(r => {
      ensureUnits(r).forEach(u => {
        const m = (u.inspectionMethod || '').trim();
        if (m) methodCounts[m] = (methodCounts[m] || 0) + 1;
      });
    });

    let topMethod = '-';
    let topMethodCount = 0;
    Object.entries(methodCounts).forEach(([m, c]) => {
      if (c > topMethodCount) {
        topMethod = m;
        topMethodCount = c;
      }
    });

    return { total, completed, inProgress, open, topMethod, topMethodCount };
  }

  function exportFilteredToCSV(recs) {
    const headers = [
      'Report No.', 'Date', 'Title', 'Line/Equipment', 'No.', 'Conveyor/Item',
      'Type', 'Inspection Method', 'Task Performed', 'Status'
    ];
    const rows = [headers.join(',')];

    recs.forEach(r => {
      const units = ensureUnits(r);
      const typeSet = new Set();
      const methodSet = new Set();
      const taskSet = new Set();

      units.forEach(u => {
        CATS2.forEach(c => { if (u.cat2 && u.cat2[c.key]) typeSet.add(c.label); });
        if (u.inspectionMethod) methodSet.add(u.inspectionMethod);
        parseMultiList(u.taskPerformed).forEach(t => taskSet.add(t));
      });

      const vals = [
        r.reportNo || '',
        fmtDateDMY(r.happeningDate),
        r.title || '',
        r.lineEquipment || '',
        units.map(u => u.equipNo).filter(Boolean).join('; '),
        Array.from(new Set(units.map(u => u.conveyorItem).filter(Boolean))).join('; '),
        Array.from(typeSet).join('; '),
        Array.from(methodSet).join('; '),
        Array.from(taskSet).join('; '),
        getStatus(r)
      ].map(v => `"${String(v).replace(/"/g, '""')}"`);

      rows.push(vals.join(','));
    });

    const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `BHS_PPM_Records_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
  }

      id: 'barValueLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data) return;
        ctx.save();
        ctx.font = '700 11px ui-sans-serif, system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#374151';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        meta.data.forEach((bar, idx) => {
          const val = chart.data.datasets[0].data[idx];
          ctx.fillText(String(val ?? 0), bar.x + 8, bar.y);
        });
        ctx.restore();
      }
    };

    // Plugin: draws total count inside the center of the Status doughnut ring
    const doughnutCenterPlugin = {
      id: 'doughnutCenterText',
      afterDatasetsDraw(chart) {
        const { ctx, chartArea } = chart;
        if (!chartArea) return;
        const total = (chart.data.datasets[0].data || []).reduce((a, b) => a + Number(b || 0), 0);
        const cx = (chartArea.left + chartArea.right) / 2;
        const cy = (chartArea.top + chartArea.bottom) / 2;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        ctx.fillStyle = '#1f2937';
        ctx.fillText(String(total), cx, cy - 7);
        ctx.font = '700 10px ui-sans-serif, system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#6b7280';
        ctx.fillText('TOTAL', cx, cy + 11);
        ctx.restore();
      }
    };

    const catCounts = CATS2.map(c =>
      recs.filter(r => ensureUnits(r).some(u => u.cat2 && u.cat2[c.key])).length
    );
    const maxCat = Math.max(1, ...catCounts);

    if (catCanvas) {
      state.charts.cat = new window.Chart(catCanvas, {
        type: 'bar',

        data: {
          labels: CATS2.map(c => c.label),

        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { right: 28, top: 4, bottom: 2 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#111827',
              padding: 10,
              cornerRadius: 8,
              displayColors: false,
              callbacks: {
                label: (ctx) => `Records: ${ctx.parsed.x}`
              }
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              suggestedMax: maxCat + 1,
              grid: { color: '#f3f4f6' },
              border: { display: false },
              ticks: { precision: 0, color: '#6b7280', font: { size: 11 } }
            },
            y: {
              grid: { display: false },
              border: { display: false },
              ticks: { color: '#374151', font: { size: 11, weight: '600' } }
            }
          }
        }
      });
    }

    const stCompleted = recs.filter(r => getStatus(r) === 'Completed').length;
    const stProgress = recs.filter(r => getStatus(r).startsWith('In progress')).length;
    const stOpen = recs.filter(r => getStatus(r) === 'Open').length;

    const statusCanvas = container.querySelector('#chart-status');
    if (statusCanvas) {
      state.charts.status = new window.Chart(statusCanvas, {
        type: 'doughnut',
        plugins: [doughnutCenterPlugin],
        data: {
          labels: ['Completed', 'In progress', 'Open'],
          datasets: [{
            data: [stCompleted, stProgress, stOpen],
            backgroundColor: ['#10b981', '#f59e0b', '#9ca3af'],
            hoverBackgroundColor: ['#059669', '#d97706', '#6b7280'],
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '66%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                usePointStyle: true,
                pointStyle: 'circle',
                padding: 14,
                color: '#374151',
                font: { size: 11, weight: '600' }
              }
            },
            tooltip: {
              backgroundColor: '#111827',
              padding: 10,
              cornerRadius: 8,
              callbacks: {
                label: (ctx) => {
                  const val = ctx.parsed || 0;
                  const sum = (ctx.dataset.data || []).reduce((a, b) => a + b, 0);
                  const pct = sum ? Math.round((val / sum) * 100) : 0;
                  return ` ${ctx.label}: ${val} (${pct}%)`;
                }
              }
            }
          }
        }
      });
    }
  }

  // Quick Add Range modal for adding multiple conveyor numbers (e.g., 01 to 05) at once
  async function openQuickAddRangeModal(r, container) {
    const line = String(r.lineEquipment || '').trim().toUpperCase();
    const dbNos = (line && EQUIP_DB[line]) ? Object.keys(EQUIP_DB[line]).sort() : [];

    const overlay = document.createElement('div');
    overlay.id = 'acm-modal-overlay';
    overlay.className = 'active';
    overlay.innerHTML = `
      <div id="acm-modal-box" style="max-width:460px">
        <div id="acm-modal-title">⚡ Quick Add Conveyor Numbers (${escapeHtml(line || 'Equipment')})</div>
        <div id="acm-modal-msg" style="margin-bottom:12px">Enter a range (e.g., <strong>01</strong> to <strong>05</strong>) or pick from available equipment numbers below:</div>
        <div class="grid g2" style="margin-bottom:12px">
          <label class="f">From No.
            <input type="text" id="qr-from" placeholder="01" value="01"/>
          </label>
          <label class="f">To No.
            <input type="text" id="qr-to" placeholder="05" value="05"/>
          </label>
        </div>
        ${dbNos.length ? `
          <div style="font-size:.72rem;font-weight:700;color:var(--ink-light);margin-bottom:6px">Or select from ${escapeHtml(line)} Database:</div>
          <div style="max-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
            ${dbNos.map(n => `<label class="chk"><input type="checkbox" class="qr-cb" value="${escapeHtml(n)}"/> ${escapeHtml(n)} — ${escapeHtml(EQUIP_DB[line][n] || '')}</label>`).join('')}
          </div>
        ` : ''}
        <div id="acm-modal-actions">
          <button type="button" class="btn btn-ghost" id="qr-cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="qr-apply">Add Units</button>
        </div>
      </div>`;
    ROOT.appendChild(overlay);

    overlay.querySelector('#qr-cancel').onclick = () => overlay.remove();
    overlay.querySelector('#qr-apply').onclick = () => {
      const units = ensureUnits(r);
      const existingSet = new Set(units.map(u => String(u.equipNo || '').trim().toUpperCase()).filter(Boolean));
      const toAdd = [];

      const checked = Array.from(overlay.querySelectorAll('.qr-cb:checked')).map(c => c.value);
      if (checked.length > 0) {
        checked.forEach(n => toAdd.push(n));
      } else {
        const fRaw = overlay.querySelector('#qr-from').value.trim();
        const tRaw = overlay.querySelector('#qr-to').value.trim();
        const m1 = fRaw.match(/^(.*?)(\d+)$/);
        const m2 = tRaw.match(/^(.*?)(\d+)$/);
        if (m1 && m2 && m1[1] === m2[1]) {
          const prefix = m1[1];
          const padLen = m1[2].length;
          const s = parseInt(m1[2], 10);
          const e = parseInt(m2[2], 10);
          const step = s <= e ? 1 : -1;
          for (let i = s; step > 0 ? i <= e : i >= e; i += step) {
            toAdd.push(`${prefix}${String(i).padStart(padLen, '0')}`);
          }
        } else if (fRaw) {
          toAdd.push(fRaw);
        }
      }

      let added = 0;
      toAdd.forEach(no => {
        if (existingSet.has(no.toUpperCase())) return;
        const item = (line && EQUIP_DB[line] && EQUIP_DB[line][no]) ? EQUIP_DB[line][no] : '';
        if (units.length === 1 && !(units[0].equipNo || '').trim() && !(units[0].conveyorItem || '').trim()) {
          units[0].equipNo = no;
          units[0].conveyorItem = item;
        } else {
          units.push(blankUnit(no, item));
        }
        existingSet.add(no.toUpperCase());
        added++;
      });

      overlay.remove();
      if (added > 0) {
        ensureUnits(r);
        state.activeUnitIdx = r.units.length - 1;
        state.dirty = true;
        renderInput(container);
      }
    };
  }

        state.activeUnitIdx = 0;
        state.showCleaningBox = false;
        state.dirty = false;
        render();
        return;
      }
      const found = state.records.find(x => String(x.createdAt) === val);
      if (found) {
        state.selectedId = found.createdAt;
        state.draft = JSON.parse(JSON.stringify(found));
        ensureUnits(state.draft);
        state.activeUnitIdx = 0;
        state.showCleaningBox = Boolean(state.draft.units[0]?.cleaningImage);

        render();

      state.dirty = false;
      render();
    });

    container.querySelectorAll('[data-field]').forEach(el => {
      const evName = el.tagName === 'SELECT' ? 'change' : 'input';

      const nextItem = (lineKey && nextNo && EQUIP_DB[lineKey] && EQUIP_DB[lineKey][nextNo]) ? EQUIP_DB[lineKey][nextNo] : '';

      state.dirty = true;

        renderInput(container);
      });

    if (remBtn) {
      remBtn.addEventListener('click', async () => {
        if (r.units.length <= 1) return;
        const ok = await showModal('Remove Unit', `Remove Unit No. "${u.equipNo || state.activeUnitIdx + 1}" from this memo?`, { confirm: true, danger: true, okText: 'Remove' });

        r.units.splice(state.activeUnitIdx, 1);
        state.activeUnitIdx = Math.max(0, state.activeUnitIdx - 1);
        ensureUnits(r);
        state.dirty = true;
        renderInput(container);
      });

    container.querySelectorAll('[data-unit-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeUnitIdx = Number(btn.dataset.unitTab);
        state.showCleaningBox = Boolean(r.units[state.activeUnitIdx]?.cleaningImage);
        renderInput(container);
      });
    });

    // Active Unit No. and Conveyor/Item inputs (update in-place without full re-render so focus stays intact)
    const unitNoInput = container.querySelector('#inp-unit-no');
    const unitItemInput = container.querySelector('#inp-unit-item');

    unitNoInput.addEventListener('input', () => {
      u.equipNo = unitNoInput.value;
      const lineKey = String(r.lineEquipment || '').trim().toUpperCase();
      const noKey = u.equipNo.trim();
      if (lineKey && EQUIP_DB[lineKey] && EQUIP_DB[lineKey][noKey]) {
        u.conveyorItem = EQUIP_DB[lineKey][noKey];
        unitItemInput.value = u.conveyorItem;
      }
      ensureUnits(r);
      state.dirty = true;
      const activePillNo = container.querySelector('.unit-pill.active .unit-pill-no');
      if (activePillNo) activePillNo.textContent = u.equipNo || String(state.activeUnitIdx + 1).padStart(2, '0');
      const banner = container.querySelector('#active-unit-banner-text');
      if (banner) {
        banner.textContent = `Editing Unit ${state.activeUnitIdx + 1} of ${units.length}: ${r.lineEquipment || 'Line'} - ${u.equipNo || '(No. not set)'}`;
      }
    });

    unitItemInput.addEventListener('input', () => {
      u.conveyorItem = unitItemInput.value;
      ensureUnits(r);
      state.dirty = true;
    });

    // Active Unit Category checkboxes
    container.querySelectorAll('[data-ucat2]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (!u.cat2) u.cat2 = {};
        u.cat2[cb.dataset.ucat2] = cb.checked;
        ensureUnits(r);
        state.dirty = true;
      });
    });

    // Reference Image interactions
    container.querySelector('#acm-toggle-cleaning-btn').addEventListener('click', () => {
      state.showCleaningBox = !cleaningVisible;
      renderInput(container);
    });

    const hideCleanBtn = container.querySelector('#btn-hide-cleaning-card');
    if (hideCleanBtn) {
      hideCleanBtn.addEventListener('click', () => {
        state.showCleaningBox = false;
        renderInput(container);
      });
    }

    ['before', 'after', 'cleaning'].forEach(slot => {
      const fileInp = container.querySelector(`#file-ref-${slot}`);
      const camBtn = container.querySelector(`#btn-cam-${slot}`);
      const stage = container.querySelector(`#stage-ref-${slot}`);
      const delBtn = container.querySelector(`#btn-del-${slot}`);

      if (camBtn && fileInp) {
        camBtn.addEventListener('click', () => fileInp.click());
      }
      if (stage) {
        stage.addEventListener('click', () => {
          const curSrc = u[`${slot}Image`];
          if (curSrc) openImageLightbox(curSrc, `${slot.toUpperCase()} — ${r.lineEquipment || ''} ${u.equipNo || ''}`);
          else if (fileInp) fileInp.click();
        });
      }
      if (fileInp) {
        fileInp.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          try {
            const res = await optimizeCameraImage(file, {
              lineEquipment: r.lineEquipment,
              equipNo: u.equipNo,
              label: slot
            });
            u[`${slot}Image`] = res.dataUrl;
            u[`${slot}ImageDate`] = res.dateStr;
            u[`${slot}ImageTime`] = res.timeStr;
            ensureUnits(r);
            state.dirty = true;
            renderInput(container);
          } catch (err) {
            showModal('Photo Error', 'Unable to process camera image.');
          }
        });
      }
      if (delBtn) {
        delBtn.addEventListener('click', () => {
          u[`${slot}Image`] = '';
          u[`${slot}ImageDate`] = '';
          u[`${slot}ImageTime`] = '';
          ensureUnits(r);
          state.dirty = true;
          renderInput(container);
        });
      }
    });

    // Remarks bindings
    container.querySelector('#inp-inspection-method').addEventListener('change', (e) => {
      u.inspectionMethod = e.target.value;
      ensureUnits(r);
      state.dirty = true;
    });

    const taskMenu = container.querySelector('#dd-unit-tasks');
    const taskBtn = container.querySelector('#btn-task-dd');
    if (taskMenu && taskBtn) {
      taskMenu.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          const chosen = Array.from(taskMenu.querySelectorAll('input:checked')).map(x => x.value);
          u.taskPerformed = chosen.join(', ');
          ensureUnits(r);
          state.dirty = true;
          taskBtn.textContent = chosen.length ? chosen.join(', ') : 'Select Task(s)...';
          taskBtn.classList.toggle('placeholder', chosen.length === 0);
        });
      });
    }

    container.querySelector('#inp-reason-detail').addEventListener('input', (e) => {
      u.reasonDetail = e.target.value;
      ensureUnits(r);
      state.dirty = true;
    });

    // Result bindings
    container.querySelectorAll('input[name="unit_result_cat"]').forEach(rad => {
      rad.addEventListener('change', () => {
        if (rad.checked) {
          u.resultCat = rad.value;
          ensureUnits(r);
          state.dirty = true;
        }
      });
    });

    container.querySelectorAll('[data-uparam]').forEach(inp => {
      inp.addEventListener('input', () => {
        u[inp.dataset.uparam] = inp.value;
        ensureUnits(r);
        state.dirty = true;
      });
    });

    container.querySelector('#inp-result-detail').addEventListener('input', (e) => {
      u.resultDetail = e.target.value;
      ensureUnits(r);
      state.dirty = true;
    });

    // Save Draft
    container.querySelector('#acm-draft-btn').addEventListener('click', async () => {
      r.isDraft = true;
      ensureUnits(r);
      const idx = state.records.findIndex(x => String(x.createdAt) === String(r.createdAt));
      if (idx !== -1) state.records[idx] = JSON.parse(JSON.stringify(r));
      else state.records.unshift(JSON.parse(JSON.stringify(r)));
      state.selectedId = r.createdAt;
      state.dirty = false;
      await OfflineDB.set(STORE_KEY, state.records);
      showModal('Draft Saved', `Draft ${r.reportNo} has been saved locally on this device.`);
    });

    // Delete Record
    container.querySelector('#acm-del-btn').addEventListener('click', async () => {
      const ok = await showModal('Delete Record', `Are you sure you want to delete Report No. ${r.reportNo}?`, { confirm: true, danger: true, okText: 'Delete' });
      if (!ok) return;
      const targetId = r.createdAt;
      state.records = state.records.filter(x => String(x.createdAt) !== String(targetId));
      await OfflineDB.set(STORE_KEY, state.records);
      await deleteRecordFromSheet(targetId);
      state.selectedId = null;
      state.draft = blankRecord(state.records);
      state.activeUnitIdx = 0;
      state.dirty = false;
      render();
    });

    // Submit Record
    const handleSubmit = async () => {
      container.querySelectorAll('.err-sec').forEach(el => el.classList.remove('err-sec'));
      const missing = [];
      if (!(r.happeningDate || '').trim()) { missing.push('Date'); container.querySelector('#sec-notif')?.classList.add('err-sec'); }
      if (!(r.issuedBy || '').trim()) { missing.push('Issued By'); container.querySelector('#sec-notif')?.classList.add('err-sec'); }
      if (!(r.title || '').trim()) { missing.push('Title'); container.querySelector('#sec-equip')?.classList.add('err-sec'); }
      if (!(r.lineEquipment || '').trim()) { missing.push('Line/Equipment'); container.querySelector('#sec-equip')?.classList.add('err-sec'); }

      units.forEach((unitItem, idx) => {
        const tag = unitItem.equipNo ? `No. ${unitItem.equipNo}` : `Unit #${idx + 1}`;
        if (!(unitItem.equipNo || '').trim()) missing.push(`${tag}: Equipment No.`);
        if (!(unitItem.inspectionMethod || '').trim()) missing.push(`${tag}: Inspection Method`);
        if (!(unitItem.taskPerformed || '').trim()) missing.push(`${tag}: Task Performed`);
        if (!(unitItem.resultCat || '').trim()) missing.push(`${tag}: Result`);
      });

      if (missing.length > 0) {
        showModal('Required Fields Missing', `Please complete the following before submitting:\n\n• ${missing.join('\n• ')}`);
        return;
      }

      r.isDraft = false;
      ensureUnits(r);
      const copy = JSON.parse(JSON.stringify(r));
      const idx = state.records.findIndex(x => String(x.createdAt) === String(copy.createdAt));
      if (idx !== -1) state.records[idx] = copy;
      else state.records.unshift(copy);

      state.selectedId = copy.createdAt;
      state.dirty = false;
      await OfflineDB.set(STORE_KEY, state.records);

      if (!state.isOnline) {
        copy.pendingSync = true;
        await OfflineDB.set(STORE_KEY, state.records);
        showOfflineSubmitPopup(copy);
        render();
        return;
      }

      const submitBtn = container.querySelector('#acm-submit-btn');
      const submitBtnBottom = container.querySelector('#acm-submit-btn-bottom');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Syncing...'; }
      if (submitBtnBottom) { submitBtnBottom.disabled = true; submitBtnBottom.textContent = 'Syncing...'; }

      const synced = await syncRecordToSheet(copy);
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit ✔'; }
      if (submitBtnBottom) { submitBtnBottom.disabled = false; submitBtnBottom.textContent = 'Submit ✔'; }

      if (synced) {
        showModal('Submitted & Synced', `Report No. ${copy.reportNo} (${units.length} unit${units.length > 1 ? 's' : ''}) has been saved to Google Sheets & Drive.`);
      } else {
        showOfflineSubmitPopup(copy);
      }
      render();
    };

    container.querySelector('#acm-submit-btn').addEventListener('click', handleSubmit);
    container.querySelector('#acm-submit-btn-bottom').addEventListener('click', handleSubmit);

    // View Memo buttons (top & bottom)
    const handleViewMemo = async () => {
      if (state.dirty) {
        const proceed = await showModal('Unsaved Changes', 'You have unsubmitted edits. Preview Memo View with current form entries?', { confirm: true, okText: 'View Memo' });
        if (!proceed) return;
      }
      ensureUnits(r);
      state.tab = 'document';
      render();
    };

    container.querySelector('#acm-view-btn').addEventListener('click', handleViewMemo);
    container.querySelector('#acm-view-btn-bottom').addEventListener('click', handleViewMemo);
  }

  function renderRefImageCard(slot, label, badgeCls, imgSrc, imgDate, imgTime, canHide = false) {

            ${canHide && !imgSrc ? `<button type="button" id="btn-hide-cleaning-card" title="Hide Cleaning box" style="border:none;background:transparent;color:var(--text-sec);font-weight:800;cursor:pointer;padding:0 4px">✕</button>` : ''}
          </div>
        </div>
        <div class="ref-img-stage" id="stage-ref-${slot}">

          <button type="button" class="ref-img-btn cam" id="btn-cam-${slot}">📷 ${imgSrc ? 'Retake' : 'Capture'}</button>

                      <span class="ppm-photo-ts">${escapeHtml(p.ts || '')}</span>
                    </div>
                    <div class="ppm-photo-stage">
                      ${p.src ? `<img src="${escapeHtml(p.src)}" alt="${escapeHtml(p.tag)}"/>` : `<div class="ppm-photo-empty">No photo</div>`}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            `}
          </div>

          <!-- Sign-off & Verification -->
          <div>
            <div class="ppm-sec" style="margin-bottom:4px">
              <div class="ppm-sec-bar"><span><span class="sec-num">${isMulti ? '04' : '05'}</span>Sign-off &amp; Verification</span></div>
              <div class="ppm-sign-grid">
                <div class="ppm-sign-cell">
                  <div class="ppm-sign-name">${escapeHtml(r.doneByName || '')}</div>
                  <div class="ppm-sign-line">Done By ( TECH )</div>
                </div>
                <div class="ppm-sign-cell">
                  <div class="ppm-sign-name">${escapeHtml(r.checkByName || '')}</div>
                  <div class="ppm-sign-line">Check By ( TO )</div>
                </div>
                <div class="ppm-sign-cell">
                  <div class="ppm-sign-name">${escapeHtml(r.confirmedByName || '')}</div>
                  <div class="ppm-sign-line">Confirmed By ( TE / E / SE )</div>
                </div>
              </div>
            </div>
            <div class="ppm-doc-foot">
              <span>**Ensure all required fields &amp; watermarked reference photos are verified prior to sign-off.</span>
              <span class="doc-footer-code">BHS/MP03/PPM/Rev.01</span>
            </div>
          </div>
        </div>
      </div>
    `;

    container.querySelector('#doc-back-btn').addEventListener('click', () => {
      state.tab = 'input';
      render();
    });

    container.querySelector('#doc-print-btn').addEventListener('click', () => {
      window.print();
    });

    container.querySelectorAll('.ppm-photo-stage img').forEach(img => {
      img.addEventListener('click', () => openImageLightbox(img.src, img.alt || 'Reference Image'));
    });

    bindJPEGExport('doc-jpeg-btn', 'ppm-a4-sheet', `PPM_Memo_${(r.reportNo || 'Report').replace(/[^a-zA-Z0-9_-]/g, '_')}`);
  }

  function render() {
    const pendingCount = state.records.filter(r => r.pendingSync).length;
    let netHtml = '';
    if (state.isSyncing) {
      netHtml = `<span class="net-badge net-syncing"><span class="net-dot"></span>Syncing...</span>`;
    } else if (state.isOnline) {
      netHtml = `<span class="net-badge net-online"><span class="net-dot"></span>Online</span>`;
    } else {
      netHtml = `<span class="net-badge net-offline"><span class="net-dot"></span>Offline Mode</span>`;
    }

    const syncBtnHtml = (state.isOnline && pendingCount > 0 && !state.isSyncing)
      ? `<button type="button" class="sync-now-btn" id="btn-sync-now">↻ Sync Now (${pendingCount})</button>`
      : '';

    ROOT.innerHTML = `
      <div class="wrap">
        <div class="topbar">
          <div class="brand">
            <div class="k">K. L. International Airport • Terminal 1</div>
            <div class="t">BHS Maintenance : Planned Preventative Maintenance (PPM)</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div class="net-status-wrap">${netHtml}${syncBtnHtml}</div>
            <div class="tabs">
              <button type="button" class="tab-btn ${state.tab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">Dashboard</button>
              <button type="button" class="tab-btn ${state.tab === 'input' ? 'active' : ''}" data-tab="input">Memo Details</button>
              <button type="button" class="tab-btn ${state.tab === 'document' ? 'active' : ''}" data-tab="document">Memo View</button>
            </div>
          </div>
        </div>
        <div id="acm-main-body"></div>
      </div>
    `;

    ROOT.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const nextTab = btn.dataset.tab;
        if (nextTab === 'input' && !state.draft) {
          state.draft = blankRecord(state.records);
          state.activeUnitIdx = 0;
        }
        state.tab = nextTab;
        render();
      });
    });

    const syncNowBtn = ROOT.querySelector('#btn-sync-now');
    if (syncNowBtn) {
      syncNowBtn.addEventListener('click', () => syncPendingQueue(true));
    }

    const body = ROOT.querySelector('#acm-main-body');
    if (state.tab === 'dashboard') renderDashboard(body);
    else if (state.tab === 'input') renderInput(body);
    else if (state.tab === 'document') renderDocument(body);
  }

  async function init() {
    setupNetworkListeners();
    const cached = await OfflineDB.get(STORE_KEY);
    if (Array.isArray(cached) && cached.length > 0) {
      cached.forEach(ensureUnits);
      state.records = cached;
    }
    state.draft = blankRecord(state.records);
    render();

    if (state.isOnline) {
      await syncPendingQueue(false);
      await fetchCloudRecords(false);
    }
  }

  init();
})();
</script>
</body>
</html>
