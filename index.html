<!DOCTYPE html>
<html lang="en">
<head> 
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BHS Maintenance : Planned Preventative Maintenance (PPM)</title>
<style>
  #acm-root,#acm-root *{box-sizing:border-box}
  #acm-root{--ink:#1f2937;--ink-light:#374151;--paper:#ffffff;--line:#e5e7eb;--line-dark:#9ca3af;--accent:#2563eb;--accent-2:#1d4ed8;--bg:#f3f4f6;--input-bg:#f9fafb;--text-sec:#6b7280;--ok:#059669;--warn:#d97706;--crit:#dc2626;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:0;min-height:100%;font-size:.875rem;line-height:1.4;position:relative}
  .mono-font,#acm-root input[type=date],#acm-root input[type=time],#acm-root .kpi-value,#acm-root .doc-footer-code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  #acm-root .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
  #acm-root .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  #acm-root .brand{display:flex;flex-direction:column;gap:2px}
  #acm-root .brand .k{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sec);font-weight:700}
  #acm-root .brand .t{font-size:1.125rem;font-weight:800;color:var(--ink)}
  #acm-root .tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:10px}
  #acm-root .tab-btn{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .15s}
  #acm-root .tab-btn.active{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  #acm-root .tab-btn:hover:not(.active){color:var(--ink)}
  #acm-root .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .kpi-grid{grid-template-columns:repeat(2,1fr)}}
  #acm-root .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:visible}
  #acm-root .kpi-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
  #acm-root .kpi-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sec);font-weight:700}
  #acm-root .kpi-value{font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1;margin-top:2px}
  #acm-root .kpi-sub{font-size:.75rem;color:var(--text-sec)}
  #acm-root .kpi-pill{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:999px;width:fit-content;margin-top:2px}
  #acm-root .pill-ok{background:#d1fae5;color:var(--ok)}
  #acm-root .pill-warn{background:#fef3c7;color:var(--warn)}
  #acm-root .pill-crit{background:#fee2e2;color:var(--crit)}
  #acm-root .dd-wrapper{position:relative;width:100%;margin-top:4px}
  #acm-root .dd-wrapper.form-dd{margin-top:0}
  #acm-root .dd-btn{width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);font-size:.75rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #acm-root .dd-btn.placeholder{color:var(--text-sec);font-weight:500}
  #acm-root .dd-btn::after{content:"▼";font-size:.55rem;margin-left:6px;color:var(--line-dark);flex-shrink:0}
  #acm-root .dd-menu{display:none;position:absolute;top:100%;left:0;width:100%;max-height:220px;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:7px;z-index:100;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:4px}
  #acm-root .dd-menu.open{display:flex;flex-direction:column;gap:6px}
  #acm-root [data-tooltip]{position:relative;cursor:help}
  #acm-root [data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:6px 10px;border-radius:6px;font-size:.75rem;white-space:nowrap;z-index:100;margin-bottom:8px;pointer-events:none;font-weight:500;text-transform:none;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  #acm-root [data-tooltip]:hover::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#111827;margin-bottom:-2px;pointer-events:none;z-index:100}
  #acm-root .charts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .charts-grid{grid-template-columns:minmax(0,1fr)}}
  #acm-root .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;overflow:hidden}
  #acm-root .panel h3{margin:0 0 10px;font-size:.875rem;font-weight:800;color:var(--ink)}
  #acm-root .panel .hint{font-size:.75rem;color:var(--line-dark);margin-bottom:8px}
  #acm-root .table-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  #acm-root table.list{width:100%;border-collapse:collapse}
  #acm-root table.list th,#acm-root table.editrows th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sec);background-color:var(--input-bg);padding:6px 8px;border-bottom:2px solid var(--line)}
  #acm-root table.list td,#acm-root table.editrows td{font-size:.7rem;color:var(--ink-light);padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  #acm-root table.list tr:hover td{background:var(--input-bg)}
  #acm-root .status-chip{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
  #acm-root .chip-open{background:#e5e7eb;color:var(--text-sec)}
  #acm-root .chip-progress{background:#fef3c7;color:var(--warn)}
  #acm-root .chip-done{background:#d1fae5;color:var(--ok)}
  #acm-root .link-btn{border:none;background:none;color:var(--accent);font-weight:700;font-size:.75rem;cursor:pointer;padding:2px 4px}
  #acm-root .empty-state{text-align:center;padding:34px 10px;color:var(--text-sec);font-size:.875rem}
  #acm-root .form-shell{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px 24px}
  #acm-root .form-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  #acm-root .form-toolbar .rec-select{display:flex;align-items:center;gap:8px;font-size:.875rem}
  #acm-root select.recpick{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;background:var(--input-bg);color:var(--ink);font-family:ui-monospace,monospace}
  #acm-root .btn{border:none;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .btn-primary{background:var(--accent);color:#fff}
  #acm-root .btn-primary:hover{background:var(--accent-2)}
  #acm-root .btn-ghost{background:var(--line);color:var(--ink-light)}
  #acm-root .btn-ghost:hover{background:#d1d5db}
  #acm-root .btn-danger{background:#fee2e2;color:var(--crit)}
  #acm-root .btn-danger:hover{background:#fca5a5}
  #acm-root .btn-solid-danger{background:var(--crit);color:#fff}
  #acm-root .btn-solid-danger:hover{background:#b91c1c}
  #acm-root .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  #acm-root .form-bottom-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  #acm-root .form-bottom-hint{font-size:.75rem;color:var(--text-sec)}
  #acm-root .form-bottom-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
  #acm-root .btn-submit-bottom{background:linear-gradient(135deg,#059669 0%,#047857 100%);color:#fff;padding:10px 22px;font-size:.9rem;border-radius:10px;box-shadow:0 4px 12px rgba(5,150,105,.25);display:inline-flex;align-items:center;gap:6px}
  #acm-root .btn-submit-bottom:hover{background:linear-gradient(135deg,#047857 0%,#065f46 100%);box-shadow:0 6px 16px rgba(5,150,105,.32);transform:translateY(-1px)}
  #acm-root .btn-submit-bottom:active{transform:translateY(0)}
  #acm-root .btn-export-excel{background-color:var(--ok);color:#ffffff;font-size:.875rem;font-weight:700;padding:8px 16px;border-radius:4px;border:none;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.05);display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
  #acm-root .btn-export-excel:hover{background-color:#047857}
  #acm-root .btn-export-excel svg{width:16px;height:16px}
  #acm-root .sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;transition:all .2s}
  #acm-root .sec>.sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
  #acm-root .grid{display:grid;gap:10px}
  #acm-root .g2{grid-template-columns:1fr 1fr}
  #acm-root .g3{grid-template-columns:1fr 1fr 1fr}
  #acm-root .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  #acm-root .g5{grid-template-columns:repeat(5,1fr)}
  #acm-root .g6{grid-template-columns:repeat(6,1fr)}
  @media (max-width:720px){#acm-root .g2,#acm-root .g3,#acm-root .g4,#acm-root .g5,#acm-root .g6{grid-template-columns:1fr}}
  #acm-root label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--ink-light);font-weight:600}
  #acm-root input[type=text],#acm-root input[type=date],#acm-root input[type=time],#acm-root input[type=number],#acm-root textarea,#acm-root select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;font-family:inherit;color:var(--ink);background:var(--input-bg);transition:all .2s}
  #acm-root select[multiple]{padding:4px 6px}
  #acm-root textarea{resize:vertical;min-height:54px}
  #acm-root .check-row,#acm-root .radio-row{display:flex;flex-wrap:wrap;gap:12px}
  #acm-root .chk,#acm-root .rad{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--ink-light);cursor:pointer}
  #acm-root .chk input,#acm-root .rad input{width:15px;height:15px;accent-color:var(--accent)}
  #acm-root table.editrows{width:100%;border-collapse:collapse;margin-top:6px}
  #acm-root table.editrows input{width:100%;font-size:.75rem}
  #acm-root .err-highlight,#acm-root .err-sec{border:1px solid var(--crit)!important;background-color:#fef2f2!important;box-shadow:0 0 0 1px var(--crit)}
  #acm-root #acm-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,24,39,.7);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)}
  #acm-root #acm-modal-overlay.active{opacity:1;pointer-events:auto}
  #acm-root #acm-modal-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:90%;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,.18);transform:translateY(12px);transition:transform .2s ease}
  #acm-root #acm-modal-overlay.active #acm-modal-box{transform:translateY(0)}
  #acm-root #acm-modal-title{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:8px}
  #acm-root #acm-modal-msg{font-size:.875rem;color:var(--ink-light);margin-bottom:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  #acm-root #acm-modal-input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px;font-size:.875rem;font-family:inherit;color:var(--ink);background:var(--input-bg);outline:none;display:none}
  #acm-root #acm-modal-input:focus{border-color:var(--accent)}
  #acm-root #acm-modal-actions{display:flex;justify-content:flex-end;gap:8px}
  #acm-root .doc-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  #acm-root .doc-scroll{overflow-x:auto;overflow-y:auto;background:#cbd5e1;padding:24px 14px;border-radius:12px;max-height:calc(100vh - 140px)}
  #acm-root .doc-page{width:794px;min-height:1085px;margin:0 auto;background:#ffffff;padding:24px 28px 22px;font-family:Arial,Helvetica,sans-serif;color:#0f172a;font-size:11px;box-shadow:0 6px 24px rgba(15,23,42,.18);display:flex;flex-direction:column;justify-content:space-between;border-radius:2px}
  #acm-root .doc-page table{border-collapse:collapse;width:100%;table-layout:fixed}
  #acm-root .doc-page td,#acm-root .doc-page th{border:1px solid #334155;padding:4px 7px;vertical-align:middle;font-size:10.5px;color:#0f172a}
  #acm-root .ppm-doc-top{display:flex;justify-content:space-between;align-items:stretch;gap:14px;padding-bottom:10px;border-bottom:2px solid #0f172a;margin-bottom:10px}
  #acm-root .ppm-doc-brand{flex:1;display:flex;flex-direction:column;justify-content:center}
  #acm-root .doc-header-title{font-size:17px;font-weight:800;letter-spacing:.02em;color:#0f172a;margin:0;text-transform:uppercase}
  #acm-root .doc-header-sub{font-size:11.5px;font-weight:700;color:#334155;margin:2px 0 6px}
  #acm-root .doc-memo-title{font-size:12.5px;font-weight:800;font-style:italic;color:#1e3a8a;margin:0 0 6px}
  #acm-root .ppm-doc-status-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #acm-root .ppm-doc-ctrl{width:272px;flex-shrink:0}
  #acm-root .ppm-doc-ctrl td{padding:3.5px 7px;font-size:10px}
  #acm-root .ppm-doc-ctrl .ctrl-lbl{width:44%;background:#f1f5f9;font-weight:700;color:#1e293b}
  #acm-root .ppm-doc-ctrl .ctrl-val{font-weight:700;text-align:center}
  #acm-root .ppm-sec{margin-bottom:9px}
  #acm-root .ppm-sec-bar{background:#f1f5f9;border:1px solid #334155;border-bottom:none;padding:4px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#0f172a;display:flex;align-items:center;justify-content:space-between}
  #acm-root .ppm-sec-bar span.sec-num{color:#1d4ed8;margin-right:5px}
  #acm-root .ppm-lbl{background:#f8fafc;font-weight:700;color:#334155;font-size:10px;white-space:nowrap}
  #acm-root .ppm-val{font-weight:600;color:#0f172a;word-break:break-word}
  #acm-root .ppm-chk-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:2px 0}
  #acm-root .ppm-chk-item{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#1e293b}
  #acm-root .ppm-chk-item.checked{font-weight:800;color:#0f172a}
  #acm-root .doc-checkbox{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1.2px solid #0f172a;font-size:9.5px;font-weight:900;line-height:1;background:#fff;color:#0f172a}
  #acm-root .ppm-chk-item.checked .doc-checkbox{background:#dbeafe;border-color:#1e3a8a;color:#1e3a8a}
  #acm-root .ppm-photo-grid{display:grid;gap:8px;border:1px solid #334155;padding:7px;background:#ffffff}
  #acm-root .ppm-photo-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  #acm-root .ppm-photo-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  #acm-root .ppm-photo-box{border:1px solid #94a3b8;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;background:#f8fafc}
  #acm-root .ppm-photo-head{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 7px;background:#f1f5f9;border-bottom:1px solid #cbd5e1;font-size:9.5px}
  #acm-root .ppm-photo-tag{font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:999px;font-size:8.5px}
  #acm-root .ppm-tag-before{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  #acm-root .ppm-tag-cleaning{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}
  #acm-root .ppm-tag-after{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
  #acm-root .ppm-photo-ts{font-size:8.5px;color:#475569;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:nowrap}
  #acm-root .ppm-photo-stage{height:198px;display:flex;align-items:center;justify-content:center;background:#f8fafc;overflow:hidden;position:relative}
  #acm-root .ppm-photo-grid.cols-3 .ppm-photo-stage{height:182px}
  #acm-root .ppm-photo-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;cursor:zoom-in}
  #acm-root .ppm-photo-empty{font-size:9.5px;color:#94a3b8;font-style:italic;text-align:center;padding:12px}
  #acm-root .ppm-notes-box{min-height:58px;white-space:pre-wrap;line-height:1.42;font-size:10.5px;color:#0f172a;vertical-align:top}
  #acm-root .ppm-sign-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #334155}
  #acm-root .ppm-sign-cell{padding:8px 10px 6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:70px;border-right:1px solid #334155;text-align:center}
  #acm-root .ppm-sign-cell:last-child{border-right:none}
  #acm-root .ppm-sign-name{font-size:11.5px;font-weight:800;color:#0f172a;min-height:18px;display:flex;align-items:center;gap:4px;margin-bottom:4px}
  #acm-root .ppm-sign-line{width:92%;border-top:1px solid #0f172a;padding-top:3px;font-size:9.5px;font-weight:700;color:#334155}
  #acm-root .ppm-doc-foot{display:flex;justify-content:space-between;align-items:center;padding-top:5px;border-top:1px solid #cbd5e1;font-size:9px;color:#475569;margin-top:2px}
  #acm-root .doc-footer-code{font-size:9.5px;font-weight:700;color:#1e293b;margin:0}
  #acm-root .unit-bar-wrap{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  #acm-root .unit-bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  #acm-root .unit-bar-title{font-size:.75rem;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
  #acm-root .unit-count-pill{background:#dbeafe;color:var(--accent-2);font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px}
  #acm-root .unit-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #acm-root .unit-act-btn{border:1px solid var(--line);background:var(--input-bg);color:var(--ink-light);padding:4px 10px;border-radius:7px;font-size:.72rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
  #acm-root .unit-act-btn:hover{background:var(--line);color:var(--ink)}
  #acm-root .unit-act-btn.primary{background:#eff6ff;border-color:#93c5fd;color:var(--accent-2)}
  #acm-root .unit-act-btn.primary:hover{background:#dbeafe}
  #acm-root .unit-act-btn.danger{background:#fef2f2;border-color:#fecaca;color:var(--crit)}
  #acm-root .unit-act-btn.danger:hover{background:#fee2e2}
  #acm-root .unit-tabs-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  #acm-root .unit-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--input-bg);color:var(--ink-light);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .unit-pill:hover{border-color:#94a3b8;background:#f1f5f9}
  #acm-root .unit-pill.active{border-color:var(--accent);background:#eff6ff;color:var(--accent-2);box-shadow:0 2px 6px rgba(37,99,235,.15)}
  #acm-root .unit-pill.complete:not(.active){border-color:#a7f3d0;background:#ecfdf5;color:#065f46}
  #acm-root .unit-pill-sub{font-size:.66rem;font-weight:600;opacity:.8;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #acm-root .unit-active-card{background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px}
  #acm-root .unit-active-banner{font-size:.72rem;font-weight:800;color:var(--accent-2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

  const OfflineDB = {
    dbPromise: null,
    open() {
      if (this.dbPromise) return this.dbPromise;
      this.dbPromise = new Promise((resolve) => {
        try {
          if (typeof indexedDB === 'undefined') return resolve(null);
          const req = indexedDB.open('bhs_ppm_offline_vault', 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'createdAt' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
      return this.dbPromise;
    },
    async getAllRecords() {
      const db = await this.open();
      if (!db) return [];
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('records', 'readonly');
          const req = tx.objectStore('records').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        } catch (e) { resolve([]); }
      });
    },
    async saveAllRecords(records) {
      const db = await this.open();
      if (!db) return;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('records', 'readwrite');
          const store = tx.objectStore('records');
          store.clear();
          (records || []).forEach(r => store.put(r));
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch (e) { resolve(false); }
      });
    },
    async getMeta(key) {
      const db = await this.open();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('meta', 'readonly');
          const req = tx.objectStore('meta').get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : null);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    },
    async setMeta(key, value) {
      const db = await this.open();
      if (!db) return;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('meta', 'readwrite');
          tx.objectStore('meta').put({ key, value });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch (e) { resolve(false); }
      });
    }
  };

  function showModal(title, message, mode = 'alert', isError = false) {
    return new Promise((resolve) => {
      let overlay = document.getElementById('acm-modal-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'acm-modal-overlay';
        overlay.innerHTML = `<div id="acm-modal-box"><div id="acm-modal-title"></div><div id="acm-modal-msg"></div><input type="password" id="acm-modal-input" autocomplete="new-password"/><div id="acm-modal-actions"></div></div>`;
      }
      if (overlay.parentNode !== ROOT) ROOT.appendChild(overlay);
      const titleEl = overlay.querySelector('#acm-modal-title');
      const msgEl = overlay.querySelector('#acm-modal-msg');
      const inputEl = overlay.querySelector('#acm-modal-input');
      const actionsEl = overlay.querySelector('#acm-modal-actions');

      titleEl.textContent = title;
      titleEl.style.color = isError ? 'var(--crit)' : 'var(--ink)';
      if (String(mode).startsWith('offline-')) {
        msgEl.style.whiteSpace = 'normal';
        msgEl.innerHTML = message;
      } else {
        msgEl.style.whiteSpace = 'pre-wrap';
        msgEl.textContent = message;
      }

      inputEl.value = '';
      inputEl.style.display = mode === 'prompt' ? 'block' : 'none';
      actionsEl.innerHTML = '';

      const close = (val) => {
        overlay.classList.remove('active');
        resolve(val);
      };

      if (mode === 'confirm' || mode === 'unsaved') {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn btn-ghost';
        cancelBtn.textContent = mode === 'unsaved' ? 'Keep Editing' : 'Cancel';
        cancelBtn.onclick = () => close(false);

        const okBtn = document.createElement('button');
        okBtn.className = mode === 'unsaved' ? 'btn btn-solid-danger' : 'btn btn-primary';
        okBtn.textContent = mode === 'unsaved' ? 'Discard Data' : 'Confirm';
        okBtn.onclick = () => close(true);

        actionsEl.appendChild(cancelBtn);
        actionsEl.appendChild(okBtn);
      } else if (mode === 'prompt') {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn btn-ghost';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = () => close(null);

        const okBtn = document.createElement('button');
        okBtn.className = 'btn btn-primary';
        okBtn.textContent = 'Verify';
        okBtn.onclick = () => close(inputEl.value);

        inputEl.onkeydown = (e) => { if (e.key === 'Enter') close(inputEl.value); };
        actionsEl.appendChild(cancelBtn);
        actionsEl.appendChild(okBtn);
      } else {
        const okBtn = document.createElement('button');
        okBtn.className = 'btn btn-primary';
        okBtn.textContent = 'OK';
        okBtn.onclick = () => close(true);
        actionsEl.appendChild(okBtn);
      }

      void overlay.offsetWidth;
      overlay.classList.add('active');
      if (mode === 'prompt') setTimeout(() => inputEl.focus(), 50);
    });
  }

  function postPayloadWithTimeout(payloadObj, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      if (!navigator.onLine) {
        return reject(new Error('Device is offline'));
      }
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => {
        if (controller) controller.abort();
        reject(new Error('Request timed out'));
      }, timeoutMs);

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams({ payload: JSON.stringify(payloadObj) }),
        signal: controller ? controller.signal : undefined
      })
        .then(() => {
          clearTimeout(timer);
          resolve(true);
        })
        .catch((err) => {
          clearTimeout(timer);
          reject(err);
        });
    });
  }

  function fetchCloudRecords() {

    script.id = 'ppm-sheets-sync';

  async function syncOfflineQueue(manualTrigger = false, notifyOnComplete = false) {
    if (state.isSyncing) return;
    if (!navigator.onLine) {
      state.isOnline = false;
      updateNetworkBadge();
      if (manualTrigger) {
        await showModal("Offline", "No internet connection detected. Your records remain safely stored offline and will sync automatically once internet is available.", "alert");
      }
      return;
    }

    const pendingDeletes = [...(state.deleteQueue || [])];
    const pendingRecords = state.records.filter(r => !r.isDraft && r.syncPending);

    if (pendingDeletes.length === 0 && pendingRecords.length === 0) {
      updateNetworkBadge();
      return;
    }

    state.isSyncing = true;
    updateNetworkBadge();
    let syncedRecordsCount = 0;
    let syncedDeletesCount = 0;

    try {
      for (const delItem of pendingDeletes) {
        await postPayloadWithTimeout({ action: 'delete', createdAt: delItem.createdAt }, 12000);
        state.deleteQueue = state.deleteQueue.filter(x => String(x.createdAt) !== String(delItem.createdAt));
        await saveDeleteQueue();
        syncedDeletesCount++;
      }

      for (const rec of pendingRecords) {
        const payload = { ...rec, syncPending: false };
        await postPayloadWithTimeout(payload, 25000);
        rec.syncPending = false;
        syncedRecordsCount++;
      }

      if (syncedRecordsCount > 0) {
        await saveRecords();
      }

      setTimeout(() => {
        fetchCloudRecords();
      }, 1500);

      if (notifyOnComplete && (syncedRecordsCount > 0 || syncedDeletesCount > 0)) {
        const syncHtml = `
          <div class="modal-offline-banner synced">
            <div class="modal-offline-icon">☁️</div>
            <div>Internet Restored — Offline Records Synced!</div>
          </div>
          <div>Your queued offline PPM records and reference images have been pushed to <b>Google Sheets</b> and <b>Google Drive</b>.</div>
          <div class="modal-offline-details">
            <div class="modal-offline-row"><span>Records Uploaded:</span><span>${syncedRecordsCount} memo(s)</span></div>
            ${syncedDeletesCount > 0 ? `<div class="modal-offline-row"><span>Deletions Synced:</span><span>${syncedDeletesCount} record(s)</span></div>` : ''}
            <div class="modal-offline-row"><span>Cloud Status:</span><span>Up to date</span></div>
          </div>
        `;
        await showModal("Cloud Sync Complete", syncHtml, "offline-synced");
      }
    } catch (err) {
      console.warn('Offline queue sync paused due to network interruption:', err);
    } finally {
      state.isSyncing = false;
      updateNetworkBadge();
    }
  }

  async function loadRecords() {
    try {
      const idbRecords = await OfflineDB.getAllRecords();
      if (Array.isArray(idbRecords) && idbRecords.length > 0) {
        state.records = idbRecords;
      } else {
        if (window.storage) {
          const res = await window.storage.get(STORE_KEY, false);
          if (res && res.value) state.records = JSON.parse(res.value);
        } else if (window.localStorage) {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) state.records = JSON.parse(raw);
        }
        if (state.records.length > 0) {
          await OfflineDB.saveAllRecords(state.records);
        }
      }

      const idbDel = await OfflineDB.getMeta(DELETE_QUEUE_KEY);
      if (Array.isArray(idbDel)) {
        state.deleteQueue = idbDel;
      } else if (window.localStorage) {
        const rawDel = localStorage.getItem(DELETE_QUEUE_KEY);
        if (rawDel) state.deleteQueue = JSON.parse(rawDel);
      }
    } catch (e) {
      state.records = [];
    }

    if (state.deleteQueue.length > 0) {
      const delSet = new Set(state.deleteQueue.map(d => String(d.createdAt)));
      state.records = state.records.filter(r => !delSet.has(String(r.createdAt)));
    }

    state.records.sort((a, b) => b.createdAt - a.createdAt);
    const initialValid = state.records.filter(r => !r.isDraft || String(r.createdAt) === String(state.activeId));
    if (initialValid.length > 0 && !state.activeId) state.activeId = initialValid[0].createdAt;
    state.loaded = true;
    render();

    window.syncGoogleSheets = function(googleData) {
      if (!Array.isArray(googleData)) return;
      state.isOnline = true;
      const cleanDate = iso => { if (!iso || typeof iso !== 'string' || !iso.includes('T')) return iso; const d = new Date(iso); if (isNaN(d)) return iso; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      const cleanTime = iso => (!iso || typeof iso !== 'string' || !iso.includes('T')) ? iso : new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      const delSet = new Set((state.deleteQueue || []).map(d => String(d.createdAt)));

      let validData = [];
      googleData.forEach(g => {
        if (!g.createdAt || String(g.createdAt).trim() === '') return;
        if (delSet.has(String(g.createdAt))) return;
        g.happeningDate = cleanDate(g.happeningDate); g.actionDate = cleanDate(g.actionDate); g.spRequestDate = cleanDate(g.spRequestDate); g.spDeliveryDate = cleanDate(g.spDeliveryDate);
        g.timeOfHappening = cleanTime(g.timeOfHappening); g.actStartTime = cleanTime(g.actStartTime); g.actEndTime = cleanTime(g.actEndTime);
        if (g.monitoring) g.monitoring.forEach(m => { m.d1 = cleanDate(m.d1); m.d2 = cleanDate(m.d2); });
        if (g.history) g.history.forEach(h => h.date = cleanDate(h.date));
        g.syncPending = false;
        validData.push(g);
      });

      const drafts = state.records.filter(r => r.isDraft);
      const cloudMap = new Map(validData.map(g => [String(g.createdAt), g]));
      const localPendingOrOffline = state.records.filter(r => !r.isDraft && !cloudMap.has(String(r.createdAt)));

      validData = validData.map(cloudRec => {
        const localMatch = state.records.find(r => String(r.createdAt) === String(cloudRec.createdAt));
        if (localMatch) {
          if (!cloudRec.beforeImage && localMatch.beforeImage) cloudRec.beforeImage = localMatch.beforeImage;
          if (!cloudRec.cleaningImage && localMatch.cleaningImage) cloudRec.cleaningImage = localMatch.cleaningImage;
          if (!cloudRec.afterImage && localMatch.afterImage) cloudRec.afterImage = localMatch.afterImage;
          if ((!Array.isArray(cloudRec.units) || cloudRec.units.length === 0) && Array.isArray(localMatch.units)) {
            cloudRec.units = localMatch.units;
          }
        }
        normalizeRecordUnits(cloudRec);
        syncParentFromUnits(cloudRec);
        return cloudRec;
      });

      state.records.forEach(rec => { normalizeRecordUnits(rec); syncParentFromUnits(rec); });
      state.records = [...drafts, ...localPendingOrOffline, ...validData].sort((a,b) => b.createdAt - a.createdAt);
      saveRecords();
      state.loaded = true;

      const validOrActive = state.records.filter(r => !r.isDraft || String(r.createdAt) === String(state.activeId));
      if (validOrActive.length > 0 && !state.activeId) state.activeId = validOrActive[0].createdAt;

      if (state.tab === 'input' && state.isDirty) {
        updateNetworkBadge();
      } else {
        render();
      }
    };

    if (navigator.onLine) {
      await syncOfflineQueue(false, false);
      fetchCloudRecords();
    } else {
      await notifyOfflineEntry(false);
    }
  }

  async function saveRecords() {

  function getNextReportNo() {
    const prefix = `${String(new Date().getFullYear()).slice(-2)}${String(new Date().getMonth() + 1).padStart(2, '0')}-`;
    let max = 0;
    state.records.forEach(rec => { if (rec.reportNo && rec.reportNo.startsWith(prefix)) { const num = parseInt(rec.reportNo.split('-')[1], 10); if (!isNaN(num) && num > max) max = num; } });

  function fmtDate(r) { if (r.happeningDate) { const p = String(r.happeningDate).substring(0, 10).split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0].slice(-2)}`; } return (!r.dd && !r.mm && !r.yy) ? '—' : `${(r.dd||'--').padStart(2,'0')}/${(r.mm||'--').padStart(2,'0')}/${r.yy||'--'}`; }
  function getTs(iso) { if (iso && typeof iso === 'string') { const p = iso.split('-'); if (p.length === 3) return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])).getTime(); } return null; }
  function getOldTs(dd, mm, yy) { return (!dd || !mm || !yy) ? null : new Date(parseInt(yy.length === 2 ? ('20' + yy) : yy), parseInt(mm)-1, parseInt(dd)).getTime(); }
  function getExactTs(dateStr, oldDd, oldMm, oldYy, timeStr) {
    let t = getTs(dateStr) || getOldTs(oldDd, oldMm, oldYy);
    if (t && timeStr && typeof timeStr === 'string') { const parts = timeStr.split(':'); if (parts.length >= 2) t += ((parseInt(parts[0], 10) || 0) * 3600000) + ((parseInt(parts[1], 10) || 0) * 60000); }
    return t;
  }
  function parseRefDateTime(dStr, tStr) {
    if (!dStr || typeof dStr !== 'string') return null;
    const p = dStr.split('/');
    if (p.length !== 3) return null;
    let t = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10)).getTime();
    if (isNaN(t)) return null;
    if (tStr && typeof tStr === 'string') {
      const tp = tStr.split(':');
      if (tp.length >= 2) t += ((parseInt(tp[0], 10) || 0) * 3600000) + ((parseInt(tp[1], 10) || 0) * 60000);
    }
    return t;
  }

  function getStatus(r) {
    const units = normalizeRecordUnits(r);
    const allUnitsHaveCore = units.every(u =>
      checkReq(u.inspectionMethod) &&
      parseMultiList(u.taskPerformed).length > 0 &&
      checkReq(u.resultCat)
    );
    const anyUnitProgress = units.some(u =>
      parseMultiList(u.taskPerformed).length > 0 ||
      checkReq(u.resultCat) ||
      checkReq(u.afterImage)
    );
    const doneValid = (r.doneByName || '').trim().length >= 3;
    const checkValid = (r.checkByName || '').trim().length >= 3;
    const confirmValid = checkReq(r.confirmedByName);
    if (allUnitsHaveCore && doneValid && checkValid && confirmValid) return 'done';
    return (anyUnitProgress || (doneValid && checkValid) || confirmValid) ? 'progress' : 'open';
  }

  function getStatusLabel(r, st) {
    if (st === 'done') return 'Completed';
    if (st === 'progress') {
      const units = normalizeRecordUnits(r);
      const allUnitsHaveCore = units.every(u =>
        checkReq(u.inspectionMethod) &&
        parseMultiList(u.taskPerformed).length > 0 &&
        checkReq(u.resultCat)
      );
      const doneValid = (r.doneByName || '').trim().length >= 3;
      const checkValid = (r.checkByName || '').trim().length >= 3;
      const confirmValid = checkReq(r.confirmedByName);
      if (allUnitsHaveCore && doneValid && checkValid && !confirmValid) {
        return 'In progress - Confirmed By (pending)';
      }
      return 'In progress';
    }
    return 'Open';
  }

  function getFilteredDashboardRecords() {

    const getSel = n => Array.from(document.querySelectorAll(`input[name="${n}"]:checked`)).map(cb => cb.value);
    const selInsp = getSel('dash-insp'), selCat = getSel('dash-cat'), selStat = getSel('dash-status');
    const lineQ = (document.getElementById('dash-line')?.value || '').toLowerCase(), convQ = (document.getElementById('dash-conveyor')?.value || '').toLowerCase();
    const startTs = sDate ? getTs(sDate) : 0, endTs = eDate ? (getTs(eDate) + 86400000) : Infinity;
    return state.records.filter(r => !r.isDraft).filter(r => {
      const units = normalizeRecordUnits(r);
      const t = getTs(r.happeningDate) || getOldTs(r.dd, r.mm, r.yy);
      if ((sDate || eDate) && (!t || t < startTs || t >= endTs)) return false;
      if (selInsp.length && !units.some(u => selInsp.includes(u.inspectionMethod || ''))) return false;
      if (selStat.length && !selStat.includes(getStatus(r))) return false;
      if (selCat.length && !selCat.some(c => (r.cat1 && r.cat1[c]) || units.some(u => u.cat2 && u.cat2[c]))) return false;
      if (lineQ && !units.some(u => ((r.lineEquipment||'') + '-' + (u.equipNo||'')).toLowerCase().includes(lineQ))) return false;
      if (convQ && !units.some(u => (u.conveyorItem || '').toLowerCase().includes(convQ))) return false;
      return true;
    });
  }

  function computeKPIs(activeRecs) {
    activeRecs = activeRecs || state.records.filter(r => !r.isDraft);
    const open = activeRecs.filter(r => getStatus(r) !== 'done'), completed = activeRecs.filter(r => getStatus(r) === 'done');
    let resTimes = [], catCounts = {}, inspCounts = {}, ratedTotal = 0, onTime = 0;
    Object.keys(CATS2).forEach(k => catCounts[CATS2[k]] = 0);
    INSPECTION_METHODS.forEach(m => inspCounts[m] = 0);
    activeRecs.forEach(r => {
      const units = normalizeRecordUnits(r);
      units.forEach(u => {
        if(u.cat2) Object.keys(CATS2).forEach(k => { if(u.cat2[k]) catCounts[CATS2[k]]++; });
        const im = (u.inspectionMethod || '').trim();
        if(im) inspCounts[im] = (inspCounts[im] || 0) + 1;
      });
    });
    completed.forEach(r => {
      const units = normalizeRecordUnits(r);
      const lastAfter = units.slice().reverse().find(u => u.afterImageDate);
      const t0 = getExactTs(r.happeningDate, r.dd, r.mm, r.yy, r.timeOfHappening);
      const t1 = getExactTs(r.actionDate, r.actDd, r.actMm, r.actYy, r.actEndTime) || (lastAfter ? parseRefDateTime(lastAfter.afterImageDate, lastAfter.afterImageTime) : null);
      if(t0 && t1 && t1 >= t0) resTimes.push((t1 - t0) / 86400000); 
      if(t0 && t1 && URGENCY_MS[r.urgency]) { ratedTotal++; if((t1 - t0) <= URGENCY_MS[r.urgency]) onTime++; }
    });
    let topCat = null, topCatCount = 0;
    Object.entries(catCounts).forEach(([k,v]) => { if(v > topCatCount) { topCat = k; topCatCount = v; } });
    let topInsp = null, topInspCount = 0;
    Object.entries(inspCounts).forEach(([k,v]) => { if(v > topInspCount) { topInsp = k; topInspCount = v; } });
    return { total: activeRecs.length, openCount: open.length, completedCount: completed.length, avgRes: resTimes.length ? (resTimes.reduce((a,b)=>a+b,0)/resTimes.length) : null, topInsp, topInspCount, topCat, topCatCount, onTimeRate: ratedTotal ? Math.round((onTime/ratedTotal)*100) : null, catCounts };
  }

  function setupDropdownFilters(wrapperId, defaultText = 'All') {
    const wrapper = document.getElementById(wrapperId);
    if (!wrapper) return;
    const btn = wrapper.querySelector('.dd-btn');
    const menu = wrapper.querySelector('.dd-menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menu.classList.contains('open');
      document.querySelectorAll('.dd-menu').forEach(m => m.classList.remove('open'));
      if (!isOpen) menu.classList.add('open');
    });
    menu.addEventListener('click', (e) => e.stopPropagation());
    const checkboxes = menu.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const checked = Array.from(checkboxes).filter(c => c.checked);
        if (checked.length === 0) btn.textContent = defaultText;
        else if (checked.length === 1) btn.textContent = checked[0].nextElementSibling?.textContent?.trim() || checked[0].value;
        else btn.textContent = `${checked.length} selected`;
        updateDashboardUI();
      });
    });
  }

  function bindJPEGExport(btnId, filename, targetId = null) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('click', () => {
      if (typeof html2canvas === 'undefined') {
        showModal("Notice", "Export library is still loading. Please try again in a moment.", "alert");
        return;
      }
      const target = targetId ? document.getElementById(targetId) : btn.closest('.panel');
      if (!target) return;
      const hideEls = target.querySelectorAll('.export-chart-btn, .fv-toolbar-actions');
      hideEls.forEach(el => { el.style.visibility = 'hidden'; });
      html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(canvas => {
        hideEls.forEach(el => { el.style.visibility = ''; });
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }).catch(() => {
        hideEls.forEach(el => { el.style.visibility = ''; });
        showModal("Export Error", "Unable to export chart image.", "alert", true);
      });
    });
  }

  function applyTimelineFilters(chartInstance, containerId) {
      if(!chartInstance) return;
      const vD = chartInstance.isDatasetVisible(0);
      const vP = chartInstance.isDatasetVisible(1);
      const vO = chartInstance.isDatasetVisible(2);
      
      const mD = chartInstance.data._masterDone || [];
      const mP = chartInstance.data._masterProg || [];
      const mO = chartInstance.data._masterOpen || [];
      const mL = chartInstance.data._masterLabels || [];
      
      const vL = mL.filter(lbl => 
          (vD && mD.some(d => d.y === lbl)) || 
          (vP && mP.some(d => d.y === lbl)) || 
          (vO && mO.some(d => d.y === lbl))
      );
      
      chartInstance.data.labels = vL;
      chartInstance.data.datasets[0].data = vD ? mD.filter(d => vL.includes(d.y)) : [];
      chartInstance.data.datasets[1].data = vP ? mP.filter(d => vL.includes(d.y)) : [];
      chartInstance.data.datasets[2].data = vO ? mO.filter(d => vL.includes(d.y)) : [];
      
      const cContainer = document.getElementById(containerId);
      if(cContainer) {
          const availableHeight = cContainer.clientHeight;
          const maxVisible = Math.max(1, Math.floor((availableHeight - 40) / 35));
          chartInstance.options.scales.y.min = 0;
          chartInstance.options.scales.y.max = Math.min(vL.length - 1, maxVisible - 1);
      }
      chartInstance.update();
  }

      let globalMinT = nowTs, globalMaxT = nowTs;
      
      const doneBg = 'rgba(5, 150, 105, 0.45)', doneBc = 'rgba(5, 150, 105, 1)';
      const progBg = 'rgba(217, 119, 6, 0.45)', progBc = 'rgba(217, 119, 6, 1)';

      timelineFiltered.forEach(r => {

      timelineFiltered.forEach(r => {

        let t1 = getExactTs(r.actionDate, r.actDd, r.actMm, r.actYy, r.actEndTime) || parseRefDateTime(r.afterImageDate, r.afterImageTime);
        let statusLogic = getStatus(r);
        
        if (statusLogic !== 'done' || !t1 || isNaN(t1)) t1 = nowTs;
        
        let endOfAction = t1;
        let hasValidActionSegment = false;
        
        if (tAction && !isNaN(tAction) && statusLogic !== 'open') {
           if (tAction > t0) {
              hasValidActionSegment = true;
              endOfAction = Math.max(t1, tAction + 3600000);
           } else {
              endOfAction = Math.max(t1, t0 + 3600000);
           }
        } else if (statusLogic !== 'open') {
           endOfAction = Math.max(t1, t0 + 3600000);
        } else {
           endOfAction = nowTs;
        }
        
        let totalX = [t0, endOfAction];
        let targetT = t0 + (URGENCY_MS[r.urgency] || 0);
        if (endOfAction > globalMaxT) globalMaxT = endOfAction;
        if (targetT > globalMaxT) globalMaxT = targetT;
        
        let labelStr = r.reportNo || 'Draft'; while (tlLabels.includes(labelStr)) labelStr += '\u200B';

        const dsTarget = statusLogic === 'done' ? dsDone : (statusLogic === 'progress' ? dsProg : dsOpen);

        if (statusLogic === 'open') {
            dsTarget.push({ x: [t0, endOfAction], y: labelStr, _r: r, _totalX: totalX, _bg: 'transparent', _bc: 'transparent', _isOpenLine: true, _t0: t0, _t1: endOfAction });
        } else if (hasValidActionSegment) {
            dsTarget.push({ x: [t0, tAction], y: labelStr, _r: r, _totalX: totalX, _bg: 'transparent', _bc: 'transparent', _isOpenLine: true, _t0: t0, _t1: tAction });
            dsTarget.push({ x: [tAction, endOfAction], y: labelStr, _r: r, _totalX: totalX, _bg: activeBg, _bc: activeBc, _isActionBox: true });
        } else {
            dsTarget.push({ x: [t0, endOfAction], y: labelStr, _r: r, _totalX: totalX, _bg: activeBg, _bc: activeBc, _isActionBox: true });
        }
      });
      
      timelineChart.data._masterLabels = tlLabels; timelineChart.data._masterDone = dsDone; timelineChart.data._masterProg = dsProg; timelineChart.data._masterOpen = dsOpen;
      
      const isD = document.querySelector('#timeline-custom-legend .leg-chk[value="0"]')?.checked ?? true;

  }

  function createTimelineChart(ctx) {
      return new Chart(ctx, {
          type: 'bar',
          plugins: [{ 
            id:'customCanvasBackgroundColor', 
            beforeDraw:(chart, args, options)=>{ 
                const ctx = chart.ctx; 
                ctx.save(); 
                ctx.fillStyle = options.color || '#ffffff'; 
                ctx.fillRect(0,0,chart.width,chart.height); 
                ctx.restore(); 
            } 
          }, {
            id: 'slaOutline',
            beforeDatasetsDraw(chart) {
              const ctx = chart.ctx, xAxis = chart.scales.x;
              const URG_COLORS = { veryCritical: '#dc2626', within24hrs: '#d97706', within1week: '#eab308', within2months: '#2563eb' };
              const drawn = new Set();
              ctx.save();
              ctx.beginPath();
              ctx.rect(chart.chartArea.left, chart.chartArea.top, chart.chartArea.width, chart.chartArea.height);
              ctx.clip();

              chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;
                meta.data.forEach((bar, index) => {
                  const raw = dataset.data[index];
                  if (!raw || !raw._r) return;
                  const memoId = raw._r.createdAt;
                  if (drawn.has(memoId)) return;
                  drawn.add(memoId);
                  const r = raw._r, t0 = raw._totalX[0], durMs = URGENCY_MS[r.urgency] || 0;
                  if (durMs > 0) {
                    const targetT = t0 + durMs, startX = xAxis.getPixelForValue(t0), endX = xAxis.getPixelForValue(targetT);
                    const w = endX - startX, h = bar.height + 8, y = bar.y - h/2;
                    ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = URG_COLORS[r.urgency] || '#9ca3af'; 
                    if(ctx.roundRect) { ctx.roundRect(startX, y, w, h, 6); } else { ctx.rect(startX, y, w, h); }
                    ctx.stroke();
                  }
                });
              });
              ctx.restore();
            }
          }, {
            id: 'timelineShapes',
            afterDatasetsDraw(chart) {
              const ctx = chart.ctx;
              ctx.save();
              ctx.beginPath();
              ctx.rect(chart.chartArea.left, chart.chartArea.top, chart.chartArea.width, chart.chartArea.height);
              ctx.clip();

              chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;
                meta.data.forEach((bar, index) => {
                  const raw = dataset.data[index];
                  if (!raw || !raw._isOpenLine) return;
                  const yCenter = bar.y, h = bar.height;
                  const startX = chart.scales.x.getPixelForValue(raw._t0);
                  const endX = chart.scales.x.getPixelForValue(raw._t1);
                  ctx.beginPath(); ctx.moveTo(startX, yCenter); ctx.lineTo(endX, yCenter);
                  ctx.lineWidth = 2; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
                  ctx.beginPath(); ctx.arc(startX, yCenter, Math.min(h / 3, 5), 0, 2 * Math.PI);
                  ctx.fillStyle = '#9ca3af'; ctx.fill();
                });
              });
              ctx.restore();
            }
          }],
          data: { 
              labels:[], 
              datasets:[
                  {label:'Completed', data:[], backgroundColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(5, 150, 105, 0.45)', borderColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(5, 150, 105, 1)', borderWidth:1, borderRadius:6, borderSkipped:false, barPercentage:0.45}, 
                  {label:'In progress', data:[], backgroundColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(217, 119, 6, 0.45)', borderColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(217, 119, 6, 1)', borderWidth:1, borderRadius:6, borderSkipped:false, barPercentage:0.45}, 
                  {label:'Open', data:[], backgroundColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(156, 163, 175, 0.45)', borderColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(156, 163, 175, 1)', borderWidth:1, borderRadius:6, borderSkipped:false, barPercentage:0.45}
              ] 
          },
          options: {
              indexAxis: 'y', responsive: true, maintainAspectRatio: false,
              layout: { padding: { top: 0, bottom: 0, left: 0, right: 0 } },
              plugins: {

                          if (newYMax >= labelsLen) { newYMin -= (newYMax - (labelsLen - 1)); newYMax = labelsLen - 1; if (newYMin < 0) newYMin = 0; }
                      }

                      if (newYMax - newYMin >= 1) { 
                          chartInstance.options.scales.y.min = Math.max(0, Math.floor(newYMin));
                          chartInstance.options.scales.y.max = Math.min(labelsLen - 1, Math.ceil(newYMax));
                      }
                  }
              }
              chartInstance.update('none');
          }, { passive: false });

        });

      const centerTextPlugin = {

        beforeDraw: c => {

          ctx.restore();

          ctx.textAlign = "center";

          ctx.fillText(tot.toString(), centerX, centerY - 6);

          ctx.save();
        }

      const sliceLabelsPlugin = { 
        id:'sliceLabels', 
        afterDatasetsDraw: c => { 
          if(c.config.type!=='doughnut') return; 
          const ctx=c.ctx, ds=c.data.datasets[0], tot=ds.data.reduce((a,b)=>a+b,0);

            ctx.shadowColor='rgba(255,255,255,0.85)'; 
            ctx.shadowBlur=4; 
            ctx.fillText(Math.round((ds.data[i]/tot)*100)+'%', pos.x, pos.y); 
            ctx.shadowBlur=0; 
          });

      const urgCtx = document.getElementById('acm-urgency-chart');
      if (urgCtx) {
        if(urgencyChart) urgencyChart.destroy();
        urgencyChart = new Chart(urgCtx, { type: 'doughnut', plugins: [customBgPlugin, centerTextPlugin, sliceLabelsPlugin], data: { labels:['Completed', 'In progress', 'Open'], datasets:[{data:[0,0,0], backgroundColor:['rgba(5, 150, 105, 0.45)', 'rgba(217, 119, 6, 0.45)', 'rgba(156, 163, 175, 0.45)'], borderColor:['rgba(5, 150, 105, 1)', 'rgba(217, 119, 6, 1)', 'rgba(156, 163, 175, 1)'], borderWidth:1, hoverOffset:4}] }, options: { responsive:true, maintainAspectRatio:false, cutout:'45%', plugins:{ legend:{position:'right', labels:{usePointStyle:true, pointStyle:'circle', boxWidth:8, font:{size:11}}}, tooltip:{ backgroundColor:'rgba(17, 24, 39, 0.95)', titleFont:{size:13, weight:'bold'}, bodyFont:{size:12}, padding:10, cornerRadius:8, callbacks:{ label: c => ` ${c.label||''}: ${c.raw||0} memo${c.raw!==1?'s':''} (${Math.round(((c.raw||0)/(c.chart._metasets[c.datasetIndex].total||1))*100)}%)` } } } } });
      }

  function optimizeCameraImage(file, watermark = {}, maxDim = 1280, quality = 0.78) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type || !file.type.startsWith('image/')) {
        return reject(new Error('Invalid image file'));
      }
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Failed to read image'));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Failed to decode image'));
        img.onload = () => {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          const wmDate = watermark.date || '';
          const wmTime = watermark.time || '';
          const wmLoc = watermark.location || 'Not Specified';
          const wmTag = (watermark.tag || '').toUpperCase();
          const accent = watermark.accentColor || '#2563eb';

          const pad = Math.max(12, Math.round(w * 0.018));
          const fontSize = Math.max(13, Math.round(w * 0.021));
          const lineHeight = Math.round(fontSize * 1.42);
          const barHeight = lineHeight * 2 + pad * 1.5;
          const barY = h - barHeight;

          const grad = ctx.createLinearGradient(0, barY - pad, 0, h);
          grad.addColorStop(0, 'rgba(15, 23, 42, 0.58)');
          grad.addColorStop(1, 'rgba(15, 23, 42, 0.90)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, barY, w, barHeight);

          ctx.fillStyle = accent;
          ctx.fillRect(0, barY, Math.max(4, Math.round(w * 0.006)), barHeight);

          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 4;

          ctx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
          ctx.fillStyle = '#f8fafc';
          ctx.textAlign = 'left';
          const row1Y = barY + pad * 0.75 + lineHeight * 0.5;
          const row2Y = row1Y + lineHeight;
          ctx.fillText(`Date: ${wmDate}   |   Time: ${wmTime}`, pad * 1.35, row1Y);

          ctx.font = `600 ${fontSize}px ui-sans-serif, system-ui, -apple-system, sans-serif`;
          ctx.fillStyle = '#e2e8f0';
          const maxLocWidth = w - pad * 3.5;
          let locDisplay = `Location: ${wmLoc}`;
          while (ctx.measureText(locDisplay).width > maxLocWidth && locDisplay.length > 14) {
            locDisplay = locDisplay.slice(0, -4) + '...';
          }
          ctx.fillText(locDisplay, pad * 1.35, row2Y);

          if (wmTag) {
            ctx.font = `800 ${Math.max(11, Math.round(fontSize * 0.82))}px ui-sans-serif, system-ui, sans-serif`;
            ctx.fillStyle = accent;
            ctx.textAlign = 'right';
            ctx.fillText(wmTag, w - pad, row1Y);
          }

          ctx.shadowBlur = 0;
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function selectField(lbl, path, val, opts) { const list = (val && !opts.includes(val)) ? [val, ...opts] : opts; return `<label class="f">${lbl}<select data-path="${path}"><option value=""></option>${list.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></label>`; }

    container.querySelectorAll('[data-unit-path]').forEach(el => el.addEventListener((el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT')?'change':'input', () => {

        u.conveyorItem = autoConv;

      }
      syncParentFromUnits(r);

  function setByPath(obj, path, value) { const parts = path.split('.'); let cur = obj; for (let i = 0; i < parts.length - 1; i++) { cur = cur[isFinite(parts[i]) ? Number(parts[i]) : parts[i]]; } cur[parts[parts.length - 1]] = value; }

  function esc(v) { return (v === undefined || v === null) ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function mark(c) { return c ? 'X' : '&nbsp;'; }
  function displayDate(iso) { return (!iso || !iso.includes('-')) ? iso : `${iso.split('-')[2]}/${iso.split('-')[1]}/${iso.split('-')[0].slice(-2)}`; }
  function displayFullDate(r) {
    if (r.happeningDate && String(r.happeningDate).includes('-')) {
      const p = String(r.happeningDate).substring(0, 10).split('-');
      if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
    }
    if (r.beforeImageDate) return r.beforeImageDate;
    if (r.dd || r.mm || r.yy) return `${(r.dd||'--').padStart(2,'0')}/${(r.mm||'--').padStart(2,'0')}/${r.yy||'--'}`;
    return '—';
  }

  const DRIVE_IMG_CACHE = {};
  function extractDriveFileId(url) {
    if (!url || typeof url !== 'string') return '';
    const m1 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m1) return m1[1];
    const m2 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    return m2 ? m2[1] : '';
  }

  function fetchDriveImageAsDataUrl(url) {
    return new Promise((resolve) => {
      if (!url) return resolve('');
      if (String(url).startsWith('data:image/')) return resolve(url);
      const fileId = extractDriveFileId(url);
      if (!fileId || !navigator.onLine) return resolve('');
      if (DRIVE_IMG_CACHE[fileId]) return resolve(DRIVE_IMG_CACHE[fileId]);

      const cbName = 'ppmImgCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const script = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); resolve(''); }, 15000);

      function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function(res) {
        cleanup();
        if (res && res.ok && res.dataUrl) {
          DRIVE_IMG_CACHE[fileId] = res.dataUrl;
          resolve(res.dataUrl);
        } else {
          resolve('');
        }
      };

      script.onerror = function() { cleanup(); resolve(''); };
      script.src = `${WEB_APP_URL}?action=image&id=${encodeURIComponent(fileId)}&callback=${cbName}&t=${Date.now()}`;
      document.body.appendChild(script);
    });
  }

  function waitForImageReady(imgEl) {
    return new Promise((resolve) => {
      if (imgEl.complete && imgEl.naturalWidth > 0) return resolve();
      const done = () => { imgEl.removeEventListener('load', done); imgEl.removeEventListener('error', done); resolve(); };
      imgEl.addEventListener('load', done);
      imgEl.addEventListener('error', done);
    });
  }

                  <tr>
                    <td class="ctrl-lbl">Work Order No.</td>
                    <td class="ctrl-val mono-font">${esc(r.workOrderNo) || '—'}</td>
                  </tr>
                  <tr>
                    <td class="ctrl-lbl">Maintenance Type</td>
                    <td class="ctrl-val">${esc(r.maintenanceType) || '—'}</td>
                  </tr>
                </table>
              </div>
            </div>

            ${bodySectionsHtml}
          </div>

          <!-- DOCUMENT FOOTER -->
          <div class="ppm-doc-foot">
            <span>**Please ensure all required fields, operating parameters, and watermarked reference photos are verified.</span>
            <span class="doc-footer-code mono-font">BHS/MP03/PPM/Rev.01</span>
          </div>
        </div>
      </div>`;

    container.querySelectorAll('[data-doc-zoom-src]').forEach(imgEl => {
      imgEl.addEventListener('click', () => {
        const src = imgEl.getAttribute('data-doc-zoom-src');
        const label = imgEl.getAttribute('data-doc-zoom-title') || 'Reference Image';
        openImageLightbox(label, src);
      });
    });

    container.querySelector('#acm-doc-recpick').addEventListener('change', async (e) => {
      if (state.isDirty) {
        const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved");
        if (!discard) { e.target.value = state.activeId; return; }
        revertActiveRecord();
      }
      state.activeId = String(e.target.value);
      render();
    });
    container.querySelector('#acm-edit-btn').addEventListener('click', () => { state.tab = 'input'; render(); });
    container.querySelector('#acm-print-btn').addEventListener('click', () => window.print());
    container.querySelector('#acm-doc-jpeg-btn').addEventListener('click', async () => {
      if (typeof html2canvas === 'undefined') {
        showModal("Notice", "Export library is still loading. Please try again in a moment.");
        return;
      }
      const pageEl = document.getElementById('acm-doc-page');
      const jpegBtn = container.querySelector('#acm-doc-jpeg-btn');
      const origTxt = jpegBtn.textContent;
      jpegBtn.textContent = 'Preparing photos...';
      jpegBtn.disabled = true;

      const imgEls = Array.from(pageEl.querySelectorAll('.ppm-photo-stage img'));
      const originalSrcs = imgEls.map(img => img.getAttribute('src') || '');
      let failedCloudPhotos = 0;

      try {
        await Promise.all(imgEls.map(async (imgEl, idx) => {
          const src = originalSrcs[idx];
          if (!src || src.startsWith('data:image/')) return;
          const dataUrl = await fetchDriveImageAsDataUrl(src);
          if (dataUrl) {
            imgEl.setAttribute('src', dataUrl);
            await waitForImageReady(imgEl);
          } else {
            failedCloudPhotos++;
          }
        }));

        jpegBtn.textContent = 'Exporting...';
        const canvas = await html2canvas(pageEl, {
          scale: 2,
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#ffffff'
        });

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = `BHS_PPM_${(r.reportNo || 'Draft').replace(/[^a-zA-Z0-9_-]/g, '_')}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        if (failedCloudPhotos > 0) {
          showModal("Export Notice", "JPEG saved, but one or more cloud photos could not be fetched. Please make sure you have deployed the latest version of Code.gs in Google Apps Script.", "alert");
        }
      } catch (err) {
        console.error(err);
        showModal("Export Notice", "Unable to export JPEG with cloud-hosted photos. Please ensure the latest Code.gs is deployed as a New Version, or use 'Print / Save as PDF'.", "alert");
      } finally {
        imgEls.forEach((imgEl, idx) => {
          if (originalSrcs[idx] && imgEl.getAttribute('src') !== originalSrcs[idx]) {
            imgEl.setAttribute('src', originalSrcs[idx]);
          }
        });
        jpegBtn.textContent = origTxt;
        jpegBtn.disabled = false;
      }
    });
  }

  function render() {
    ROOT.innerHTML = `<div class="wrap"><div class="topbar"><div class="brand"><div class="k">KLIA - Baggage Handling System T1</div><div class="t">BHS Maintenance : Planned Preventative Maintenance (PPM)</div></div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div id="ppm-net-status" class="net-status-wrap"></div><div class="tabs"><button class="tab-btn ${state.tab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button><button class="tab-btn ${state.tab==='input'?'active':''}" data-tab="input">Memo Details</button><button class="tab-btn ${state.tab==='document'?'active':''}" data-tab="document">Memo View</button></div></div></div><div id="acm-content"></div></div>`;
    updateNetworkBadge();
    ROOT.querySelectorAll('.tab-btn').forEach(b => {
      b.addEventListener('click', async () => { 
        const targetTab = b.getAttribute('data-tab');
        if (state.tab === 'input' && targetTab !== 'input' && state.isDirty) { const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved"); if (!discard) return; revertActiveRecord(); }
        state.tab = targetTab;
        render();
        if (targetTab === 'input' && !navigator.onLine) {
          notifyOfflineEntry(false);
        }
      });
    });
    const content = document.getElementById('acm-content');
    if (!state.loaded) { content.innerHTML = `<div class="empty-state">Loading records…</div>`; return; }
    if (state.tab === 'dashboard') renderDashboard(content);
    else if (state.tab === 'input') renderInput(content);
    else renderDocument(content);
  }

  document.addEventListener('click', () => document.querySelectorAll('.dd-menu').forEach(m => m.classList.remove('open')));

  window.addEventListener('online', () => {
    state.isOnline = true;
    state.offlineEntryNotified = false;
    updateNetworkBadge();
    syncOfflineQueue(false, true);
  });

  window.addEventListener('offline', () => {
    state.isOnline = false;
    updateNetworkBadge();
    notifyOfflineEntry(false);
  });

  setInterval(() => {
    if (navigator.onLine && !state.isSyncing && getPendingCount() > 0) {
      syncOfflineQueue(false, true);
    }
  }, 20000);

  render();
  loadRecords();
})();
</script>
<script>
  if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
